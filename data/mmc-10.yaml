  lead: Današnja ujma je povzročila verjetno največjo škodo v naravnih nesrečah v
    zgodovini samostojne Slovenije, je na novinarski konferenci dejal premier Robert
    Golob. Pomoč so ponudili številne sosednje države in EU, o čemer bo vlada razpravljala
    v soboto.
  mention:
  - Marjan Šarec
  - ' Boštjan Poklukar'
  - Srečko Šestan
  - Janez Polajnar
  paragraphs:
  - '"Po sobotni seji vlade bomo vložili novelo zakona o odpravi posledic naravnih
    nesreč, DZ bi jo lahko obravnaval že prihodnji teden," je še dejal Golob.'
  - 'Predsednik vlade je izrazil sožalje svojcem žrtve poplav in obenem izrekel zahvalo
    vsem, ki v tem času nesebično pomagajo ljudem: pripadnikom civilne zaščite, gasilcem,
    policistom, pripadnikom Slovenske vojske, prostovoljcem. Dejal je, da je slovenski
    sistem zaščite in reševanja najboljši v Evropi in razlog, da lahko zremo z optimizmom
    v prihodnost ne glede na to, da se je tokrat narava resnično znesla nad večino
    Slovenije.'
  - Golob meni, da bo tokratna škoda najbrž rekordna škoda zaradi ujm v času samostojne
    Slovenije. Napovedal je Sejo sveta za nacionalno varnost, ki bo v soboto ob 11.
    uri. Tam bodo vsi politični akterji vključno z opozicijo, da bi poskrbeli, kot
    je dejal, "da v teh časih ostanemo skupaj in smo čim učinkovitejši pri ukrepih".
  - Ob 13. uri bo seja vlade, na kateri bodo obravnavali novelo zakona o odpravi posledic
    naravnih nesreč, ki predvideva vnaprejšnje 20-odstotno povračilo ocenjene škode
    lokalnim skupnostim za izvedbo najnujnejše sanacije. Predsednik vlade pričakuje
    obravnavo v DZ-ju že v torek ali v sredo. Obravnavali bodo tudi pomoč, ki so jo
    ponudili prijateljske sosednje države in Bruselj.
  - Predsednik vlade je pozval ljudi, naj vsaj še nekaj časa ne hodijo naokoli po
    opravkih, ki niso življenjsko pomembni, saj s tem ne ogrožajo samo sebe, temveč
    tudi interventne ekipe. Na sobotni seji vlade bodo obravnavali tudi ukrep odprtja
    trgovin prihajajočo nedeljo, da ljudje v soboto, ko bo še nevarno, ne bi po nepotrebnem
    hiteli po nakupih, je še napovedal predsednik vlade.
  - Obrambni minister Marjan Šarec je dejal, da so ekipe na terenu že od nočnih oziroma
    jutranjih ur. Na terenu so civilna zaščita, gasilci in Slovenska vojska. " Kar
    se tiče Slovenske vojske, moram povedati, da imamo ta hip na razpolago do 500
    vojakov, ki še niso vsi aktivirani, to pa zato, ker tudi sam potek intervencije
    še ne omogoča povsod dostopa." Enote se ponekod še prebijajo na lokacije, ponekod
    že delajo, tako da ni bojazni, da bi Slovenska vojska ne bila aktivirana v maksimalnem
    sestavu, kolikor je potrebno, je dejal in dodal, da je treba počakati na jutrišnji
    dan, ko bomo videli, kaj bo prineslo nočno deževje. Šarec upa, da bo prevoznost
    cest že toliko boljša, da bodo ekipe lahko povsod tam, kjer jih potrebujejo.
  - Tudi Šarec državljanke in državljane poziva, naj se ne izpostavljajo nevarnosti
    in naj se ne zadržujejo v bližini vodotokov in intervencijskih ekip. Najpomembnejše
    je reševanje življenje, v drugi fazi se rešuje tudi imetje in potem seveda šele
    v naslednji fazi nastopi sanacija. "Sistem deluje in bodite potrpežljivi, kličite
    na 112 res takrat, ko je nujno. V prihodnjih dneh se bo situacija zagotovo že
    toliko izboljšala, da bodo zadeve potekale bolj normalno," je še dejal Šarec.
  - Notranji minister Boštjan Poklukar je dejal, da sistem notranje varnosti kljub
    katastrofalnim poplavam deluje in da slovenska policija že od zgodnjih jutranjih
    ur izvaja tako redne kot izredne naloge tudi po državnem načrtu ob poplavah. Tako
    je policija z letalsko enoto – najprej z dvema helikopterjema dopoldne, popoldne
    pa še s tretjim – in z gorsko enoto policije izvajala reševanje na prizadetih
    območjih, kjer je iz treh hiš in iz drugih zgradb reševala ljudi iz odrezanih
    delov Slovenije in jih prepeljala v varno okolje.
  - Dodal je, da deluje tudi sistem upravno-notranjih zadev, kar pomeni, da je Slovenija
    danes, na delovni dan, tudi na prizadetih območjih izdajala vse listine, tako
    osebne izkaznice kot potne listine za vse tiste, ki so to nujno želeli. "Posebej
    je treba poudariti, da je slovenska policija odprla policijsko akademijo v Tacnu
    za ljudi, ki potrebujejo streho nad glavo, saj smo danes imeli zaradi povišanega
    vodostaja Save v Tacnu kar nekaj prebivalcev Tacna nastanjenih na policijski akademiji,"
    je dodal. Policijska akademija ima kapacitete za 120 ljudi, vsem so zagotovili
    hrano. Kot je poudaril, so kapacitete za nastanitev pomoči potrebnim na voljo
    tudi v vadbenem centru Vinka Beznika v Gotinici.
  - Opozoril je, da je še vedno nujno spoštovati izrecne odredbe, opozorila in navodila
    policije in vseh pristojnih služb, saj se še kar dogaja, da čez infrastrukturo,
    ki je močno poškodovana, mostove in po cestah kljub zaporam še vedno potekata
    tovorni promet in tudi osebni promet.
  - Poveljnik civilne zaščite Srečko Šestan se je zahvalil policiji in vojski za pomoč.
    Točnega podatka, koliko ljudi so rešili, še nima, meni pa, da jih je gotovo okoli
    dvesto. "Prebivalci na teh območjih situacijo dobro poznajo. Ne dogaja se prvič
    in verjetno tudi ne zadnjič. Bili so pravočasno obveščeni, tudi s sirenami, tudi
    prek lokalnih medijev, tako da bi vsak odgovoren prebivalec moral vedeti, kje
    je, kakšna je njegova hiša, kakšno ogroženost predstavlja voda tej hiši, in upam,
    da bodo odzivi boljši, kot so bili na teh območjih, ki so bila danes poplavljena,"
    je dejal Šestan.
  - Šestan je dodal še, da so poplavljali hudourniki, kar pomeni, da so se dogodki
    odvijali zelo hitro in so marsikoga presenetili. "Upajmo, da bo teh hudourniških
    zadev jutri bistveno manj in bodo ljudje imeli tudi čas ukrepati. Jih pa že nekaj
    dni opozarjamo na to. Tako po nekaterih občinah že potekajo dejavnosti, kot sta
    priprava in delitev vreč s peskom. Prepričan sem, da so prebivalci na teh območjih
    dobro o tem obveščeni, ozaveščeni, tako da mislim, da ne bi smelo biti večjih
    težav," je še dejal.
  - Hidrolog Janez Polajnar je povedal, da se visokovodne razmere s prizadetih območij
    selijo v srednje in spodnje predele rečnih strug. Najbolj bo to občutno na velikih
    rekah – na Savi, ki je v okolici Ljubljane že dosegla rekordni pretok. Ta pretok
    bo ponoči in zjutraj potoval po Zasavju in Posavju do hrvaške meje, kjer prav
    tako pričakujejo rekordni pretok, okoli 3800 kubičnih metrov na sekundo. Nekaj
    podobnega, kot je bilo leta 2010. Savinja bo v srednjem in spodnjem toku začela
    upadati šele proti jutru. Drava k sreči, kot je poudaril Polajnar, ponoči naj
    ne bi več naraščala, saj so iz Avstrije sporočili, da bodo nekoliko zmanjšali
    dotok. Po zadnjih podatkih naj bi v Slovenijo priteklo 900 kubičnih metrov na
    sekundo. A to še vedno pomeni, da je pod jezom Markovci, na spodnjem toku Drave,
    pretok skoraj 2000 kubičnih metrov na sekundo.
  - Mura bo ponoči še naraščala, njen pretok bo 1350 m3 na sekundo, kar je že tisti
    pretok, ki pomeni, da pride Mura do roba protipoplavnih nasipov.
  - V prvem delu noči se bodo še pojavljali nalivi predvsem v osrednji, vzhodni in
    južni Sloveniji. Na teh območjih so še mogoča tudi hudourniška razlivanja manjših
    rek in potokov, ki bodo prispevali dodatno vodo večjim rekam.
  - Hidrologi predvidevajo, da se bodo hidrološke razmere začele umirjati v soboto
    čez dan, popoldne, proti večeru in v noči na nedeljo.
  - Predsednica republike Nataša Pirc Musar, ki je državljane nagovorila dopoldne,
    zagotavlja, da se sprejemajo "vsi potrebni ukrepi za zaščito ljudi, ki so v tem
    trenutku mogoči in izvedljivi".
  - '" Naša država se sooča s preizkušnjo, ki zahteva enotnost, medsebojno pomoč in
    hitro ukrepanje," je poudarila predsednica Nataša Pirc Musar. Potrdila je, da
    so s pristojnimi službami in vlado ves čas v stalnem stiku in spremljajo razmere.
    " Gasilcem, vojakom, policistom, reševalcem, pripadnikom civilne zaščite, prostovoljcem
    in vsem, ki se nesebično trudite, da bi zaščitili življenja in premoženje, izrekam
    iskreno hvaležnost in globoko spoštovanje."'
  - Vsem, ki so jih poplave in neurja prizadeli, je zagotovila, da niso sami in da
    bodo storili vse, " kar je v njihovi moči, da jim pomagajo ". Ob tem je vse nagovorila,
    naj sledijo navodilom pristojnih služb, zaupajo reševalnim ekipam in ostanejo
    na varnem do njihovega prihoda. " Verjamem, da se bomo, kot smo se že mnogokrat
    v preteklosti, tudi tokrat združili kot narod in situacijo premagali skupaj."
    Sožalje in podporo je izrazila vsem, ki so utrpeli škodo ali izgubili koga od
    bližnjih.
  - Potrdila je, da se bo na teren odpravila tudi sama.
  - Na izredne razmere se je odzvala tudi predsednica državnega zbora Urška Klakočar
    Zupančič, ki je zapisala, da zdaj ni čas za politične delitve, temveč za združevanje
    in tovarištvo ter za pomoč najšibkejšim. Izrazila je podporo vsem, ki pomagajo
    ljudem na prizadetih območjih.
  - '"Pretresena sem, ko vidim, kakšna je neizmerna moč narave in kaj vse je uničeno.
    Z grozo gledam posnetke poplav, uničenih hiš, cest in preostale infrastrukture.
    Vsaka smrtna žrtev je preveč," je poudarila. Ob tem je vsem svojcem smrtnih žrtev
    v osebnem imenu in imenu vseh poslank in poslancev DZ-ja izrekla iskreno sožalje
    ter sočutje vsem, ki so jih poplave prizadele in oškodovale.'
  - Vremenoslovci napovedujejo nadaljevanje obsežnih padavin, zato je po mnenju Klakočar
    Zupančič zdaj čas, da stopimo skupaj in si pomagamo.
