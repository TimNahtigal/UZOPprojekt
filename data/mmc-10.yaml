  paragraphs:
  - '"Ukrajina se ne bo nikoli podredila okupatorjem, ruska vojska pa bo kaznovana
    zaradi kršenja mednarodnega prava," je na omrežju X zapisalo ukrajinsko ministrstvo
    za zunanje zadeve. Kremelj je medtem sporočil, da Rusija namerava dokončati "vojaško
    operacijo", kot vojno označujejo v Moskvi.'
  - '"Vojaška operacija proti Kijevu se nadaljuje," je novinarjem povedal tiskovni
    predstavnik Kremlja Dmitrij Peskov in dodal, da zahodna pomoč "ne more vplivati
    na izid naše operacije. Ta se nadaljuje in bo dokončana", poroča francoska tiskovna
    agencija AFP.'
  - Ukrajinski predsednik Volodimir Zelenski je na izrednem zasedanju Evropskega parlamenta
    v Bruslju poudaril, da je treba po tisoč dneh vojne še močneje pritisniti na Moskvo,
    da bi dosegli pravični mir. Pri tem je pozval k še strožjim sankcijam in dodatni
    oborožitvi.
  - Zelenski je v videoprenosu evroposlancem in evroposlankam dejal, da je ruski predsednik
    Vladimir Putin osredotočen na zmago v tej vojni in da se sam od sebe ne bo ustavil.
    "Čim več časa ima na voljo, tem slabši so pogoji. Vsak dan je najboljši trenutek
    za to, da se na Rusijo še bolj potisne," je poudaril.
  - Pri tem je prepričan, da je treba Rusiji onemogočiti nadaljnjo prodajo nafte,
    ki je glavni vir financiranja za ruski vojni stroj, ter pozval k strožjim sankcijam
    in dodatni dobavi orožja.
  - Zahvalil se je še partnerjem v EU-ju in po svetu, da so pomagali preprečiti Putinu,
    da prevzame Ukrajino in da se obrani svoboda celotne Unije. "Nihče ne more uživati
    v mirnih vodah med nevihto," je še dodal. Ob tem pa se je zavzel, da je treba
    narediti vse, da se ta vojna pravično konča, in izrazil prepričanje, da bo leto
    2025 odločilno.
  - Predsednica Evropske komisije Ursula von der Leyen je izrazila podporo Kijevu,
    ki bo po njenih besedah še naprej deležen pomoči evropskih zaveznic. Kot je dejala,
    je danes dan žalovanja, a tudi dan obljub. "Obljubimo, da vam bomo stali ob strani,
    dokler bo treba," je dejala v sporočilu, objavljenem na X-u.
  - Predsednica Evropskega parlamenta Roberta Mestola je v uvodnem govoru spomnila,
    da je Evropski parlament stal ob strani Kijeva že preteklih tisoč dni in da to
    nameravajo početi tudi v prihodnje. "Kolikor časa bo potrebno," je dodala.
  - Rusko agresijo je označila za napad na naše vrednote in način življenja. "Na kocki
    so mir, demokracija in svoboda," je dejala. "Vedno se bomo zavzemali za mir –
    pravi mir, ki temelji na pravičnosti, dostojanstvu in konceptu 'nič o Ukrajini
    brez Ukrajine'," je še poudarila.
  - Sodelovanje med Evropo in ZDA je ključno za čezatlantsko varnost, je na srečanju
    zunanjih ministrov petih članic EU-a in Združenega kraljestva v Varšavi dejal
    poljski zunanji minister Radoslaw Sikorski. Če bodo ZDA zmanjšale pomoč Ukrajini,
    pa so večje članice EU-ja Kijevu pripravljene zagotoviti finančno in vojaško pomoč,
    je poudaril.
  - Vodje diplomacij Francije, Nemčije, Italije, Španije in Poljske ter Združenega
    kraljestva so ob tisočem dnevu vojne v Ukrajini govorili o prihodnosti Evrope
    in čezatlantskih odnosih po volitvah v ZDA.
  - V trenutnih geopolitičnih razmerah je sodelovanje med Evropo in ZDA ključno za
    varnost, je pri tem po poročanju tujih agencij ocenil Sikorski. "Le močne čezatlantske
    vezi nam bodo omogočile, da se učinkovito zoperstavimo naraščajočim grožnjam iz
    Rusije in drugih držav," je dejal.
  - '"Z zadovoljstvom ugotavljam, da so glavne države Evropske unije pripravljene
    prevzeti breme vojaške in finančne podpore Ukrajini v kontekstu morebitnega zmanjšanja
    zavez ZDA," je po poročanju francoske tiskovne agencije AFP dejal poljski zunanji
    minister.'
  - Po njegovih besedah je to prvič, da se je pet največjih držav Evropske unije v
    Varšavi izreklo za "obrambne evroobveznice".
  - 'Napoved je pozdravil tudi italijanski zunanji minister Antonio Tajani. "Današnje
    sporočilo je jasno: še naprej bomo podpirali Ukrajino z vojaškega, gospodarskega
    in političnega vidika," je dejal Tajani, poroča italijanska tiskovna agencija
    Ansa.'
  - Francoski zunanji minister Jean-Noel Barrot pa je dejal, da je treba uporabiti
    "vse vzvode, ki so nam na voljo, vključno s finančno in gospodarsko zmogljivostjo
    EU-ja, za našo varnost in razvoj evropske obrambne industrijske in tehnološke
    baze".
  - Tudi v Londonu so napovedali novo vojaško pomoč Kijevu. Kot je dejal obrambni
    minister John Healey, bo britanska vlada 7,5 milijona funtov (devet milijonov
    evrov) namenila v poseben sklad za dobavo brezpilotnih letalnikov Ukrajini. Britanski
    parlament bo o nadaljnji dolgoročni pomoči Ukrajini razpravljal v sredo, poroča
    nemška tiskovna agencija DPA.
  - Healey je poudaril, da je nujno, da mednarodni partnerji Kijeva pred prihajajočo
    zimo stopijo skupaj in zagotovijo, da ruski predsednik Vladimir Putin ne zmaga
    v tej vojni.
  - Ukrajinski poslanci so sprejeli proračun za prihodnje leto, v katerem je za obrambo
    in varnost namenjenih okoli 50 milijard evrov oziroma 60 odstotkov vseh izdatkov.
    Kot je ob sprejetju dejal ukrajinski premier Denis Šmigalj, bodo vsi davki državljanov
    in podjetij namenjeni za obrambo in varnost.
  - '"Državni proračun za leto 2025 je bil sprejet. Vsi davki državljanov in podjetij
    bodo naslednje leto namenjeni za obrambo in varnost naše države," je po poročanju
    francoske tiskovne agencije AFP na Telegramu zapisal Šmigalj.'
  - V Moskvi pa so poslanci dume konec oktobra v prvi obravnavi potrdili predlog proračuna,
    po katerem bi se obrambni izdatki prihodnje leto povečali za skoraj 30 odstotkov
    in bi znašali približno 134 milijard evrov. S proračunom bi Rusija tako za obrambo
    namenjala več kot za socialne izdatke in izobraževanje skupaj.
  - Obrambni izdatki sicer ne vključujejo vseh sredstev, ki jih Rusija namenja za
    vojno v Ukrajini. Ti namreč vključujejo tudi izdatke, ki jih Moskva označuje kot
    "notranja varnost" oziroma kot "strogo zaupno".
  - V ruskem napadu z brezpilotnimi letalniki na Sumsko oblast na severovzhodu Ukrajine
    je bilo ubitih najmanj osem ljudi, vključno z otrokom, so sporočili ukrajinski
    uradniki.
  - V napadu je bil uničen študentski dom v mestu Gluhiv, je sporočil Zelenski. "Letalnik
    je zadel Gluhiv in uničil študentski dom v eni od lokalnih izobraževalnih ustanov.
    Tragično, zdaj vemo, da je bilo v tem napadu ubitih sedem ljudi, med njimi otrok,"
    je zapisal Zelenski na X-u.
  - Objavil je videoposnetek, ki prikazuje, kako reševalci ob zori preiskujejo ruševine.
    "Več kot deset ljudi je bilo ranjenih, med njimi dva otroka, in morda so pod ruševinami
    še vedno ujeti ljudje," je opozoril.
  - '"Vsak dan pozivamo svet, naj bo dovolj odločen in močan za Ukrajino, da prepreči
    te napade," je zapisal in dodal, da je treba Rusijo prisiliti k pravičnemu miru.'
  - Nov napad se je zgodil, potem ko je bilo v ponedeljek v ruskem raketnem napadu
    na pristaniško mesto Odesa ubitih deset ljudi, ranjenih pa 44. Med ubitimi so
    bili tudi štirje otroci. Med žrtvami je sedem policistov, reševalec in dva prebivalca,
    je sporočila policija, med ranjenimi je tudi 14 policistov.
  - Kot je dejal ukrajinski predsednik Zelenski, je ruska balistična raketa zadela
    stanovanjsko sosesko.
  - Ruske sile pospešujejo svoje napredovanje pri zasedbi vzhodnega dela Ukrajine.
    Vzdolž 1000 kilometrov dolge fronte se je Rusija v napadih osredinila na mesta
    in vasi okoli transportnega vozlišča Pokrovsk. Zasedba tega mesta bi močno otežila
    zmožnosti Ukrajine za oskrbo svojih enot.
  - Ukrajina se medtem pripravlja na spremembo na položaju predsednika ZDA, največje
    podpornice Ukrajine. Joeja Bidna bo januarja nasledil Donald Trump, ki naj bi
    bil manj naklonjen vojaški pomoči Ukrajini kot sedanji predsednik.
  - Potem ko so ameriški mediji v nedeljo na podlagi neimenovanih vladnih virov poročali,
    da je Biden odobril uporabo sistemov ATACMS za napade v Rusiji – česar Washington
    uradno ni potrdil –, naj bi se za podoben ukrep odločilo Združeno kraljestvo.
  - Članice Varnostnega sveta ZN-a so v ponedeljek na zasedanju o Ukrajini po tisoč
    dneh ruske agresije pozivale k pravičnemu miru.
  - Veleposlanica ZDA Linda Thomas-Greenfield je dejala, da bo ob koncu vojne suverena,
    neodvisna in demokratična Ukrajina nadzirala svoje mednarodno priznano ozemlje
    in nadaljevala pot v evroatlantske ustanove, kot je zveza Nato. Napovedala je,
    da bodo ZDA v kratkem naznanile dodatno varnostno pomoč Ukrajini.
  - Ukrajinski zunanji minister Andrij Sibiga je zavrnil možnost miru, v katerem bi
    Ukrajina Rusiji prepustila svoje ozemlje, in novinarjem povedal, da bo Bidnova
    odobritev uporabe ameriških raket za napade v Rusiji spremenila igro. "Dlje ko
    lahko napademo, krajša bo ta vojna," je dejal.
  - Generalna podsekretarka ZN-a za politične zadeve Rosemary DiCarlo je v imenu generalnega
    sekretarja ZN-a Antonia Guterresa prebrala njegov govor, v katerem pravi, da se
    po tisoč dneh smrt, uničevanje in obup nadaljujejo za milijone Ukrajincev.
  - Guterres je obsodil naraščanje števila žrtev med civilisti in zadnji ruski napad
    konec tedna s 120 raketami in 90 droni na energetsko infrastrukturo. "Takšni napadi
    za prebivalce Ukrajine ustvarjajo najhujšo zimo od začetka vojne," meni Guterres,
    ki v svojem govoru navaja, da so ruske sile v Ukrajini uničile ali poškodovale
    1358 šol in 580 zdravstvenih objektov.
  - Vojna je doslej po podatkih ZN-a zahtevala 12.164 življenj med ukrajinskimi civilisti,
    več kot deset milijonov pa jih je zapustilo domove. DiCarlo je navedla, da bo
    celotna generacija ukrajinskih otrok brez normalne izobrazbe, četrtina ozemlja
    države pa je onesnažena z minami. "Skrajni čas je za pravičen mir v skladu z Ustanovno
    listino ZN-a, mednarodnim pravom in resolucijami Generalne skupščine," je dejala.
  - '"Čim prej potrebujemo pravičen in trajen mir, ki ne bo na škodo mednarodnega
    prava in bo temeljil na Ustanovni listini ZN-a ter varoval ukrajinsko suverenost,
    neodvisnost in ozemeljsko celovitost v okvirju njenih mednarodno priznanih meja.
    Ukrajina se mora kot napadena država strinjati z mirovnim načrtom," je dejal državni
    sekretar Marko Štucin in zagotovil, da bo Slovenija Ukrajino podpirala do konca
    vojne.'
  - Za pravičen mir so se na zasedanju na visoki ravni zavzeli tudi drugi govorniki
    z redkimi izjemami. Kitajska je denimo zahtevala le mir, ruski veleposlanik Vasilij
    Nebenzja pa je napadal Ukrajino in dejal, da je zasedanje nepomembno ter le priložnost
    za neutemeljene napade na Rusijo.
  title: Mineva 1000 dni od začetka invazije v Ukrajini
