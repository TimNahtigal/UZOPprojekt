  lead: 'Veliko staršev ima o svojih otrocih superiorno mnenje in otroci prav zaradi
    bojazni pred osramočenostjo in razočaranjem staršev pogosto ne upajo povedati,
    da so žrtve medvrstniškega nasilja, je v oddaji Ob osmih dejala sociologinja Lucija
    Čevnik. '
  mention:
  - Metka Pirc
  - Lucija Čevnik.
  paragraphs:
  - Kar se dogaja med otroki, je pogosto le odraz staršev in družbe, v kateri živimo.
    Živimo v družbi, kjer poudarjamo ničelno toleranco do vsakršnega nasilja. Pa vendar
    že pogled na komentarje odraslih na družbenih omrežjih in portalih kaže povsem
    drugačno sliko. "Pomembno je, da se čim več pogovarjamo, da učenci delijo z drugimi
    nestrinjanje, ko opazijo medvrstniško nasilje, in se znajo postaviti na stran
    žrtve. Da so zaščitniki in ne da oni rešujejo težave, temveč da znajo poiskati
    pomoč," je v oddaji Ob osmih poudarila sociologinja Lucija Čevnik. Javnost pretresajo
    vedno novi primeri medvrstniškega nasilja. To pogosto ostaja skrito, med vrstniki.
    Še huje je na spletu, kjer je osredotočeno na ozke in zaprte skupine. A veliko
    lahko naredimo z opolnomočenjem opazovalcev. Mehanizem delovanja medvrstniškega
    nasilja je znan, s primernim ukrepanjem struktura razpade sama od sebe, poudarja
    Čevnik.
  - Navijačem je smešno, opazovalci molčijo
  - Ko danes govorimo o medvrstniškem nasilju, govorimo o strukturi, ki je hierarhično
    urejena, pojasnjuje Čevnik. Vsak mladi hoče v razredu ustvariti svoj status, biti
    prepoznan, vpliven. Težava nastane, ko skušajo to pridobiti na račun drugih, boleče,
    in izvajajo medvrstniško nasilje. Kot pravi Čevnik, so to vodje. To niso nujno
    slabi učenci z vedenjskimi težavami. "To so lahko učenci, ki so pri učiteljih
    zelo priljubljeni, na zunaj ne kažejo znakov nasilništva. Ti vodje imajo pomočnike,
    po navadi kake tri dobre prijatelje, ki jim stojijo ob strani, se dobro počutijo
    v njihovi družbi. To so učenci, ki so v šoli kaznovani, prepoznani nasilneži in
    izvajajo nasilje pod vplivom vodje. Potem imamo navijače, to so tisti, ki se jim
    zdi super, da se nekaj dogaja in jim je to smešno. Potem pa imamo žrtev, ki je
    zelo nemočna, socialno popolnoma izolirana in si ne more pomagati sama," razlaga
    Čevnik. V tej hierarhiji se posebej ustavi pri opazovalcih. To je večina otrok
    v razredu, ki se nočejo vpletati v odnose.
  - '"Ni jim všeč, a nočejo biti del nasilja. Ne vedo, ali bi se to lahko obrnilo
    proti njim, če bi se vmešali," pravi. Poudari, kako pomembno je, da prav ti opazovalci
    spregovorijo. "Če imamo vsaj enega, ki se postavi na stran žrtev, zaščitnika,
    potem ta hierarhija razpade, ni več smešna, ni več dinamike, da bi kdo plezal
    po hierarhiji navzgor in pridobival moč. In če se jih na stran žrtve postavi še
    več, nasilja ni več," poudari.'
  - Vsi vidijo, spregovorijo pa ne
  - Pogovor je ključ tudi v teh primerih. " Ko izvajam delavnice za učence, povem
    pravljico Cesarjeva nova oblačila. V njej vsi vidijo, da je cesar gol, a nihče
    ne reče ničesar. Podobno je pri medvrstniškem nasilju. Ta dinamika je nasilna,
    moteča. Ampak ker otrok ne ve, kaj si misli njegova druga sošolka, ki je tudi
    v krogu opazovalcev, noče povedati niti svojega mnenja. Početje nasilneža moti
    večino otrok," pravi Čevnik. Medvrstniško nasilje spremljata strah in osramočenost.
    " Strah, kaj se mi bo zgodilo jutri, in osramočenost, da si ne morem pomagati
    sam," pove Čevrnik. Prav zaradi sramu o tem pogosto ne obvestijo svojih staršev.
    Kot razlaga, ima veliko staršev superiorno mnenje o svojih otrocih. Hvalijo jih
    in poveličujejo. Potem pa se situacija spremeni, ko otrok postane žrtev medvrstniškega
    nasilja. To se ne ujema z vlogo, ki so mu jo namenili starši. Posameznik ob tem
    meni, da bo razočaral starše, ker ni tako vsemogočen, kot si mislijo oni. "Veliko
    staršev ima superiorno mnenje. On je čudovit nogometaš, pa v šoli je tak, hvalijo
    svojega otroka in ga poveličujejo. Njegova situacija v šoli, ko postane žrtev
    medvrstniškega nasilja, se ne ujema s to vlogo. Miha misli, da je razočaral starše,
    ker ni tako vsemogočen, kot mislijo oni. Po drugi strani se starši pogosto odzovejo
    neprimerno. Otrok jim pove za nasilje, mama se odpelje na naslov nasilneža, naredi
    celo sceno. A otrok si ne želi tega, skrbi ga, kako bodo nanj gledali jutri v
    šoli," razlaga Čevnik. Po njenem mnenju je pomembno, da otroke natančno obvestimo
    o tem, na katero konkretno odraslo osebo se lahko obrnejo, da jim bo pomagala.
    Da otrok torej lahko zbere toliko moči in pristopi.
  - Nasilneži čutijo, da se jim popušča
  - Bolj kot to, da odhitimo na naslov nasilneža, bi bilo po mnenju gostje primerno,
    da se pogovorimo s svojim otrokom, obvestimo šolo, skličemo skupni sestanek in
    da znamo videti še drugo plat. "Starši velikokrat ne vidimo druge plati. Delovati
    je treba konsistentno, sodelovati z vsemi vpletenimi. Opazovalci pa so pomemben
    segment pri medvrstniškem nasilju, ti lahko na terenu naredijo največ," poudari.
    A potem so tu še šole, ki v primeru nasilja rade povedo, da so nemočne, da imajo
    zvezane roke. Čevnik pri svojem delu sodeluje tudi z nasilneži, saj tudi ti potrebujejo
    adaptacijo, podporo, da razumejo posledice svojega vedenja. " Zakonodaja je takšna,
    kot je, in verjamem, da imajo zvezane roke. A pri delu se pokaže, da so do 1.
    ali 2. opomina nasilneža v šoli še obravnavali, do 3. opomina, ki pomeni izključitev,
    pa se dogodki kar vrstijo in se ne zgodi nič. Imela sem deklico, ki so ji po 1.
    in 2. opominu zagrozili, da sledi tretji opomin, če bo samo še enkrat zapisana.
    Pa je sama povedala, da je bila zapisana že 24-krat in se ji ni zgodilo nič. Nasilneži
    čutijo, da se jim popušča," ugotavlja Čevnik. Še huje je, ko je vpleten splet
    in vedno več mladih je žrtev spletnega nasilja. "Tragično pri tem nasilju je,
    da žrtev pogosto ne ve, kdo je nasilnež, kakšne so razsežnosti njegovega ravnanja,
    žrtvi pa povzroči veliko bolečin. Pogosto se dogaja v zaprtih skupinah. Za medvrstniško
    nasilje velja, da se dejanje ponavlja in stopnjuje, pri spletnem nasilju pa je
    drugače. Takrat lahko že eno samo dejanje povzroči globoko in nenadno rano žrtvi.
    Ker se hitro razplamti, postane viralno, in to otroke najpogosteje pripelje do
    roba, da začnejo razmišljati o samomoru," pojasni Čevnik. Medvrstniško nasilje
    ni nekaj novega, obstaja, odkar obstajajo mladi. Danes se pojavlja v različnih
    oblikah in intenzivnostih. " Splet je prinesel veliko novih možnosti za medvrstniško
    nasilje, ki so prikrite, intenzivne, hudo in globoko ranijo posameznike. Nimamo
    pa možnosti ukrepanja, ker je skrito, pogosto v zaprtih spletnih skupinah," pove
    Čevnik. Hkrati pojasni, da vsako nasilje, ki se zgodi med vrstniki, še ni medvrstniško
    nasilje. Je pa treba imeti do nasilja ničelno toleranco. " Ko govorimo o medvrstniškem
    nasilju, govorimo o izraziti neenakosti moči med tistim, ki ga izvaja, in onim,
    ki ga doživlja. Nasilje ni le enkratno, traja, po navadi se celo stopnjuje. Če
    si predstavljate, ko se spreta dva sošolca, se sporečeta, ker denimo navijata
    vsak za drug nogometni klub, je to enkratno dejanje med simbolno enako močnima
    osebama. To je nasilje, ki ni sprejemljivo, ni pa značilno medvrstniško. Značilno
    medvrstniško se ponavlja, gre za neenako razporeditev moči," je še povedala sogovornica.
  - Pogovor v celoti v novi epizodi oddaje Ob osmih.
