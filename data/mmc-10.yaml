  date: '2023-04-13T14:31:00'
  figures:
  - img: https://img.rtvcdn.si/_up/upload/2023/04/13/66073979.jpg
    source: 'Foto: BoBo'
  lead: 'Gospodarsko ministrstvo je predstavilo osnutek prve Slovenske vesoljske strategije
    2030, ki naj bi usmerjala hitro rastočo vesoljsko industrijo in raziskovalne dejavnosti.
    Slovenija pa želi sodelovati v več programih evropske vesoljske agencije ESA. '
  mention:
  - Matevž Frangež
  - Tanja Permozer
  - Gordon Campbell
  paragraphs:
  - '" Slovenija je majhna na Zemlji, a želi postati velika v vesolju. Njen živahen
    vesoljski sektor že zdaj kaže, da je to dosegljiv cilj. Zaradi odličnih projektov
    in rezultatov smo lani podvojili vplačila v programe Evropske vesoljske agencije
    (ESA). To nam bo omogočilo doseči zastavljen cilj polnopravnega članstva v ESI,
    ob tem pa povečati možnosti slovenske vesoljske industrije za sodelovanje v evropskih
    vesoljskih programih. ESA je ključna za nadaljnjo rast našega vesoljskega sektorja,
    močan vesoljski sektor pa lahko bistveno prispeva k povečanju dodane vrednosti
    celotnega slovenskega gospodarstva," je na predstavitvi dejal državni sekretar
    na ministrstvu za gospodarstvo, turizem in šport Matevž Frangež.'
  - Osnutek Slovenske vesoljske strategije 2030, kot navajajo na ministrstvu, je bil
    pripravljen, da usmerja in podpira slovensko hitro rastočo vesoljsko industrijo
    in raziskovalne dejavnosti na tem področju.
  - '" Vesoljski sektor je eden izmed najhitreje rastočih sektorjev, tudi v Sloveniji,
    za katerega so značilni veliki multiplikativni učinki na gospodarsko rast in zaposlovanje,
    na zeleni digitalni prehod in razvoj raziskovalne dejavnosti. Zanj je značilen
    velik vložek v raziskave in razvoj, pomembno pa je, da to znanje pospešeno komercializiramo
    in prenesemo v vsakdanje življenje: od uporabe v proizvodnji, zdravstvu, kmetijstvu,
    prometu, izobraževanju, energetiki, varnosti in na številnih drugih področjih.
    Pomen vesoljskega sektorja je prepoznan tudi v okviru EU-ju, saj je področje vesolja
    vključeno v najrazličnejše programe od varnosti do inovativnosti," so še izpostavili
    na ministrstvu.'
  - Vodja Slovenske vesoljske pisarne in vodja slovenske delegacije pri ESI Tanja
    Permozer pa je navedla, da so slovenska podjetja in raziskovalne institucije prisotni
    v skoraj vseh vesoljskih segmentih. Slovenija sodeluje v petih izbirnih programih
    in temu sledi osnutek vesoljske strategije. Vesoljske tehnologije po njenih besedah
    niso le rakete in potovanje v vesolje, pač pa visoke tehnologije, ki omogočajo
    boljše življenje in hitrejši razvoj.
  - V Sloveniji imamo tako več različnih nišnih dejavnosti, predvsem na področjih
    opazovanja Zemlje, telekomunikacij kot tudi na področju robotskih in človeških
    raziskav.
  - Tako imamo v vesolju že tri satelite, raziskovalni center ESE s človeško centrifugo
    v Planici in inovativno platformo za predstavitev satelitskih podatkov Sentinel
    Hub. Osnutek strategije gradi na obstoječih dosežkih in jih nadgrajuje, je naštela.
  - Gordon Campbell, predstavnik ESE, pa je poudaril, da bo nova strategija omogočila,
    da se bodo vsa sredstva uporabila namensko in da bodo vsi akterji delovali za
    dosego istega cilja. To bo omogočilo tudi lažjo vključitev v programe ESA, je
    pojasnil.
  title: '"Slovenija je majhna na Zemlji, a želi postati velika v vesolju"'
