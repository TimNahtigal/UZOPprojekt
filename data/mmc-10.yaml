  paragraphs:
  - Poslanska skupina Svobode je po besedah Boruta Sajovica zasedala v torek in tudi
    danes, ker ima koalicija ta teden na mizi več vsebinskih vprašanj, med drugim
    predlagane posvetovalne referendume. Posvetili pa so se tudi vprašanjem, vezanim
    na čim boljšo organizacijo poslanske skupine, je navedel Sajovic.
  - Kljub ugibanjem o njegovi menjavi je zatrdil, da poslanska skupina ostaja enotna,
    zavezana koaliciji in sodelovanju z vlado in da o menjavi na čelu poslanske skupine
    niso razpravljali. O tem, čemu pripisuje namigovanja o njegovi menjavi, pa je
    dejal, da očitno " v tej državi preprosto ni vse prav, če ni vsak dan nekaj narobe".
    "Če pa ni narobe, pa o tem ugibamo, ali pa si preprosto to izmislimo," je dejal.
    Obenem je poudaril, da njegova funkcija vodje poslanske skupine ni " ne častne
    narave ne ministrsko plačana funkcija s šoferjem ". " Moj položaj je povezovanje
    ljudi, usklajevanje, koordinacija, torej izrazito delovne narave, " je navedel.
  - Glede več nedavno napovedanih menjav v kabinetu predsednika vlade na čelu z njegovo
    vodjo Petro Škofic, pa je izpostavil, da si delo v svojem kabinetu vsak organizira
    sam. Obenem je kot pozitivno ocenil, da se " da zmeraj še več, še bolje, še drugače
    ".
  - Prav slednje obljublja tudi vlada na področju komuniciranja, pri čemer naj bi
    se med drugim krepila vloga podpredsednika Svobode ter ministra za Slovence v
    zamejstvu in po svetu Mateja Arčona. Da so naredili " kopico stvari dobro", a
    tega niso vedno znali povedati državljanom, je danes ocenil tudi Sajovic.
  - Med primeri je izpostavil nedavno sprejeto novelo zakona o varstvu okolja, ki
    prinaša strožje zahteve glede izpustov iz naprav za sosežig, kot je cementarna
    Salonit Anhovo. Meni, da so javnosti relativno slabo komunicirali jasno sporočilo,
    da je za koalicijo okolje vrednota in da če v industrijah nastajajo dobički, je
    del teh treba vložiti tudi v tehnologijo, da ljudje na teh območjih ne občutijo
    posledic za svoje zdravje. Prostor za boljšo komunikacijo bi bil po njegovi oceni
    tudi pri predlogu energetskega zakona. " Poglejte, kakšno dramo smo naredili iz
    tega, ali drva sploh še gorijo, " je bil oster.
  - Poslanci največje vladne stranke so sicer danes razpravljali tudi o predlogih
    posvetovalnih referendumov, med drugim o izvedbi projekta Jek 2. Sajovic je zatrdil,
    da je poslanska skupina tudi pri tem enotna, čeprav je njihov poslanec Miroslav
    Gregorič umaknil svoj podpis k predlogu. Po pojasnilih Sajovica naj bi si namreč
    želel, da bi državljani pred odločanjem o tem vprašanju razpolagali z več podatki,
    ki pa jih ta trenutek še ni na mizi. " Poslanska skupina ostaja trdno zavezana
    dogovoru vseh parlamentarnih strank razen Levice, da je o vprašanju pridobivanja
    energije iz drugega bloka nuklearke treba povprašati naše državljanke in državljane,
    ker mora biti to naša skupna odločitev," je zatrdil Sajovic.
  - Novinarka TV Slovenija Tanja Gobec je med drugim poročala, da bo koalicija predloga
    dveh posvetovalnih referendumov, ki ju predlaga NSi, in sicer o možnosti učenja
    maternih jezikov in kulture priseljencev iz nekdanjega SFRJ-ja in energetskem
    zakonu, zavrnila.
  - O tem, ali bodo tako enotni tudi pri predlogu SDS-a za zamenjavo njihovih poslancev
    Anžeta Logarja, Eve Irgl in Dejana Kaloha v delovnih telesih DZ, pa je dejal,
    da v parlamentu glede tega med strankami velja " gentlemanski dogovor ". " V poslanski
    skupini SDS imajo pravico do svojega svojega razmisleka in tako kot oni nam o
    tem vprašanju nikdar in nikoli niso postavljali ovir na pot, tudi mi njihove odločitve
    spoštujemo in skušamo razumeti," je zatrdil šef poslancev Svobode.
  - Poslanska skupina SDS je namreč DZ minuli teden obvestila o menjavah svojih članov
    v delovnih telesih DZ. Logarju, Irgl in Kalohu odvzemajo članstvo po tistem, ko
    niso podpisali izjave o zvestobi stranki do konca mandata. V začetku tega tedna
    pa so predlagali tudi kandidatne, ki jih bodo nadomestili na njihovih predsedniških
    in podpredsedniških funkcijah. Za predsednika komisije DZ za peticije, človekove
    pravice in enake možnosti predlagajo Jožeta Tanka, za podpredsednika odbora DZ
    za zunanjo politiko Andreja Kosija in za podpredsednika odbora DZ za pravosodje
    Jožefa Lenarta.
  - Pretekli teden je postalo jasno, da se v Golobovi najožji ekipi tako v stranki
    kot v vladi obeta več menjav. S funkcije generalne sekretarke stranke Gibanje
    Svoboda se konec meseca poslavlja Vesna Vuković, nasledil jo bo aktualni direktor
    Kontrole zračnega prometa Rok Marolt, ki naj bi veljal za človeka iz kroga finančnega
    ministra Klemna Boštjančiča.
  - Še več kadrovskih menjav se bo zvrstilo v premierjevem kabinetu. Tega med drugim
    zapušča njegova vodja Petra Škofic, nasledil jo bo Luka Špoljar, sicer sedanji
    sekretar poslanske skupine Svoboda. Iz kabineta se poslavljata tudi državna sekretarka
    za kulturo Kaja Širok in premierjeva svetovalka za gospodarske zadeve Saša Leban.
  - Vladna stran naj bi si ob tem prizadevala izboljšati tudi komunikacijsko strategijo,
    pri čemer naj bi določene naloge prevzel tudi podpredsednik največje vladne stranke
    ter minister za Slovence v zamejstvu in po svetu Matej Arčon. Na kakšen način,
    sicer s predsednikom vlade menda še nista popolnoma dorekla, na mizi pa naj bi
    bila tudi možnost, da Arčon postane podpredsednik vlade.
