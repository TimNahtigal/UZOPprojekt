  - Nizozemska bo tako po 13 letih dobila novega predsednika vlade. Po preštetju vseh
    glasov pa se bodo začela pogajanja za oblikovanje koalicije.
  - V volilni kampanji so bili v ospredju življenjska draginja, stanovanjska kriza,
    okolje in priseljevanje, ki je bilo vzrok tudi za padec vlade Marka Rutteja. V
    igri je bilo tudi vprašanje, ali so volivci v eni najrazvitejših evropskih držav
    pripravljeni še naprej financirati podnebne politike, kot je drago uvajanje vetrnih
    elektrarn na morju.
  - Tokratne volitve so veljale za zelo nepredvidljive, saj je o tem, katere od 26
    strank bodo zasedle skupno 150 sedežev v parlamentu, odločal precejšen delež neodločenih
    volivcev.
  - Stranka, ki osvoji največ sedežev, tradicionalno prevzame vodilno vlogo v pogajanjih
    in zagotovi predsednika vlade, vendar tudi to po nizozemskem sistemu ni zagotovljeno.
  - Če bo večino glasov dejansko osvojil Wilders, bi lahko Nizozemska dobila trdo
    desno koalicijo z močno protipriseljensko usmeritvijo, čeprav si je Wilders prizadeval
    omiliti svojo podobo v upanju na vstop v vlado.
  - '"Zdaj je bilo dovolj. Nizozemska tega ne more več prenašati. Zdaj moramo najprej
    pomisliti na svoje ljudi. Meje so zaprte. Nič prosilcev za azil," je dejal Wilders
    v televizijski debati v torek pozno zvečer.'
  - '"Mislim, da nihče ne verjame, da bi bil Wilders premier za vse. Njegovo bistvo
    je zapiranje meja in izključevanje skupin, za katere meni, da ne spadajo na Nizozemsko,"
    je odgovorila Ruttejeva naslednica na čelu stranke, pravosodna ministrica nekdanja
    begunka iz Turčije, Dilan Yesilgoz, ki je sicer tudi stroga do priseljevanja.'
  - Ker je Nizozemska ustanovna članica EU-ja, Rutte pa je zelo viden akter na vrhu
    EU-ja, tudi drugi voditelji pozorno spremljajo izid. Stranke na desnici so predlagale,
    da bi si prizadevale za izjeme od pravil Unije na področju kmetijstva in priseljevanja,
    trdna desna koalicija pa bi lahko tudi omilila načrte za zmanjšanje živinoreje
    in uporabe gnojil, čemur kmetje močno nasprotujejo.
  - Bolj sredinska koalicija bi verjetno nadaljevala gradnjo obnovljivih virov energije,
    zlasti vetrnih elektrarn v Severnem morju, sledila načrtom za zmanjšanje živinoreje
    in povečala socialno porabo, vključno z zvišanjem minimalne plače.
  - Rutte bo ostal v vlogi začasnega premierja, dokler ne bo imenovana nova vlada,
    verjetno v prvi polovici leta 2024.
  - Javnomnenjske raziskave niso napovedovale jasnega zmagovalca.
  - Pri vrhu je še Nova družbena pogodba, stranka, ki jo je priljubljeni pravnik Pieter
    Omtzigt ustanovil po razhodu s krščanskimi demokrati, v zadnjih anketah pa nekoliko
    zaostaja za omenjeno trojico.
  - Za mesta v 150-članskem spodnjem domu parlamenta se je sicer potegovalo kar 26
    strank, tudi Gibanje kmetov in državljanov, ki je nastalo leta 2019 po protestih
    kmetov proti vladnim okoljskim ukrepom. Čez prag naj bi uspelo priti sedemnajstim
    strankam, relativna zmagovalka pa bo morala sestaviti koalicijsko vlado, to pa
    lahko traja zelo dolgo. Po zadnjih volitvah leta 2021 je premier Rutte svoj četrti,
    zadnji kabinet sestavljal rekordnih 299 dni, je poročala Mojca Širok.
