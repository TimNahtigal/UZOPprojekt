  - Prepoved telefonov
  - Skit scena
  lead: '"Ko vzpostavljamo pravila, kdaj je telefone primerno, neprimerno ali celo
    prepovedano uporabljati, ne bomo uspešni, saj niso mediji izvor problemov, ki
    nas strašijo," opozarja Katja Koren Ošljak s FDV-ja. Kako se torej lotiti te problematike?'
  mention:
  - David Buckingham
  - Vlasta Juršak
  - Mojca Mihelič,
  - Marko Pokorn
  - Dan Podjed
  - Meiro Hot
  paragraphs:
  - Potem ko so v več državah po svetu sprejeli zakon o prepovedi telefonov v šolah,
    se je tudi v Sloveniji začelo opozarjati na to problematiko. Iniciativa odklopi.net
    je s peticijo podala klic k ukrepanju za omejitev čezmerne uporabe digitalnih
    naprav v šolah in vzgojno-izobraževalnih ustanovah. Pobudnik peticije je, skupaj
    z drugimi strokovnjaki, Center za trajnostni razvoj podeželja Kranj.
  - Dejstvo je, da večina otrok in mladih preživi čedalje več časa na telefonih, starši,
    pedagogi in strokovnjaki pa se borijo s tako močno in splošno razširjeno težavo,
    ki je do zdaj še nismo poznali. Dokazano je, da čezmerna raba slabo vpliva na
    praktično vse vidike življenja – od fizičnih do psihičnih. Bi zakonska prepoved
    rabe telefonov v šolah položaj omilila ali se za površjem skriva večji in globlji
    problem?
  - Katja Koren Ošljak, asistentka na katedri za medijske in komunikacijske študije
    FDV-ja in ustanoviteljica zavoda za digitalno vzgojo Vsak, opozarja, da sama zakonska
    prepoved zadeve še zdaleč ne bo rešila. "Prepoved in omejevanje konsenza lahko
    učitelje in učiteljice potisneta v vlogo policistk in policistov, ki bodo tihotapcem
    telefonov pregledali žepe, torbe in telesa. Je to res ustrezna pot, po kateri
    naj se razvija sodobna šola? Morda pa si nekateri želijo prav tega," se sprašuje
    v svojem članku v Mladini.
  - '"Želim pojasniti, da ne zanikam težav mladih, ki so tako hude, da zahtevajo terapevtsko
    obravnavo. A vendarle nanje gledam nekoliko drugače kakor nekateri. T. i. odvisnosti
    oz. škodljive čezmerne rabe telefona razumem kot simptom težkih okoliščin mlade
    osebe, ki se na internet, npr. v družbena omrežja, zateka po neke vrste pomoč,
    se pred nečim umika ali si išče prostor, kjer bo sprejeta. V prvi vrsti torej
    ne uperim prsta v telefon oz. medije kot povzročitelje stisk, čeprav se ravno
    tam, z njimi in skoznje stiske izrazijo, " je za MMC RTV Slovenija pojasnila svoj
    pogled.'
  - Ob tem se sprašuje, kaj sploh pomeni čezmerna raba telefona? "V urah tega verjetno
    ne moremo opredeliti, ne v družbenih okoliščinah, ko smo vsi nenehno priklopljeni.
    Morda lahko govorimo o konstruktivnih in destruktivnih digitalnih ali medijskih
    rabah tako na individualni ravni kakor v primerjavi z drugimi in družbo."
  - Koren Ošljak je prepričana, da je medijska edukacija zahtevna, saj mora prispevati
    k širšim premislekom o osebnih in vzajemnih rabah medijev in tehnologij, o pomenu
    informiranja in analiziranja medijskih vsebin. "Na način, da uporabnike in uporabnice
    digitalnih medijev, kot poudarja tudi angleški raziskovalec David Buckingham,
    postavimo v vlogo aktivnih raziskovalcev medijev," je prepričana.
  - Ob tem pa je dodala, da obstaja še druga razsežnost, ki je po njenem mnenju še
    pomembnejša – razumevanje logike delovanja medijske industrije, "ki temelji na
    osebnih podatkih uporabnikov, in tehnološkega, kulturnega ter političnega vpliva
    sodobnih tehnoloških velikanov, ki proizvajajo tudi zelo problematične zmogljivosti
    digitalnih medijev".
  - Po njenem mnenju je najpomembnejši cilj, h kateremu bi morali težiti, regulacija
    digitalne industrije. "Digitalni producenti dizajnirajo namreč tudi temne vzorce,
    algoritme, ki spodbujajo potrebo po nenehnem čekiranju in priklopljenosti na omrežja,"
    je poudarila in opozorila, da aplikacije opremljajo z nerealnimi lepotnimi filtri,
    ki prispevajo k oblikovanju slabe samopodobe, omogočajo širjenje neresnic in protiznanstvenih
    vsebin, nepooblaščeno zbirajo, obdelujejo in posredujejo osebne podatke.
  - '"Reguliranje dostopa do telefonov v šolah ali v družbi nasploh torej lahko prispeva
    k boljši izkušnji v različnih interakcijah in situacijah, a je torej kvečjemu
    kapljica v morje," je prepričana.'
  - '"Celostna medijska edukacija je kompleksna in mora vključevati več elementov:
    od razvoja kritičnega in analitičnega razumevanja medijskih tekstov (vsebin) in
    kontekstov, v katerih nastajajo, torej poznavanje digitalne produkcije, digitalne
    medijsko-tehnološke krajine in ekonomije medijev," je prepričana Koren Ošljak.'
  - '"Nekoliko poenostavljeno rečeno gre za raven digitalnih kompetenc, ki jo gradijo
    informacijska in podatkovna pismenost, komuniciranje in sodelovanje, varnost naprav,
    zaščita zasebnosti," je pojasnila in dodala, da je pred tem treba zagotoviti dostop
    do interneta, naprav in programov oziroma platform in aplikacij.'
  - '"Ob tem je v premislek o celostni medijski edukaciji nujno vključiti tudi družbeno-strukturne
    dejavnike, ki lahko spodbujajo različne elemente, namene in oblike medijskih rab,"
    je še prepričana.'
  - Domače in tuje raziskave kažejo, da medijsko edukacijo sodobnih otrok in mladih
    pomembno zaznamujejo družbenoekonomski status družin, izobrazba staršev, medijsko-tehnološka
    znanja mater in očetov, šolske spodbude, omejitve in opozorila učiteljic in učiteljev
    na nevarnosti. " Med drugim je pomembno celo, kakšnega spola je mlada oseba, saj
    fante, kot kažejo rezultati raziskave Medijski repertoarji mladih (financer ARIS),
    močneje spodbujamo k uporabi tehnologij, medtem ko dekleta pogosteje opozarjamo
    na nevarnosti interneta," je še opozorila.
  - Vlasta Juršak, pobudnica peticije v okviru projekta Pravica do odraščanja brez
    "e-živega peska" pa je prepričana, da so zakonska prepoved uporabe telefonov v
    šolah ali temu podobni ukrepi nujni. "Pobuda je reakcija na stanje na področju
    čezmerne rabe zaslonov. In stanje je alarmantno, najranljivejši pa so prav otroci
    in mladostniki. Nedopustno je, da naši otroci odraščajo na tak način, kot danes
    odraščajo. Dovolj je bilo govorjenja, kaj vse je narobe, potrebno je ukrepanje.
    Stroka že leta opozarja o škodljivih posledicah uporabe digitalnih naprav. Če
    se nič ne zgodi, so taki ukrepi, kot je peticija, nujni. Verjamemo, da se bomo
    zdaj vsi skupaj streznili in tudi ukrepali."
  - Za MMC RTV Slovenija je povedala, da so podpise začeli zbirati 20. februarja in
    jih bodo zbirali do 30. marca. "Zelo nas veseli, da smo v prvem tednu zbrali že
    več kot 10.300 podpisov," je pojasnila in dodala, da se zavzemajo za poenoten
    sistem učinkovite omejitve, ki bi olajšal delo šolam, spodbudil starše k zmanjšanju
    uporabe. "Predvsem pa gre za to, da šolarjem in dijakom omogočimo varnejše in
    bolj zdravo šolsko okolje in ponovno vračanje k živim odnosom –socializaciji,"
    je poudarila. "V zadnjih letih delovanja na tem področju sem imela na žalost možnost
    na lastne oči videti, kako nemočni so starši, katerih otroci so podlegli tej odvisnosti
    in kako hudo je z mladimi v resnici," je poudarila.
  - 'Mojca Mihelič, predstavnica ravnateljev je osvetlila izzive, s katerimi se vsakodnevno
    srečujejo zaradi čezmerne uporabe zaslonov. Prav tako je prepričana o nujnosti
    sistemskih rešitev in zakonodajnih ukrepov, ki bi prispevali k varnejšemu in bolj
    osredotočenemu učnemu okolju. "Otroci so naša prihodnost, in če na tem mestu ne
    bomo nič naredili, si napovedujemo uničenje. Zakaj se nam zdi pomembno nujno omejiti
    nepooblaščeno uporabo vseh digitalnih naprav v šolah in vzgojno-izobraževalnih
    zavodih? Ker otroke delajo asocialne, otroke razčlovečujejo, jih spravljajo v
    stiske, kakršnih mi odrasli nismo nikoli doživeli, ker jim nismo bili izpostavljeni.
    Neki psiholog je enkrat rekel: otroku dati telefon je tako, kot da bi mu dali
    motorno žago. Oboje je zelo koristno orodje, ampak verjetno ni starša, ki bi otroku
    dal motorno žago, ne da bi otroka poučil o varni rabi in bil zraven pri uporabi,"
    je zaključila.'
  - 'Pediater Marko Pokorn je ob pozivu k peticiji javnosti predstavil zdravstvene
    posledice pretirane uporabe digitalnih naprav pri otrocih in mladostnikih. Med
    ključnimi tveganji je navedel vpliv na duševno zdravje, motnje spanja, težave
    s koncentracijo ter pomanjkanje gibanja: "Dejstvo je, da so zasloni nepogrešljiv
    del našega vsakdana, treba jih je uporabljati po pameti. Nespametna in prezgodnja
    raba ima škodljive posledice na zdravje in razvoj otrok, kot so govorne in jezikovne
    sposobnosti, razvoj otrokovih socialnih veščin, naprave vplivajo na večjo pojavnost
    motenj pozornosti s hiperaktivnostjo, otroci, ki so pretirano izpostavljeni zaslonom,
    imajo moteno spanje. Modra svetloba lahko vpliva tudi na izločanje melatonina,
    tako imajo otroci porušen spalni ritem. Zaradi gledanja na blizu so prizadete
    oči, posledica je kratkovidnost. Otrok, ki ves čas gleda v zaslon, se tudi manj
    giblje, ima težave s čezmerno telesno težo in kasneje v življenju je večja verjetnost
    za srčno-žilne bolezni, večja je verjetnost tudi za uživanje nezdrave hrane,"
    je poudaril in dodal, da je prizadeto tudi duševno zdravje in da pretirana izpostavljenost
    privede tudi do digitalne odvisnosti.'
  - '"En kup razlogov je, zakaj je treba pri otrocih zmanjšati rabo zaslonov oz. jo
    nadzirati. Najboljši način učenja otrok je zgled. Tukaj je tudi na starših velik
    del krivde oz. odgovornosti. Doma je treba narediti red. Če otroci v zgodnjem
    otroštvu nimajo interakcije s starši, še posebej z mamo, ki med dojenjem gleda
    v zaslon, se to odraža v njeni fiziognomiji, njenem srčnem utripu," je opozoril
    in dodal, da je otrok tako že v najzgodnejšem obdobju svojega življenja prikrajšan
    za celostno materinsko ljubezen.'
  - Antropolog Dan Podjed je na novinarski konferenci, ki je naslavljala problematiko
    uporabe telefonov v šolah, pojasnil, da cilj pobude ni zavračanje digitalizacije,
    temveč smotrna in uravnotežena uporaba tehnologije v vzgojno-izobraževalnih ustanovah.
    "Pozornosti imamo vse manj. In tudi sam opažam, da se ne morem več posvetiti bistvenemu.
    Ker me zmotijo naprave, ki jim dajemo vse več in več pozornosti. V zaslone gledamo
    8 ur dnevno, odrasli gledamo v telefone 4 ure dnevno. In potem pravimo, da nimamo
    časa, hkrati pa damo tudi mladim naprave v otroke in jih pošljemo v šolo. Tudi
    če je telefon v torbi in dobi otrok potisno obvestilo, v tistem trenutku pozornost
    pade in je preusmerjena drugam. Sebi in mladim smo odvzeli pozornost, ki je zdaj
    na drugi strani zaslona, namesto da bi bila na tistem mestu, ki je v tistem trenutku
    res pomembna," je opozoril in dodal, da si lahko vsak dan z namenom privoščimo
    odklop. "To bi moralo biti zapisano v ustavo. Ne le odklop od dela, tudi odklop
    od naprav," je zaključil.
  - Tudi poslanska skupina Socialnih demokratov s prvopodpisano Meiro Hot se je s
    pobudo v zvezi z omejevanjem uporabe mobilnih telefonov v šolah obrnila na ministra
    za vzgojo in izobraževanje. V pobudi poudarjajo slab vpliv pametnih telefonov
    tako na učne procese kot tudi socialne.
  - Od ministrstva pričakujejo, da pripravi celovit načrt preprečevanja negativnih
    posledic uporabe mobilnih telefonov v šolah, ki naj vključuje sprejetje zakonske
    podlage, ki bo omogočila šolam omejitev ali prepoved uporabe mobilnih telefonov
    v šolah in oblikovanje izobraževalnega programa o digitalni varnosti ter odgovorni
    uporabi tehnologije.
  - '"Pri čemer je treba upoštevati tudi potencialno uporabo mobilnih telefonov v
    pedagoške namene in ob izrednih razmerah, " so še dodali.'
  - Na ministrstvu za vzgojo in izobraževanje se strinjajo s splošnim prepričanjem,
    da je pretirana in nenadzorovana raba telefonov in drugih digitalnih naprav pri
    otrocih in mladostnikih postala šolski in širši družbeni problem. " Zato zgolj
    prepoved uporabe telefonov na zakonski ravni tega problema ne bo rešila." Dodali
    so, da ima večina slovenskih šol prepoved že zapisano v svojih pravilih.
  - Kot so zapisali, predlogi rešitev vključujejo na vsebinskem delu poudarek na varnem,
    zdravem in spodbudnem učnem okolju, sistematično pridobivanje znanj na področju
    rabe digitalne tehnologije, ki vključuje smiselno in zdravo rabo, zakonsko omejitev
    rabe pametnih telefonov in drugih digitalnih naprav v šolskem prostoru, tehnične
    možnosti za izvajanje zakonske omejitve, vzgojne ukrepe ob nespoštovanju predpisov,
    pristojnost staršev za ravnanje otrok v primeru nespoštovanja omejitev rabe.
  - Ministrstvo je v mesecu marcu začelo s strokovno in širšo javnostjo razpravo o
    predlogu rešitev, ki so v zaključni fazi priprave. Ali se bodo nagibali k medijski
    edukaciji ali vsesplošni prepovedi, pa še ni znano.
  title: Zakaj (ne) bi zakonska prepoved rabe telefonov v šolah rešila težave?
