    nad pravico gibanja. Žal mi je, Mohamed, ampak to je realnost," je dejal znanemu
    izraelskemu voditelju arabskega rodu.
  - Izjava je dvignila veliko prahu in bila deležna ostrih obsodb Izraelcev in Palestincev,
    ki menijo, da je to še dodaten dokaz, da je Ben- Gvir, vodja ultra nacionalistične
    stranke Judovska moč, ki je bil v preteklosti obsojen zaradi netenja rasizma in
    podpiranja terorizma, predan sistemu "judovske nadvlade" na zasedenih območjih.
  - Kritikam se je pridružil tudi ameriški State Department, češ da ostro obsoja “Ben-
    Gvirove hujskaške izjave” in “vso rasistično retoriko", poroča Guardian.
  - Kritikam se je z objavo na Instagramu pridružila tudi Bella Hadid, ki je bila
    rojena v ZDA palestinskemu očetu. “Nikjer in nikdar, še posebej pa ne v letu 2023,
    ne bi smelo biti eno življenje vrednejše od drugega. Še posebej zaradi porekla,
    kulture nekoga ali iz čistega sovraštva, " je zapisala.
  - Bella in njena sestra Gigi, prav tako supermodel, sta glasni podpornici palestinskih
    pravic, njune objave na družbenih omrežjih pa dosežejo več 10 milijonov sledilcev.
    Bella je objavila tudi videoposnetek izraelske skupine za človekove pravice B’Tselem,
    ki prikazuje izraelske vojake v segregiranem mestu Hebron na Zahodnem bregu, v
    katerem pravijo, da imajoPalestinci prepoved dostopa do ulice, rezervirane za
    Jude. “Mar to spominja koga na kaj? ” je zapisala Hadid.
  - Ben- Gvir, ki živi v naselbini nedaleč od središča Hebrona, je vrnil udarec in
    manekenki zabrusil, da se ne misli opravičiti za svoje izjave in da bi izrečeno
    "ponovil še tisočkrat".Označil jo je za “sovražnico Izraela" in jo obtožil objave
    posnetka njegovega intervjuja “ z namenom, da bi bil videti rasističen in zloben
    ". “Vabim te v Kiryat Arbo, da si ogledaš, kako živimo tu, kako so vsak dan tu
    umorjeni Judje, ki v vsem svojem življenju niso nikomur storili nič žalega," je
    zapisal na družbenih omrežjih.
  - Ben- Gvir je imel vrsto let v svoji dnevni sobi obešen portret Barucha Goldsteina,
    judovsko-ameriškega skrajneža iz protiarabske stranke Kach, ki je leta 1994 v
    mošeji v Hebronu pobila 29 Palestincev. Portret je snel, ko je vstopil v vlado.
    Potem ko so njegove opazke pritegnile pozornost mednarodne skupnosti, je trdil,
    da ga je " izraelska radikalna levica " "selektivno" napačno citirala in da bi
    pravice omejil “ teroristom, ki mečejo kamenje v nas in nas pobijajo ”.
  - Ben- Gvir si z drugimi skrajno desnimi ministri v vladi Benjamina Netanjahuja
    prizadeva občutno povečati število judovskih naseljencev na Zahodnem bregu, da
    bi si tako na neki točki lažje priključili del ozemlja ali pa kar celotnega.
