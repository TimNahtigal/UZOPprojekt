    in Celjem, mestni obračun pa bodo začeli devet točk za zmaji. Proti Radomljanom
    so bili sicer podjetnejši (streli 10:4, v okvir vrat 2:0), vendar jim ni uspelo
    zadati četrtega zaporednega poraza.
  - Pravih priložnosti je bilo malo, še posebej v prvem polčasu. V nadaljevanju sta
    obe ekipi po enkrat stresli okvir vrat. Najprej je to uspelo gostom, ko je v 69.
    minuti po podaji Mateja Malenška Rok Štorman preigraval v kazenskem prostoru in
    nato z 10 metrov udaril proti vratom, zadel pa le prečko.
  - Domačim je v 84. minuti veselje preprečila vratnica. Takrat je Lan Štravs podal
    z leve strani, Victor Gidado pa je s štirih metrov z glavo meril malenkost premalo
    natančno.
  - Bravo je bil ob koncu tekme bližje zmagi, saj je imel že v sodnikovem dodatku
    po podaji iz kota lepo priložnost Beno Selan. Z glavo je dobro streljal z 10 metrov,
    a je bil na golovi črti na pravem mestu Moses Barnabas in žogo odbil nazaj v polje.
  - Radomlje čaka pred odhodom na zimski premor v nedeljo v Domžalah še dvoboj proti
    Primorju.
