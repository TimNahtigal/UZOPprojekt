  lead: V akciji tradicionalnega čiščenja reke Ljubljanice so potapljači iz vode potegnili
    za 660 kilogramov odpadkov, med katerimi so bili tudi električni skiroji, radio
    in osebni računalnik. Sodelovalo je 72 potapljačev, ribičev, gasilcev in prostovoljcev.
  mention:
  - Miro Potočnik
  paragraphs:
  - Letošnje čiščenje Ljubljanice je bilo že 34. po vrsti in še posebej zahtevno zaradi
    močnega toka in slabe vidljivosti, so povedali organizatorji.
  - Sodelujoči, med katerimi so bili potapljači, ribiči, gasilci in drugi prostovoljci,
    so Ljubljanico in njena nabrežja očistili od Ribiškega doma Barje na Livadi do
    ljubljanske tržnice.
  - Zaradi nedavnega dežja ima Ljubljanica močen tok, zato so v akciji tokrat sodelovali
    le izkušeni potapljači, ki so iz rečne struge potegnili več kot 660 kilogramov
    odpadkov. Med temi so se poleg drugih smeti znašli tudi različni prometni znaki,
    kolesa, električni skiroji, radijski sprejemnik in osebni računalnik.
  - Najdene odpadke so s pomočjo podjetja KPL razstavili na Čevljarskem mostu in s
    tem mimoidoče opozarjali na pomen odgovornega ravnanja z okoljem.
  - Predsednik društva Vivera Miro Potočnik je izrazil veselje, da je bila kljub dežju
    v preteklih dneh in motne Ljubljanice akcija uspešna ter da vsako leto zaznajo
    manj odpadkov. V lanski akciji so namreč potapljači iz rečne struge potegnili
    za okoli tono odpadkov. "Hvaležen sem vsem, ki so se udeležili letošnje čistilne
    akcije in prispevati k čisti strugi reke Ljubljanice," je dejal Potočnik in se
    ob tem zahvalil tudi Sparu Slovenija, ki akcijo podpira osmo leto.
  - Tradicionalno čistilno akcijo je tudi letos spremljal kulturni program. Vključeval
    je predstavo Povodnega moža in Urške, ki sta se podala v globine Ljubljanice in
    simbolično pokazala na naš odnos do okolja ter ravnanja z naravo. Po navedbah
    organizatorjev se je dogodek tudi letos končal s tradicionalnim druženjem pri
    Ribiškem domu Barje.
  - Čiščenje Ljubljanice tradicionalno poteka kot sklepna prireditev mesečne akcije
    Za lepšo Ljubljano med 22. marcem, svetovnim dnevom voda, in 22. aprilom, svetovnim
    dnevom Zemlje.
  title: Iz Ljubljanice potegnili za 660 kilogramov smeti
- _id: 67d428908cb86884aa125457
  url: https://www.rtvslo.si/slovenija/golob-ravnanje-predsednice-republike-je-neodgovorno-pirc-musar-nad-taksnimi-izjavami-sem-zgrozena/739425
  topics: slovenija
  authors:
  - G. K.
  - M. Z.
  date: '2025-03-14T10:38:33'
  figures:
  - caption: Prazno guvernersko mesto na čelu Banke Slovenije je dodatno zaostrilo
      odnose med predsednico republike Natašo Pirc Musar in premierjem Robertom Golobom.
    img: https://img.rtvcdn.si/_up/upload/2024/11/12/66286820.jpg
    source: BoBo
  - caption: Robert Golob in Nataša Pirc Musar.
    img: https://img.rtvcdn.si/_up/upload/2024/11/23/66302354.jpg
