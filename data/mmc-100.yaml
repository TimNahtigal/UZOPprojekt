  paragraphs:
  - Najboljši dve ekipi se bosta prebili v četrtfinalno skupino, kjer na nasprotnike
    že čakata posadki Italije in Španije.
  - Odločilna je bila petkova zmaga in štiri točke, s katerimi so se Krpani prebili
    na drugo mesto v skupini. Z dobrim startom so narekovali ritem in na morskem poligonu
    vseh 45 minut pridobivali prednost ter tekmece držali na varni razdalji sto in
    več metrov. Nedeljska regata je zaradi šibkega vetra odpadla.
  - Ekipa je delovala složno " To je neverjeten rezultat. Z dobrim jadranjem in kančkom
    sreče nam je uspelo. Prepričan sem, da bi bil razplet enak in bi napredovali v
    naslednji krog, tudi če bi danes tekmovali. Izjemno sem ponosen na ekipo, ker
    je nastopila složno. Želja slehernega člana je bila, da napredujemo in se dokažemo
    kot posadka, enakovredna najboljšim. Danes bomo slavili, jutri pa že začnemo priprave
    na nove regate, ki bodo brez dvoma zelo zahtevne," se je uvrstitve v osmino finala
    veselil kapetan posadke Vasilij Žbogar.
  - Hrvaška izpadla Poleg Slovenije so si napredovanje v naslednji krog zlatega pokala
    SSL zagotovili še Čile, Malezija, Madžarska, Tahiti, Portugalska, Južna Afrika
    in Litva, iz igre pa je presenetljivo izpadla Hrvaška, ki je do odločilnega plova
    vodila v skupini.
  - Ob Špancih in Italijanih so v četrtfinale uvrščeni tudi že Britanci, Danci, Nemci,
    Nizozemci, Avstralci in Novozelandci.
