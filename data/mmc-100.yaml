    pojasnil državni sekretar na ministrstvu za javno upravo Jure Trbič.
  - Predlagana sprememba bi po oceni vlade med drugim pripomogla k večji preglednosti
    pravnih aktov in povečala pravno varnost v Sloveniji. Ustavna komisija je aprila
    ustanovila strokovno skupino, ki je pripravila mnenje o predlogu. Kot je na današnji
    seji pojasnil koordinator strokovne skupine Igor Kaučič, sta člana komisije Luka
    Ivanič in Mirko Pečarič predlog podprla in predlagata, da se začne postopek za
    spremembo ustave. Menita, da je predlog utemeljen in krepi načelo pravne države,
    hkrati pa ne ogroža načela avtonomije občin.
  - Kot sta zapisala v mnenju, je namreč zdajšnji zapis v 154. členu ustave, ki izrecno
    in nedvoumno razlikuje med objavljanjem državnih in lokalnih predpisov, preveč
    podroben. Zato zapira možnost, da gre prej za zakonsko kot ustavno materijo.
  - Kot je pojasnil Kaučič, so bila mnenja znotraj stroke različna, pojavljali so
    se tudi pomisleki glede posegov v avtonomijo občin. A se je stroka poenotila,
    da gre bolj kot za ustavno za zakonsko materijo. Kaučič tako predlaga zapis v
    ustavi, da se predpisi objavijo v uradnem glasilu, ki ga določa zakon. Lahko pa
    bi težavo odpravili tudi tako, da bi drugi odstavek 154. člena črtali in področje
    z ustavnega prenesli na zakonsko urejanje.
  - Člani komisije so predlog, da se začne ustavnorevizijski postopek, podprli z desetimi
    glasovi za in nobenim proti. Vrazpravi so se oglašali le poslanci Svobode, ki
    predlog podpirajo. Kot je dejala Janja Sluga, bi s tem dobili ažuren, sistematičen,
    enostavno dostopen in pregleden sistem, kjer bi državljani lahko našli predpise.
    V Svobodi se tudi zavzemajo, da bi zakonsko določili, da so objave predpisov v
    uradnem listu brezplačne.
  - Predlogu nihče od članov komisije ni nasprotoval, so pa v SDS-u na prejšnji seji
    menili, da ni ustrezen, med drugim so poudarili, da bo večina ljudi informacije,
    ki se nanašajo na lokalno okolje, iskala na spletni strani vsake občine. Potem
    ko je komisija podprla predlog za začetek ustavnorevizijskega postopka, je njen
    predsednik Jožef Horvat strokovno skupino prosil, da v mesecu dni posreduje mnenje
    s predlogom stališča o osnutku ustavnega zakona.
  - Kot je poročal Radio Slovenija v združenju občin in skupnosti občin predlogu sicer
    niso naklonjeni. Skrbijo jih zlasti dodatni stroški, ki bi jih imele občine zaradi
    objave predpisov v uradnem listu.
  title: Ustavna komisija podprla začetek postopka za spremembe glede objave predpisov
    v uradnem listu
