  date: '2023-02-15T07:31:00'
  figures:
  - caption: Generalni sekretar ZN-a Guterres opozarja na hude posledice podnebnih
      sprememb.
    img: https://img.rtvcdn.si/_up/upload/2023/02/15/66059417.jpg
    source: Reuters
    caption.en: UN Secretary-General Guterres warns about the severe consequences
      of climate change.
  lead: "Generalni sekretar ZN-a Antonio Guterres je v torek v Varnostnem svetu Združenih\
    \ narodov med razpravo o nevarnosti višanja gladine oceanov zaradi segrevanja\
    \ ozračja opozoril, da se bodo te v vsakem primeru še povišale.\r\n"
  mention: []
  paragraphs:
  - Upanja na omejitev globalnega segrevanja na 1,5 stopinje Celzija v primerjavi
    s predindustrijsko dobo se zdi vse manj. Četudi bi bil ta cilj dosežen, pa se
    bo gladina oceanov še vedno nevarno dvignila z vsemi negativnimi posledicami,
    je posvaril.
  - Če pa cilj ne bo dosežen, bodo posledice toliko bolj katastrofalne, je še dejal
    Guterres.
  - Kot je dodal, lahko razmere popolnoma uidejo izpod nadzora, če se temperatura
    dvigne za več kot dve stopinji, pri čemer so še posebej ogrožene države, kot so
    Bangladeš, Kitajska, Indija in Nizozemska.
  - Opozoril je, da na obalnih območjih po svetu živi skoraj 900 milijonov ljudi,
    kar je približno deset odstotkov svetovnega prebivalstva. Vsi ti se bodo znašli
    v resni nevarnosti.
  - '"Nizko ležeče skupnosti in celotne države bi lahko za vedno izginile. Priča bi
    bili množičnemu izseljevanju celotnega prebivalstva v bibličnih razsežnostih,"
    je dejal.'
  - Medvladni odbor ZN-a za podnebne spremembe (IPCC) navaja, da se je morska gladina
    med letoma 1900 in 2018 dvignila za od 15 do 25 centimetrov.
  - Če se bo svet segrel "le" za dve stopinji Celzija v primerjavi s predindustrijsko
    dobo, se bo gladina do leta 2100 zvišala za 43 centimetrov.
  - Če se segreje za tri ali štiri stopinje Celzija, pa se lahko gladina morja dvigne
    za kar 84 centimetrov, navaja IPCC.
  - Po Guterresovih besedah ima Varnostni svet ključno vlogo pri reševanju uničujočih
    varnostnih izzivov, ki izhajajo iz naraščanja gladine oceanov.
