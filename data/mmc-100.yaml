  paragraphs:
  - V odmaknjeni dolini Karma, ki leži na vzhodni strani Mount Everesta na višini
    okoli 4200 metrov, je bilo od sobote zaradi obilnega sneženja ujetih več sto turistov,
    ki so želeli osvojiti najvišjo goro sveta. Območje je namreč prizadela močna snežna
    nevihta, zato je sneg zasul šotore, v katerih je spalo več deset ljudi, tudi številne
    poti so postale neprehodne. V nedeljo je reševalcem na varno uspelo prepeljati
    okoli 350 turistov.
  - Takrat so poročali, da je ujetih še približno 200 pohodnikov, a po najnovejših
    številkah so reševalci skupno evakuirali kar 580 turistov, pa tudi 300 lokalnih
    vodnikov, pastirjev in podpornega osebja. To je bila po trditvah kitajskih uradnikov
    ena največjih iskalno-reševalnih akcij v Tibetu do zdaj.
  - Oktober je sicer običajno najprimernejši mesec za obisk Everesta iz te doline,
    saj vremenske razmere dovoljujejo tak podvig. Eden izmed rešenih turistov pa je
    letos izjavil, da "je vreme tokrat podivjalo".
  - Dolino Karma so zahodni raziskovalci odkrili pred stoletjem, v zadnjih letih,
    ko vzpon na Mount Everest s tibetanske strani postaja vse bolj dosegljiv za širše
    množice, pa to območje privablja vse več obiskovalcev. Lani je to regijo obiskalo
    več kot 540.000 turistov, kar je nov rekord.
  - Zaradi obilnih snežnih padavin ostaja omenjeno območje okoli Everesta, ki poleg
    doline Karme vključuje tudi dolino Rongšar in goro Čo Oju, začasno zaprto za javnost.
  - Sneženje, ki je zahod Kitajske prizadelo pretekli konec tedna, je težave povzročalo
    tudi več sto drugim pohodnikom na drugih gorskih območjih. Zgodilo se je tudi
    več nesreč, ki so zahtevale najmanj eno smrtno žrtev.
