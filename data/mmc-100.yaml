  paragraphs:
  - Janez Demšar je za Delo povedal, da sta Zdravko Počivalšek in Alojz Kovšca na
    odstop in prevzem odgovornosti za to, da stranka v okviru predvolilnega gibanja
    Povežimo Slovenijo ni dosegla želenega rezultata, čakala, ker sta želela najti
    človeka, ki bi stranko prevzel.
  - Za glasove volivcev se bo stranka po Demšarjevih napovedih znova potegovala na
    naslednjih volitvah, ni pa še znano, ali bodo nastopili samostojno ali na skupni
    listi z več drugimi strankami in gibanji.
  - Na lanskih državnozborskih volitvah se je stranka, kot omenjeno, združila s štirimi
    drugimi strankami v gibanje Povežimo Slovenijo in se s 40.612 glasovi oziroma
    3,41 odstotka glasov ni uvrstila v DZ. Za petouvrščeno Levico, ki si je kot zadnja
    izborila mesto v državnem zboru, je stranka zaostala za 12.622 glasov volivcev.
    Počivalšek je lani slab izid komentiral z besedami, da se ljudje očitno najlažje
    identificirajo z ekstremom na levi ali desni, težko pa jih je prepričati, da se
    uzrejo v prihodnost.
  - Začetki stranke sicer segajo v leto 2014, ko je na parlamentarnih volitvah nastopila
    kot Stranka Mira Cerarja (SMC) in dosegla veliko volilno zmago. Po tistem, ko
    je na volitvah dosegla 35 odstotkov glasov, je njena priljubljenost padla, na
    volitvah 2018 pa je dobila manj kot deset odstotkov glasov. Medtem se je preimenovala
    v Stranko modernega centra in vstopila v vlado Marjana Šarca.
  - Kljub drugačnim predvolilnim zavezam je nato stranka pod novim vodstvom na čelu
    s Počivalškom vstopila v koalicijo s SDS-om in pomagala pri vzpostavitvi tretje
    vlade Janeza Janše.
  - Stranka se je zopet preimenovala, tokrat v Konkretno, decembra leta 2021, ko se
    je z Gospodarsko aktivno stranko (GAS), ki jo je vodil Kovšca.
