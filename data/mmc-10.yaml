  lead: Vodja poslanske skupine Gibanja Svoboda Borut Sajovic je po sestanku poslancev
    s premierjem dejal, da o kadrovskih vprašanjih na poslanski skupini ne razpravljajo,
    razen kadar so internega značaja, a v tem trenutku ni bilo na mizi nič takega.
  mention:
  - Boruta Sajovica
  - Petro Škofic
  - Mateja Arčona
  - Miroslav Gregorič
  - Anžeta Logarja
  - Eve Irgl
  - Dejana Kaloha
