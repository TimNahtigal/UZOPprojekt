- _id: 6577b0ae87b52fb79606c344
  url: https://www.rtvslo.si/slovenija/predsednica-je-prvo-priznanje-na-podrocju-clovekovih-pravic-podelila-katarini-bervar-sternad/691247
  topics: slovenija
  authors:
  - La. Da.
  - Al. Ma.
  date: '2023-12-11T14:23:13'
  figures:
  - caption: 'Foto: BoBo'
    img: https://img.rtvcdn.si/_up/upload/2023/12/11/66141224.jpg
    source: ''
  lead: Nataša Pirc Musar je na slovesnosti v predsedniški palači podelila prvo priznanje
    predsednice republike za delo na področju človekovih pravic. Prejela ga je direktorica
    Pravnega centra za varstvo človekovih pravic in okolja Katarina Bervar Sternad.
     
  mention:
  - ' Dijana Matkovič'
  paragraphs:
  - Priznanje predsednice republike za delo na področju varstva, zagotavljanja in
    uveljavljanja človekovih pravic ter prispevek h krepitvi družbene zavesti o pomenu
    varovanja človekovih pravic je sicer Nataša Pirc Musar letos podelila prvič. "Še
    zlasti v času, v katerem smo, ko se srečujemo s številnimi izzivi na področju
    varovanja pravic, se mi zdi to pomemben prispevek k pozivanju h krepitvi družbene
    zavesti o pomenu varovanja človekovih pravic, ki so ključne za ohranjanje in utrjevanje
    demokracije, pravičnosti, stabilnosti, napredka in miru v svetu," je Nataša Pirc
    Musar dejala v nagovoru zbranim na podelitvi priznanja.
  - Delo direktorice PIC - Pravnega centra za varstvo človekovih pravic in okolja
    Katarine Bervar Sternad temelji na neposrednem stiku s posamezniki iz ranljivih
    skupin, s socialno ogroženimi družinami ter z drugimi žrtvami diskriminacije in
    kršitev človekovih pravic. Ob konkretnih primerih kršitev človekovih pravic pa
    prepoznava sistemske pomanjkljivosti, na katere opozarja pristojne državne ustanove
    ter si prizadeva za njihovo odpravo, so v predsedničinem uradu utemeljili podelitev
    priznanja.
  - '"Katarina Bervar Sternad teče maraton skozi številne vlade, različne odločevalce,
    prek ovir in padcev, a vselej odločno in z jasnim ciljem: da bi bili družba, ki
    dosledno spoštuje človekove pravice, kjer si vsi, še posebej pa ustanove, prizadevamo
    za njihovo varovanje in spoštovanje s posebnim tenkočutjem do pravic tistih, katerih
    glas v družbi je manj ali celo neslišan," so navedli.'
  - Kot so spomnili, začetki delovanja prejemnice priznanja segajo na področje brezplačne
    pravne pomoči, njene izkušnje in delo pa so ključni, da se je leta 2021 oblikovala
    Pravna mreža za varstvo demokracije, ki se odziva in prispeva k ubranitvi načel
    pravne države in demokratične delitve oblasti v Sloveniji.
  - Prav tako je Katarina Bervar Sternad tudi ena najvidnejših bork na področju preprečevanja
    nasilja nad ženskami in v družini, pobudnica in članica Mreže za otrokove pravice,
    sodelovala je tudi pri pripravi predloga zakona o varstvu pred diskriminacijo,
    so našteli v predsedničinem uradu. "Danes si brez uvidov, stališč in izkušenj
    prejemnice priznanja ni mogoče zamisliti strokovnega pogovora o stanju človekovih
    pravic in potrebnih sistemskih izboljšavah," s o še izpostavili.
  - Katarina Bervar Sternad je v zahvali ob prejemu priznanja poudarila, da tega prevzema
    v imenu vseh, ki v nevladnem sektorju delajo za spoštovanje človekovih pravic
    v družbi, še posebej v času, ko se poskuša spodkopavati pomen njihovega dela.
    Zagovorniki človekovih pravic v Sloveniji sicer morda niso podvrženi enakim nevarnostim
    kot njihovi kolegi v tujini, a stopnja nestrpnosti zoper njih ni zanemarljiva,
    je "mikrogojišče nasilja in slaba napoved za naše nadaljnje delo, če se temu ne
    zoperstavi sam vrh", je opozorila.
  - Pogoji za delo zajemajo tudi dejanske možnosti za ščitenje javnega interesa, je
    izpostavila Bervar Sternadova. Zgolj podelitev statusa namreč ni dovolj, če je
    ob pisanju zakonodaje težko dobiti prostor za mizo in če se je za uveljavljanje
    javnega interesa treba boriti proti močnim lobijem. "Težko se je boriti proti
    temu, še posebej, če politični odločevalci z eno nogo stojijo v državni upravi,
    z drugo pa na primer v energetiki," je bila ostra in poudarila, da je družba lahko
    uspešna zgolj toliko, kot dostojno živijo tisti, odrinjeni na njen rob.
  - Pomen dela civilne družbe je v nagovoru izpostavila tudi slavnostna govornica,
    pisateljica in publicistka Dijana Matkovič. V Sloveniji je civilna družba pogosto
    spregledana, zlasti s strani države, saj jim povzroča slabo vest, ker opravljajo
    delo, ki bi ga morala država, a ji pri tem pogosto spodleti, je poudarila. Zato
    je po njenem mnenju danes na mestu opozoriti tudi na v zadnjih treh desetletjih
    samostojne države izgubljene pravice. Med drugim je izpostavila pravice, ki urejajo
    socialno ekonomske razmere posameznikovega življenja, odsotnost ustrezne stanovanjske
    politike, izgubljene delavske pravice in posledice okoljskih katastrof.
  - '"Vsi to vemo, a vendar se nič ne spremeni, dobimo zgolj malo več politične korektnosti,
    ne pa tudi sistemskih sprememb, malce več vključenosti vseh, ne pa tudi dejansko
    enakih pravic," je opozorila. Odgovorov ne gre iskati pri politikih in gospodarstvenikih,
    temveč v avtonomnih prostorih, ki jih nekateri politiki simbolno in fizično tako
    radi rušijo, je sklenila Matkovićeva.'
  - Predsednica priznanje podeljuje ob mednarodnem dnevu človekovih pravic, ki ga
    sicer obeležujemo 10. decembra. Letos je potekal pod geslom Svoboda, enakost in
    pravica za vse. Združeni narodi so v ospredje postavili 75. obletnico sprejetja
    splošne deklaracije človekovih pravic, ki je prvič na univerzalni ravni zapisala
    pravice in svoboščine vseh ljudi ne glede na njihove okoliščine
  title: Predsednica je prvo priznanje na področju človekovih pravic podelila Katarini
