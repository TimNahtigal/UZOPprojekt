- _id: 64614dbd3069d155bf9c160c
  url: https://www.rtvslo.si/znanost-in-tehnologija/alastair-banks-ce-se-vam-zdi-chatgpt-srhljiv-vas-bo-autogpt-odpihnil/667657
  authors:
  - Katja Štok
  - katja.stok@rtvslo.si
  date: '2023-05-12T06:37:00'
  title: 'Alastair Banks: "Če se vam zdi ChatGPT srhljiv, vas bo AutoGPT odpihnil"'
  paragraphs:
  - Pri 19 letih je v spalnici na univerzi Exeter z nekaj sošolci ustanovil agencijo
    za digitalno trženje Optix Solutions, ki je danes ena vodilnih v Združenem kraljestvu
    in ki sodeluje z organizacijami, kot so The Met Office, The University of Exeter,
    Devon Partnership Trust (NHS), Michael Spiers in The Drum.
  - Banks je poročen, ima dva otroka, psa in mačko, redno sodeluje v prestižnem programu
    MBA na London Business School, piše tudi za Forbesov poslovni svet.
  - Med drugim je soustanovitelj podjetja Your Digital Future, agencije za trženje
    in digitalne talente, ki ocenjuje, usposablja in zaposluje kandidate na področju
    trženja po vsej Veliki Britaniji. Pred kratkim je ustanovil tudi spletno skupnost
    za vodilne v trženju.
  - V Ljubljani je na 10. konferenci Diggit spregovoril trendih na digitalnem področju
    za leto 2023, in kot kaže, smo le vstopili v postdigitalno dobo, ki ji bo kraljevala
    umetna inteligenca (adijo big data).
  - Pravite, da je ChatGPT največja stvar, ki se je zgodila v vaši karieri, primerjate
    ga celo z nastankom medmrežja. Zakaj? Začel sem leta 1999, medmrežje pa se je
    pojavilo med letoma 1996 in 1997. Bil sem del tega in videl, kako pomembno je
    bilo vse skupaj. Družbena omrežja so se začela okoli leta 2004, sledilo je spletno
    nakupovanje in izzivi, ki jih je prineslo dejstvo, da ljudje na medmrežju niso
    hoteli plačevati s kreditnimi karticami. Toda tole (…) težko se je izraziti. Kar
    koli sem ga vprašal (op. p. Chat GPT), sta bili hitrost njegovega odziva in podana
    vsebina neverjetni.
  - 'Pri tem je seveda pomembno, kako dobro je vprašanje zastavljeno in kako program
    spodbudiš k odgovoru, a mislil sem si: "Moj, Bog, tole nam bo spremenilo življenje!"'
  - 'Pri tem da strokovnjaki napovedujejo, da smo na začetku in da pravi val šele
    prihaja. Da. Investicijska banka Goldman Sachs je napovedala, da bomo zaradi razvoja
    umetne inteligence, če želite tudi ChatGPT-ja, ob 300 milijonov delovnih mest.
    Vedno sem bil naklonjen podobnim spremembam. Odklonilni odnos ni pravi način.
    Vprašati se je treba: " Dobro, kako lahko to uporabim, da si bom olajšal proces
    dela? "'
  - 'Saj ne želite biti med tistimi 300 milijoni? Da, imate prav. In toliko ljudi
    ima odklonilni odnos do tega, češ: " To ni v redu, ne more me nadomestiti, ne
    more narediti tega." Namesto da bi rekli: " Da, nekaj izzivov je, a postavimo
    jih na stran in se raje osredinimo na pozitivni del – kako mi lahko pomaga. "'
  - Pravite, da je treba ChatGPT-ju posvetiti več časa, mu dati več poslovnih informacij
    o sebi, stranki in podjetju, preden od njega zahtevamo določene odgovore. Zakaj?
    Bolj kot se mu posvetite, boljši odziv bo. Na primer, če mu poveste svoje ime
    in ime podjetja, ju bo uporabil pri odgovoru, s čimer poda nekoliko bolj edinstven
    odgovor. Svetujem, da porabite vsaj deset minut za pogovor z njim, preden mu zastavite
    poslovno vprašanje. Povejte mu, kaj delate, s čim se ukvarja vaše podjetje, kdo
    so vaše stranke – v svojih odgovorih bo upošteval vse to.
  - Pravite, da ChatGPT-ju zastavljamo vprašanja, namesto da bi ga izurili. Da. Morda
    je beseda urjenje malo preveč (…)
  - (…) bi bil pogovor boljši izraz? Da, pogovor in podajanje izjav. Ni treba, da
    ga urite več ur, le nekaj več o sebi mu morate povedati.
  - Rezultati ChatGPT-ja so lahko izjemni, a tudi netočni. Vas straši, ko vidite,
    česa vsega je sposoben? Je srhljivo. Podali ste zanimivo izhodišče glede netočnosti
    – ne vem, ali ste slišali za izraz haluciniranje, a ChatGPT ima zmožnost haluciniranja.
    To pomeni, da združi dve stvari, ki sta kot samostojni enoti podatkovno pravilni,
    ko pa ju združimo, podata napačno informacijo. In temu pravimo halucinacija, zato
    moramo biti previdni. Ravno zato je tako zelo pomembno, da se ne zanašamo na prvi
    podani odgovor, ampak naredimo pregled podanih odgovorov, jih uredimo in ponovno
    preverimo njihovo točnost. In tudi to je del tega postopka.
  - Pokazali ste primere, ko ste ga vprašali (…) (…) zanimivo, da ste ga poimenovali
    kot "on", kaj pa, če je ženska?
  - No, pa mu reciva tisto. Morava ga vprašati! Morda je spolno nevtralen?
  - Skratka, ChatGPT lahko poda analize, za katere bi sicer potreboval najmanj tri
    strokovnjake in kar nekaj denarja. Kako v tej perspektivi oceniti vrednost človeškega
    dela? Recimo to, kar ste s svojim znanjem vi gradili 24 let, lahko danes nekdo
    naredi v enem dnevu. Srhljivo, ne! Malo me skrbi za moje otroke, predvsem, kaj
    vse bodo doživeli.
  - Sicer pa se mi zdijo pomembni vidiki, kot so strateško razmišljanje, razvoj čustev
    in kreativnosti. Trije izjemno pomembni dejavniki v trženju, ki jih umetna inteligenca
    trenutno še ne premore. Lahko jo sicer prosiš, da se pretvarja, a v svojem izražanju
    ne bo tako pristna, kot je človek.
  - Glede strategija – lahko ponudi neke ideje, a je vprašanje, kako dobre so. Trenutno
    še niso. Pri ustvarjalnosti pa umetna inteligenca v segmentu fotografije in videa
    še ni tako dobra, kot je človek. Zagotovo pa bo prišla tja. Ste slišali za članek
    Harvard Business Review o opravljanju pravniškega izpita?
  - Povejte. Ko je profesor s pravne fakultete z različico ChatGPT 3,5 poskusil opraviti
    omenjeni izpit, ga je naredil z 20 odstotki. To je bilo decembra lani. Dejal je,
    ni strahu, umetna inteligenca ni težava, še dolgo ne bo tako dobra. Ko je marca
    prišel ChatGPT4, ga je opravil znova, tokrat s 70 odstotki. Takrat je priznal,
    da se je zmotil.
  - V kakšnem odstotku uporabljate umetno inteligenco v vašem podjetju? Odstotek je
    še vedno majhen. Sodelavci ga uporabljajo vsak dan, morda kakšno uro na dan, da
    dobijo nove ideje. Uporabljajo ga predvsem zato, da so učinkovitejši, in ne zato,
    da namesto njih opravlja delo.
  - Posebno pozornost ste posvetilu Bingu, Microsoftovemu iskalniku – saj to ni bil
    plačan vložek, kaj? Ne (smeh). Želel sem opozoriti na nekaj zanimivosti. Bing
    ima dejansko zelo malo uporabnikov, okoli 2,5-odstotka na svetovnem trgu, vendar
    pa je na Xboxu, ki ga uporablja na milijone ljudi, prav tako je na namizju računalnikov
    s programsko opremo Microsoft in ki jo v večini uporabljajo predvsem starejši
    ter je del njihovega iskalnika.
  - Umetno inteligenco imajo trenutno Google, Bard, Bing in Bing Chat, a govori se
    – pa ne vem, kdaj se bo to udejanjilo –, da se bosta Bing in Bing Chat združila.
    Ko se bo to zgodilo, se bodo uporabniki lahko odločili, ali bodo še naprej uporabljali
    iskalnik ali pa bodo začeli uporabljati Bing Chat, ki ima vgrajeno umetno inteligenco.
    Menim, da bodo preklopili.
  - Zelo malo je znano orodje Google E. A. T. Zakaj je v trženju to tako pomembno
    orodje? Osredinja se namreč na verodostojnost informacij na medmrežju. Resnično
    sem bil presenečen, da toliko ljudi tega orodja ne pozna, saj ga je dokaj lahko
    uporabljati. Kratice E. A. T. pomenijo strokovnost, avtoritativnost in zanesljivost
    (ang. expertise, authoritativeness, trustwortiness). Iskalniki zadnjih 20 let
    delujejo tako, da prebirajo objavljeno vsebino in jo poskušajo razumeti. Če nekaj
    iščemo, dobimo iskane zadetke.
  - V Googlovem svetu obstaja Your Money or Your Life (YMYL), ki se ukvarja s financami
    in zdravjem. Zavzema se za umik lažnih ali celo škodljivih informacij, ki posegajo
    po tem področju. Uporabnikom torej ponudi le zanesljivo vsebino in po tem je Google
    E. A. T. znan.
  - Če zdravnik napiše članek, veš, da bodo informacije v njem točne, kot če bi ga
    napisala midva. Če bi torej nekdo iskal nekaj o tem in prebral najin izdelek,
    bi lahko dobil napačen nasvet. Zato je nastal Google E. A. T.
  - Spomnili ste me na nasvet nekdanjega ameriškega predsednika Donalda Trampa, ki
    je dejal okuženim s covidom-19, naj si vbrizgajo dezinfekcijsko sredstvo, kar
    so nekateri dejansko tudi storili! Točno to. Zato je na področju YMYR Google E.
    A. T. postal znan. Google želi poznati izvor vsake vsebine, kdo jo je nekdo napisal.
    Letos so dodali še en E za izkušnjo (ang. experience, E-E-A-T).
  - 'Zanimiva je napovedana prihodnost brez piškotkov: z vidika uporabnika je to "jeej",
    z vidika tržništva pa verjetno bolj "neej"? Prav imate, točno tako bi to tudi
    povzel (smeh). Čeprav sem še vedno človek (smeh). Z vidika varstva osebnih podatkov
    je to zagotovo dobra stvar in jo podpiram, z vidika oglaševanja pa bo življenje
    malo bolj oteženo. A vendar, če zdaj to počnemo na način, ki je vsiljiv, to že
    samo po sebi ni v redu. Verjamem, da moramo najti boljši način za razumevanje
    strank in interakcije z nami.'
  - Pa bi lahko tudi ta segment prevzela umetna inteligenca? ChatGPT trenutno ne izdaja
    osebnih informacij.
  - Za zdaj, videli pa smo, kako je tehnologija napredovala v zadnjih osmih mesecih.
  - Res je, zato sem tudi dejal, da je lahko vse, kar sem ravnokar dejal, jutri že
    stara informacija. Prihodnost brez piškotkov je dobra, podatke bo treba pridobivati
    od dejanskih strank, ki želijo komunikacije z nami, to je edino dobro.
  - Za konec še beseda o topics, gre za novi način zbiranja informacij uporabnikov
    medmrežja. Iskalniki bodo nadzirali spletne strani, ki si jih boste ogledali,
    in jih bodo kategorizirali v različne teme (ang. topics). To bodo delali na vsake
    tri tedne, nato vsebino izbrisali in začeli zbirati podatke znova. Oglaševalci
    bodo oglaševali na podlagi podatka, katere teme ste iskali v iskalniku.
  - Pa bo takšen način za oglaševalce boljši? Bo, saj boste vedeli, da jih zanima
    vaše področje, ne bo pa tako nišno, kot je bilo sledenje s piškotki.
  - Katera bo najvznemirljivejša novost na tem področju, reciva, naslednji teden,
    da ne bova prepozna z informacijo? Morda bi opozoril na AutoGPT, ki deluje nad
    ChatGPT-jem. Če se vam zdi srhljiv ChatGPT, vas bo AutoGPT odpihnil.
  - Recimo, če mu postaviš vprašanje, kako naj postanem milijonar čez nekaj let, bi
    vam ChatGPT takoj ponudil nekaj odgovorov, AutoGPT pa bi se umaknil in vam ponudil
    orodja in celotno strategijo, kako to dejansko izvesti. In to se trenutno že razvija.
