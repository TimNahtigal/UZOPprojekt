  url: https://www.rtvslo.si/slovenija/ali-vlada-univerzam-spet-odreja-vpisno-politiko-visokosolski-sindikat-zahteva-pojasnila/684982
  topics: slovenija
  authors:
  - M. Z.
  date: '2023-10-15T19:08:46'
  figures:
  - caption: 'Foto: BoBo'
    img: https://img.rtvcdn.si/_up/upload/2023/02/21/66061270.jpg
    source: ''
  lead: V Visokošolskem sindikatu opozarjajo na "nenavaden dokument", s katerim vlada
    univerzam odreja, kje morajo zvišati in kje znižati število vpisnih mest na študijske
    programe. Ob tem opozarjajo na pomanjkanje dialoga in strokovnih argumentov za
    krčenje.
  mention: []
  paragraphs:
  - Ministrstvo za visoko šolstvo in univerze vsako jesen začnejo usklajevanja za
    razpis za vpis na študijske programe, ki določa število vpisnih mest na različnih
    študijskih področjih. Pogajanja potekajo do začetka naslednjega leta, nato pa
    vlada potrdi usklajeni razpis, ki ga objavijo, ustaljeno prakso usklajevanj opisujejo
    v Visokošolskem sindikatu Slovenije. Kot opozarjajo v javnem pismu, naslovljenem
    na ministrstvo in rektorje univerz, je bil takšen postopek prvič "povožen" januarja
    2021 pod prejšnjo vlado in nato tudi februarja letos pod trenutno vlado, a so
    bila v obeh primerih univerzam ponujena dodatna sredstva.
  - Ob zadnjem posegu v že usklajeni razpis, ki se je po opozorilih sindikata zgodil
    na četrtkovi vladni seji, ko je ministrska ekipa potrdila Usmeritve za pripravo
    načrta izvajanja študijske dejavnosti za študijsko leto 2024/2025, pa dodatni
    namenski denar ni predviden. "Tokrat, kot kaže, želi univerze prisiliti v notranje
    prerazporeditve," opozarjajo.
  - '"S tem dokumentom je univerzam odredila, na točno katerih študijskih področjih
    naj povečajo vpis, naložila pa jim je tudi krčenje vpisa na nekaterih drugih študijskih
    programih, njihovo prestrukturiranje," pojasnjujejo v sindikatu. "Takšna oblastna
    gesta krši načelo dvostranskih pogajanj med partnerji in jih onemogoča na samem
    začetku," so poudarili. Ob tem opozarjajo, da je ministrstvo v objavi na Facebooku
    omenjalo tudi ukinitev študijskih programov, a je bila takšna dikcija nato popravljena.'
  - Ob tem v javnem pismu Visokošolski sindikat opozarja tudi, da naj sprejete usmeritve
    glede vpisa po njihovih informacijah ne bi veljale le za prihodnje študijsko leto,
    temveč tudi za naslednje štiriletno obdobje financiranja študijske dejavnosti
    (2025–2029).
  - Visokošolski sindikat opozarja tudi na pomanjkanje argumentov za sprejete odločitve.
    "Javnosti ni znano, na podlagi katerih analiz je ministrstvo pripravilo seznam
    deficitarnih študijskih področij. Vsebinsko je neprepričljiv, saj na njem manjkajo
    nekatera področja (npr. radiološko inženirstvo), so pa na njem tudi taka, na katerih
    je izobraženega kadra dovolj, a beži iz poklica zaradi slabih začetnih plač in
    slabih delovnih pogojev; tega problema pač ni mogoče rešiti z vpisno politiko,"
    poudarjajo v javnem pismu.
  - Vladno ukazovanje univerzam, katera študijska področja je treba ukiniti, je po
    ocenah Visokošolskega sindikata "škandal, ki kaže, da minister ne razume, kaj
    je univerza, čeprav prihaja z nje". "Stvar pa je še bolj zapletena, če držijo
    naše informacije, da so bili rektorji v resnici vključeni v pogovore o tem dokumentu,
    pa čeprav mimo organov in članic univerz. Upamo, da načrti za kanibalistično prerazporejanje
    vpisnih mest in denarja med članicami niso nastali kar na samih univerzah, ki
    bi se nato skušale skriti za oblastnim aktom neoliberalne vlade. Če ni bilo tako,
    verjamemo, da bodo rektorji pojasnili svojo vlogo in se kritično opredelili do
    vladnega dokumenta," so še dodali v javnem pismu.
  - Sindikat zato zahteva odgovore glede tega, kakšen status ima sprejeti dokument
    glede na uveljavljen vsakoletni postopek usklajevanja razpisa, ali je predvideno
    tudi ukinjanje študijskih programov, na podlagi katerih analiz je bil pripravljen
    seznam študijskih področij, ki naj bi se prestrukturirala, in kakšno vlogo so
    imeli pri tem rektorji univerz.
  title: Ali vlada univerzam spet odreja vpisno politiko? Visokošolski sindikat zahteva
    pojasnila.
