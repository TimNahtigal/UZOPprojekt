  paragraphs:
  - Slovenija bo na EP-ju igrala v skupini s Ferskimi otoki, Poljsko in Norveško.
    V drugi del napredujeta dve reprezentanci. Prva tekma jo čaka 10. januarja.
  - Slovenska elitna izbrana vrsta se bo zbrala 26. decembra v Laškem. Prvi del priprav
    bo opravila v Celju, drugega v Ljubljani, do odhoda v nemško prestolnico pa jo
    čakajo tri pripravljalne tekme. Najprej se bo 29. decembra v Slovenj Gradcu pomerila
    z Avstrijo, 5. in 6. januarja pa sta pred njo v Poreču še tekmi s Črno goro in
    Hrvaško.
  - '" Na letošnjem januarskem SP-ju na Poljskem in Švedskem ter v kvalifikacijah
    za EP 2024 smo naredili korak naprej. Oblikovala se je zadovoljna, delovna, srčna
    in bojevita skupina ljudi. V Nemčiji želimo narediti pol koraka naprej, predvsem
    v smeri večje uigranosti ekipe. Naš primarni cilj je uvrstitev v drugi del tekmovanja,
    " je povedal Zorman.'
  - '"Naša skupina v Berlinu je zelo zahtevna in zanimiva. Za širšo javnost so Ferski
    otoki rokometna eksotika, a gre za reprezentanco, ki je v zadnjih dveh letih izjemno
    napredovala. Poljska ima dolgo rokometno tradicijo in ne glede na to, da smo jo
    na zadnjih velikih tekmovanjih premagovali, nas čaka izjemno zahtevna naloga.
    Norveška v zadnjih letih vedno naskakuje vrh in se bori za kolajne, tako bo tudi
    na januarskem turnirju v Nemčiji," je skupinske tekmece v Berlinu opisal Zorman.'
  - Ljubljančan je imel v naboru svojih igralcev za evropsko prvenstvo največje pomisleke
    na položajih vratarjev in krožnih napadalcev.
  - '" Po posvetu s trenerjem vratarske sekcije Gorazdom Škofom sem se odločil za
    Klemena Ferlina, Urbana Lesjaka in Miljana Vujovića, ki so dobili prednost pred
    Jožetom Baznikom in Urhom Kastelicem. Če smo iskreni in pošteni, nihče od njih
    posebej ne blesti v svojih klubskih sredinah in nima maksimalne minutaže. Določene
    pomisleke sem imel tudi pri izboru krožnih napadalcev, ravno zaradi tega sem na
    sklepne priprave poklical štiri igralce. Glede drugih igralskih položajev pa je
    bilo bolj ali manj vse jasno, " je dejal Zorman.'
  - V zadnjem obdobju je imel od Zormanovega 22-članskega kadra največ zdravstvenih
    težav krilni igralec Barcelone Blaž Janc, ki pa se počasi vrača v trenažni in
    tekmovalni ritem. V prvem delu priprav v celjski dvorani Golovec bo delal po nekoliko
    prilagojenem programu.
  - 'Vratarji: Klemen Ferlin (Erlangen), Urban Lesjak (Eurofarm Pelister) in Miljan
    Vujović (Stuttgart);'
  - 'Krilni igralci: Blaž Janc (Barcelona), Gašper Marguč (Veszprem), Domen Novak
    (Wetzlar), Staš Slatinek Jovičić (Trimo Trebnje), Tilen Kodrin (Gummersbach) in
