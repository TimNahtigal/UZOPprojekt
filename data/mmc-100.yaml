  lead: Romunsko sodišče je razsodilo, da se lahko britansko-ameriški spletni vplivnež
    Andrew Tate prosto giblje po Evropski uniji, medtem ko čaka na sojenje zaradi
    obtožb o trgovini z ljudmi.
  mention: []
  paragraphs:
  - 37-letni nekdanji profesionalni kikboksar Tate, ki je med drugim znan po provokativnih
    komentarjih in poniževalnem odnosu do žensk, je bil sredi leta 2023 skupaj z bratom
    Tristanom in dvema Romunkama obtožen trgovine z ljudmi, posilstva in oblikovanja
    kriminalne združbe za spolno izkoriščanje žensk, čeprav so vsi osumljenci zanikali
    vse obtožbe.
  - Letos aprila je sodišče v Bukarešti odločilo, da se lahko sojenje začne, na odločitev
    pa se je Tate pritožil. Do odločitve o njegovi pritožbi je bilo štirim osumljencem
    prepovedano zapustiti Romunijo, vendar je zdajšnja odločitev sodišča odpravila
    omejitev za Evropsko unijo, a odločitev ni pravnomočna in se nanjo lahko pritožijo
    tožilci.
  - '"Moji sodniki so se odločili ... Dovoljeno mi je zapustiti Romunijo, torej ali
    gremo (Ferrari) SF90 v Italijo, (Maserati) MC20 v Cannes, (Ferrari) 812 Competition
    v Pariz, kam naj grem?" se je Tate spraševal v videoposnetku, ki ga je po odločitvi
    sodišča objavil na omrežju X.'
  - Andrew in Tristan Tate, ki zavračata vse obtožbe, sta bila lani poleti skupaj
    z dvema romunskima državljankama obtožena več kaznivih dejanj – med drugim naj
    bi leta 2021 v Romuniji ustanovila kriminalno združbo za trgovino z ljudmi in
    prostitucijo, ki je delovala tudi v drugih državah, vključno z ZDA in Združenim
    kraljestvom. Žrtve naj bi zvabila v prostitucijo z lažnimi obljubami. Andrew Tate
    je obtožen posilstva ene od žrtev, Tristan pa napeljevanja k nasilju.
  - '"Andrew in Tristan sta še vedno odločena, da bosta oprala svoje ime in ugled,
    vendar sta hvaležna sodiščem, da so jima izkazala to zaupanje," je v izjavi dejal
    glavni zagovornik bratov Eugen Vidineac.'
  - Romunski tožilci trdijo, da sta brata Tate novačila svoje žrtve tako, da sta jih
    zapeljala in lažno trdila, da želita razmerje ali poroko. Po trditvah tožilcev
    so bile žrtve nato odpeljane na posestvo zunaj Bukarešte, kjer so bile s fizičnim
    nasiljem in duševnim ustrahovanjem spolno izkoriščene tako, da so bile prisiljene
    proizvajati pornografske vsebine za splet, s čimer sta ustvarila velike finančne
    koristi.
  title: Andrew Tate se lahko po odločitvi romunskega sodišča prosto giblje po EU-ju
