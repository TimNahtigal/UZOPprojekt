  mention: []
  paragraphs:
  - Dražba se je v prostorih Agencije za komunikacijska omrežja in storitve RS (Akos)
    začela ob 9. uri, dražitelji pa bodo ponudbe oddajali v dražbeni sistem prek interneta.
    Gre za dodelitev radijskih frekvenc za zagotavljanje javnih komunikacijskih storitev
    končnim uporabnikom v radiofrekvenčnih pasovih 700 MHz, 1500 MHz, 2100 MHz, 2300
    MHz, 3600 MHz in 26 GHz. Del frekvenčnih pasov 700 MHz, 3600 MHz in 26 GHz je
    namenjen uvajanju mobilnih omrežij pete generacije (5G).
  - Na Akosov razpis, objavljen decembra lani, so prispele štiri ponudbe, ki so jih
    odprli sredi februarja. Podatki o ponudnikih in vrednosti njihovih ponudb so sicer
    anonimni; identiteta ponudnikov bo znana po zaključku dražbe. Znano ni niti, kateri
    ponudniki v celoti izpolnjujejo pogoje za sodelovanje na razpisu. Kot je poročala
    Televizija Slovenija, naj bi po neuradnih informacijah na dražbi sicer sodelovali
    vsi štirje večji telekomunikacijski operaterji pri nas ‒ Telekom, A1, T2 in Telemach.
  - Skupna izklicna cena frekvenčnih pasov je 69 milijonov evrov. Operaterji, ki bodo
    pridobili frekvenčni spekter v katerem koli pasu, morajo v vsakem od pridobljenih
    pasov komercialno omogočati javno dostopne širokopasovne storitve tako, da v enem
    letu od razpoložljivosti posameznega frekvenčnega pasu začnejo uporabljati te
    frekvence in ponujati storitve končnim uporabnikom na teh frekvencah vsaj v enem
    večjem mestu.
  - V petih letih pa bodo morali vse frekvence uporabljati v celotnem pridobljenem
    frekvenčnem pasu in ponujati storitve končnim uporabnikom na vseh teh frekvencah
    vsaj v vseh večjih mestih.
