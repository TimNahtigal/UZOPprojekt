  paragraphs:
  - Fantastična Američanka, ki je v Killingtonu slavila že šestič, je za 33 stotink
    prehitela Petro Vlhovo, tretja Wendy Holdener je zaostala za več kot sekundo.
  - Po štirih ničlah na začetku sezone je navdušila Andreja Slokar. Primorka je bila
    po prvi vožnji 14., v drugi pa se je z osmim časom zavihtela celo na sedmo mesto.
    Za zmagovalko je zaostala 2,18 sekunde.
  - To so njene prve točke po zmagi v Meribelu marca 2022, ki ji je sledila huda poškodba
    kolena. Boljša je bila le še v Leviju 2021, kjer je bila četrta.
  - '" Zagotovo se mi je danes odvalil en velik velik kamen, sploh glede na to, da
    odkar sem se vrnila v tekmovanje po poškodbi, se nisem niti enkrat uvrstila v
    drugo vožnjo, " je bila zadovoljna Slokar.'
  - '" Že po prvi vožnji sem bila zelo vesela, čeprav vožnja res ni bila najboljša,
    tako da sem si že tam malo oddahnila, nato pa sploh po drugi vožnji, ko sem prišla
    v cilj in videla zeleno luč. Sem res zelo vesela, ker mi je prav malo ''ruzaka''
    padlo z rame. Mislim, da bo zdaj lažje tekmovati in bo tudi precej lažje trenirati,
    končno lahko malo zadiham, " je še dejala Ajdovka.'
  - Točke sta osvojili tudi Neja Dvornik z 18. (2,81) in Ana Bucik z 20. mestom (2,95).
