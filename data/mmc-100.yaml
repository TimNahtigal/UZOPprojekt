  paragraphs:
  - Vrhunec prvih priprav bosta tekmi s Srbijo. Prva bo 4. novembra v Črnomlju, druga
    pa dan kasneje v Kočevju. Slovenija bo na EP-ju 2024 v Nemčiji med 10. in 28.
    januarjem v skupinskem delu v Berlinu igrala s Ferskimi otoki, Poljsko in Norveško.
  - '"Rokometna zveza Slovenija nadaljuje svojo strategijo prirejanja reprezentančnih
    tekem v manjše slovenske kraje z rokometno tradicijo. Veseli nas, da je zanimanje
    za bližnji tekmi veliko, vstopnice praktično več niso na voljo," je na torkovi
    novinarski konferenci v prostorih RZS-ja na Leskoškovi dejal direktor reprezentance
    Jure Natek, ki bo kmalu prevzel tudi mesto generalnega sekretarja pri krovni zvezi.'
  - Pred elitno slovensko izbrano vrsto je konec meseca prva reprezentančna akcija
    po skoraj polletnem premoru in uspešnih kvalifikacijskih nastopih za EP v Nemčiji,
    kjer je s petimi zmagami in enim porazom osvojila prvo mesto pred BiH-om, Črno
    goro in Kosovom.
  - '"Na bližnjo akcijo sem povabil 21 igralcev, na vsako igralno pozicijo po tri.
    Na seznamu je jedro ekipe za januarsko evropsko prvenstvo v Nemčiji in kvalifikacije
    za SP 2025, upam, da tudi za marčevske kvalifikacije za olimpijske igre v Parizu
    2024. Od povabljencev je na bližnjih pripravah zaradi poškodbe kolena vprašljiv
    le Borut Mačkovšek, medtem ko bo Domen Makuc zaradi strgane zunanje stranske vezi
    in sprednje križne vezi dalj časa odsoten," je dejal selektor Uroš Zorman.'
  - '"Na bližnjih tekmah s Srbijo končni izid ne bo primarnega pomena. S srbskim selektorjem
    bom skušal doseči dogovor, da priložnost za dokazovanje dobi vseh 21 igralcev
    in ne le 16, na obeh tekmah pa se želimo osredotočiti na posamezne segmente v
    naši igri," je dodal Zorman.'
  - Slovenija se bo po prvi pripravljalni akciji nato znova zbrala konec decembra.
    Tedaj se bo v Slovenj Gradcu pomerila z Avstrijo, tik pred odhodom na januarski
    zaključni turnir v Nemčiji pa načrtuje tudi dve tekmi s Hrvaško in Črno goro.
