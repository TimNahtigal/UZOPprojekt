  paragraphs:
  - Prešernov spomenik je bil zanj prej breme, ki je do konca zaznamovalo njegovo
    kariero.
  - Čeprav je Zajec za seboj pustil precej obsežen kiparski opus male, nagrobne, arhitekturne,
    sakralne in spomeniške plastike, so se zapisi o njegovem delu vselej vračali k
    Prešernovemu spomeniku, ki je leta 1905 razdelil kranjsko javnost. Na političnem
    odru so se ob spomeniku cenjenemu pesniku lomila kopja liberalne in klerikalne
    struje (slednja je bila zgrožena nad goloto muze in objemom Črtomira in Bogomile
    na reliefu), na likovnem pa med zagovorniki akademskih in modernejših smeri. Za
    mladega kiparja, ki je komaj dobro končal študij, so bile neusmiljene kritike
    in osebne diskvalifikacije prevelik zalogaj, da ne bi pustile dolgotrajnejših
    sledi.
  - 'Kot zapiše ob zdajšnji kiparjevi razstavi v Narodni galeriji kustosinja dr. Mateja
    Breščak, bi seZajec s Prešernovim spomenikom, tudi če ne bi naredil drugih del,
    vpisal v zgodovino slovenskega spomeniškega kiparstva. Ampak druge kipe je napravil
    in ni jih bilo malo. Na razstavi, ki so jo pripravili v Narodni galeriji, je na
    ogled 57 od 362 vseh dokumentiranih del. Hinko Smrekar na svoji znameniti karikaturi
    Maškarada slovenskih likovnih umetnikov (1913) Zajca ni po naključju upodobil
    kot nadvse produktivnega peka, ki stoji na podstavku z napisom: “Vsak dan trikrat
    sveže pecivo!” Podoba kiparja, pred katerega je dodal pult s številnimi kipi (med
    temi so nekatera celo razpoznavna dela, na primer Kozakove sanje, Požar in Delavec
    z vrečo), nam pokaže umetnika, ki je bil izjemno dejaven.'
  - 'Ko so leta 1949 ob kiparjevi osemdesetletnici pripravili pregledno razstavo,
    je Zajčev dobri prijatelj, slikar in grafik Elko Justin o kiparju zapisal: " Usoda
    njegovih del je prav za prav ista kakor Jurija Šubica; mnogo več dobrega je za
    vedno izgubljenega v tujini, kakor ohranjenega v domovini. Vrsta njegovih del
    je komaj pregledna: je pa več osnutkov kakor izvršenih del. [...] Po vsem tem
    smo zdaj lahko prepričani, da bi tisti, ki bi mu bilo poverjeno, da bi nam z življenjsko
    razstavo del prikazal pravega Zajca – Zajca, kot mojstra umetnika – naletel na
    velike težave, prav pri iskanju onih stvari, ki so za Zajca umetniško značilne.”'
  - V to jabolko je pred dobrimi šestimi leti zagrizla Mateja Breščak in se lotila
    proučevanja opusa umetnika, ki doslej še ni doživel temeljitejše obravnave. Za
    ponazoritev – na razstavi ob kiparjevi 80-letnici je bilo razstavljenih 30 kipov,
    v biografskem leksikonu jih je navedenih 63. Kustosinji jih je torej uspelo evidentirati
    362, pri raziskovalnem delu pa so imeli pomembno vlogo dokumenti in del zapuščine
    – zlasti vsebina kovčka, ki ga je Narodna galerija v 90. letih 20. stoletja kupila
    v Galeriji Kos.
  - 'Kovček z dragoceno zapuščino V kovčku se je ohranila vsa pomembnejša dokumentacija:
    pisma, dnevnik njegove druge žene, spričevala, rojstni list, fotografije itd.
    Pomembna je tudi korespondenca Ivana Zajca z Rihardom Jakopičem, ki pokriva obdobje
    od leta 1902 do 40. let 20. stoletja, prav tako zapisniki Frana Vesela, ki so
    nastajali ob obiskih kiparjevega ateljeja. Svoja dela je Zajec omenjal v objavljenih
    člankih in ohranjenih dokumentih, za evidentiranje pa so koristne tudi skicirke.
    Da seznam ni popoln, nam pove kiparjeva opomba ob koncu seznama njegovih del,
    kjer omenja, da je veliko teh v tujini in da njihovih lastnikov ne pozna. Zajec
    je verjetno tudi zaradi grenke izkušnje po kritikah zaradi Prešernovega spomenika
    veliko potoval. Malokaterega slovenskega umetnika tistega časa je odneslo na toliko
    različnih koncev, posledično pa je veliko del izgubljenih. V Narodni galeriji
    so zato pozorni tudi na dražbe v tujini, kjer so v preteklosti že pridobili kakšnega
    od njegovih kipov ali pa ga vsaj evidentirali v starejših avkcijskih katalogih.
    Približno štirinajst del so na novo evidentirali tudi ob pozivu morebitnim zbiralcem,
    ki hranijo njegova dela. Zajec je v svojem popisu dela opisoval (na primer mož
    pijan, žena in punčka žalostni; mama z žogo in otrokom), kar olajša identificiranje
    kipov.'
  - Ker je bil Zajec v svojem slogu zelo eklektičen in je v razmeroma kratkem časovnem
    obdobju ustvarjal v raznolikih slogih (v različnih historičnih slogih s secesijskimi
    elementi, potem slikovito zajete kipe, po vojni pa tudi socialistično realistična
    dela), je po besedah kustosinje datiranje njegovih kipov precejšen izziv in na
    osnovi slogovne analize zelo nehvaležno početje.
  - Od Dunaja do New Yorka – po poti Ivana Zajca Razstava je tudi zato zasnovana nekoliko
    drugače – ne sledi kronološkemu konceptu, ampak je razdeljena v sklope, ki obiskovalca
    popeljejo po središčih, v katerih je kipar ustvarjal (Ljubljana, Dunaj, München,
    Pariz, New York, Trst, Dubrovnik, London, Rim, internacija na Sardiniji in na
    koncu spet ustalitev v rojstni Ljubljani), poudarijo pomembnejša poglavja v njegovi
    karieri, vključno z zgodbo o Prešernovem spomeniku, obenem pa osvetlijo tudi motivne
    poudarke njegovega opusa. Motivika Ivana Zajca je izredno raznovrstna – obsega
    mitološke prizore, biblijske motive, portrete, upodobitve otrok, akte, živali,
    japonsko in indijsko orientalsko eksotiko, tudi ruske motive in podobe ameriških
    staroselcev (te so ga navdušile ob obisku Metropolitanskega muzeja v New Yorku).
    Tu so tudi množice, pozneje skupine težakov, delavcev in kmečki žanr. Posebej
    mojstrsko je obvladoval relief, ki mu je dajal možnost upodabljanja figur, zlitih
    z naravo.
  - Posebna soba je namenjena njegovim javnim nagrobnikom in cerkveni arhitekturni
    plastiki, kar ponazarjajo fotografije in desetminutni posnetek javnih spomenikov,
    to poglavje padopolnjujejo tudi z vodstvi po Ljubljani.
  - Razstava se začne z dunajskim obdobjem in Zajčevim največkrat razstavljenim kipom
    Prestrašeni satir. Kip je bil odlit leta 1946 in je v sklopu razstave kiparstva
    in slikarstva narodov Jugoslavije v naslednjih dveh letih potoval po številnih
    evropskih prestolnicah. Narodna galerija je v 50. letih 20. stoletja v bron odlila
    veliko kiparjevih del, v depoju hrani tudi kar nekaj mavčnih delov teh kipov,
    kot sta glavi sicer znane plastike Adama in Eve ter prav tako Prestrašenega satira.
    Veliko pa je bilo takrat uničenega. Mateja Breščak domneva, da vključno z originalnim
    mavcem Kozakovih sanj, ko je bil odlit v bron. Mimogrede, relief Kozakove sanje
    je prvo delo slovenskega kiparja, razstavljeno na pariškem Salonu – to se je zgodilo
    leta 1906.
  - Sklop z dunajskim obdobjem poleg obiskovalcem Narodne galerije dobro znanega kipa
    Adama in Eve vključuje tudi Krotilko kač, ki jo je galerija leta 2007 odkupila
    na dražbi v Dorotheumu.
  - Kamnoseško-kiparska naveza Zatem se razstava dotakne naveze kamnoseške in kiparske
    družine Tomanov in Zajcev, ki zaznamuje kiparjevo zgodnje obdobje. Naveza je obstajala
    že v času delovanja očetov (Ivanov oče Franc Ksaver Zajec je bil kipar in v očetovi
    delavnici je mladi umetnik pridobil prvo kiparsko znanje), nato pa sta tradicijo
    nadaljevala Ivan Zajec in Feliks Toman. Sodelovala sta pri številnih projektih
    (med drugim v Budanjah pri Vipavi, v Mengšu, Šempetrski cerkvi, Frančiškanski
    cerkvi in pri številnih nagrobnikih), dokler se nista sprla zaradi Majdičevega
    nagrobnika za Prešernov gaj v Kranju, po katerem je Zajec s kamnosekom za vedno
    prekinil poklicne vezi.
  - Zgodba o Prešernovem spomeniku Sledi poglavje s Prešernovim spomenikom, ki je
    razumljivo v središču celotne postavitve. Po ogledu posameznih kipov, ki gledalca
    popeljejo po različnih obdobjih in središčih, se znajdemo pred velikansko fototapeto
    z reprodukcijo fotografije slovesnega odkritja spomenika leta 1905.
  - Zgodba s spomenikom se je vsaj za Zajca začela leta 1899. Takrat se je prijavil
    na natečaj, ki ga je razpisal Odbor za postavitev Prešernovega spomenika. Nanj
    je poslal dva osnutka, s čimer si je že takrat nakopal zamere in pritoževanja
    kolegov. Drugih pet kiparjev je poslalo samo enega. Zajčev prvi osnutek je predvideval
    žensko figuro v narodni noši, ob kateri sta Krst in Slovo, izbrali pa so kip pesnika,
    nad katerim na skali sedi ženski genij, ki nad pesnikovo glavo drži zvezdo.
  - Zajec, ki se je odmevnega projekta lotil v Makartovem ateljeju na Dunaju komaj
    tri leta po končani akademiji, ni bil kos pogromu, ki je sledil. Sprva se je zapletlo,
    ko je moral zaradi spoznanja komisije, da se ni držal navodil, že izdelane kipe
    uničiti, nato pa je v letih 1903 in 1904 izdelal nov osnutek pod budnim očesom
    svetovalca prof. Karla Kundmanna (reliefe so sprejeli takoj). Naslednji udarec
    je bila kritika, ki je sledila po odkritju spomenika na tedanjem Marijinem trgu
    10. septembra 1905. Negativne kritike sežejo v dve smeri – med seboj sprte stranke
    so spomenik izkoristile za politično obračunavanje, kulturno-umetniški krogi pa
    so kiparju očitali slogovno zastarelost akademskega realizma.
  - 'Posebej so morale biti boleče sodbe književnikov: Ivan Cankar je zapisal, da
    je Zajec “najmanj osebni, najpuščobnejši in (to je beseda) najponižnejši slovenski
    kipar”. Nič bolj prizanesljiv ni bil Oton Župančič, ki je takole zapisal: “In
    Tebe, France Prešeren, naš izcela človek, so znesli med nas reveža iz brona in
    kamna, brez vsake celote v samem sebi in brez vse zveze z okolico.” Ob tem velja
    omeniti Zajčev poznejši zapis o tem, da je kip ustvaril za parkovno okolje, torej
    naj bi po njegovi zamisli stal pred zelenim ozadjem.'
  - Umik v Pariz To je bilo obdobje, ki ga je Zajec do konca življenja pričakovano
    ohranil v negativnem spominu in se tudi pri svojih sedemdesetih letih o tem ni
    želel pogovarjati. Verjetno je negativno ozračje pripomoglo k temu, da je že nekaj
    mesecev pozneje, januarja 1906, odpotoval v Pariz, kjer je še istega leta razstavljal
    omenjene Kozakove sanje (kip je ustvaril že na Dunaju, leta 1906 pa je na kip
    dopisal leto datacije). S kiparstvom Augusta Rodina se je Zajec seznanjal že na
    razstavah v dunajski Secesiji. Justin pa je ob Zajčevi osemdesetletnici navedel,
    da naj bi se v Parizu Zajec tudi osebno seznanil s slavnim francoskim kiparjem.
    Njegovo delo je na Zajca naredilo velik vtis ter med drugim vplivalo na nastanek
    reliefnih del Požar in Val življenja.
  - Iz Rima v internacijo na Sardinijo Sledilo je več kot deset let potovanj – leta
    1907 je najprej odpotoval v New York, oktobra leta 1910 se je preselil v Trst
    in tam živi dve leti. Za poznavanje njegovega tržaškega obdobja so dragoceni spomini
    Vladimirja Bartola, v katerih izvemo, da je kipar živel pri Svetem Ivanu. Tam
    je ustvaril enega kakovostnejših kipov, Portret Tržačanke (1911), ki kaže odmeve
    dunajske secesije in pariških izkušenj. O ustvarjanju “ enega finega portreta
    tukajšnje gospodične Italijanke ” piše tudi Jakopiču.
  - Leta 1912 je Zajec potoval v London, vmes za kratek čas v Dalmacijo, leta 1913
    pa k Ivanu Meštroviću v Rim, kjer je ostal do leta 1915. Vendar se Meštrović ni
    pretirano zmenil za Zajca (bolj se je oziral k Jakopiču in Plečniku), nad čimer
    se je Zajec v pismih Jakopiču tudi pritoževal. Leta 1915 je bil kot državljan
    Avstro-Ogrske interniran na Sardinijo, kjer je ustvaril tudi nekaj del za tamkajšnje
    prebivalce in cerkve. Kot se je pozneje spominjal, je bilo tam zanj najhujše,
    ko so sojetniki zboleli za špansko gripo, sam za malarijo in se je ves izčrpan
    zaradi bolezni potem leta 1919 vrnil v Ljubljano. Poleg tega pa so ga na poti
    domov še okradli in ostal je brez vsega.
  - Kipar se vrne domov V Ljubljani je vstopil v okolje velikih pričakovanj – le kaj
    bo kipar Prešernovega spomenika ustvaril zdaj – in kmalu spet ostrih kritik, ki
    so bile neizprosne do njegovega nespremenjenega sloga, v katerem je še vedno odmeval
    akademizem, ki ga je prinesel še z Dunaja in ga le malo predrugačil po poznejšem
    pariškem obdobju ter po rimski izkušnji, ki je pustila v njegovem kiparstvu vplive
    antike (očitali so mu, da si je nadel togo Rimljana). S tem se začne njegovo ljubljansko
    obdobje, saj je ostal v mestu do smrti. Pri akademskem realističnem slogu je vztrajal
    do konca – ta je sicer ustrezal naročnikom portretov, ni pa mu bila naklonjena
    likovna javnost. Kot pove Mateja Breščak, so mu očitali pripovednost, zahajanje
    v detajle, vsi pa so mu priznavali izredno obrtnost, spretnost in delavnost.
  - 'Na kritike se je kipar odzival v časopisju, v katerem je pojasnjeval svoj umetniški
    kredo. Med drugim je pisal: “Stil je postranska stvar, je spremenljiv; glavno
    je, da kipar ostane zvest prirodi. Priroda je resnična in brez resnice ni umetnosti.”
    Prepričan je bil, da mora biti likovna umetnost predvsem " duhovno izrazita, enostavna
    in harmonična; ustrezati mora prirodnim zakonom. Slogov je mnogo, prav tako manir,
    toda umetnost je le ena; resnično pojmovanje prirode …”'
  - 'V prvih letih po vrnitvi v Ljubljano je resda životaril brez službe, ker mu,
    kot se je pritoževal v pismih in osebnih zapisih, oblast ni namenila priznanja
    pomembnega umetnika, vendar, kot pove Mateja Breščak, na splošno ni živel tako
    slabo, kot je v pismih tožil na primer Jakopiču. Zajca je ves čas študija finančno
    in z naročili podpirala premožna sorodnica Josipina Hočevar in mu ob smrti zapustila
    lepo vsoto. Zgovoren podatek je tudi ta, da si je pri njem slikar Peter Žmitek
    na primer izposodil denar za toplice, in ne gre pozabiti, da je bil za Prešernov
    spomenik potreben razmeroma zajeten znesek. V resnici je Zajec za tiste čase za
    umetnika razmeroma dostojno živel, veliko bolje kot Berneker, ki je bil do Zajca
    precej zavisten in do njegovega dela tudi kritičen. Slednje ne nujno povsem neupravičeno
    – kustosinja opozori na dva njuna spomenika: Zajčev Prešernov spomenik in Bernekerjev
    spomenik Primoža Trubarja ob Tivoliju. Med njima je le pet let razlike, a je slednji
    nedvomno kakovostnejši, Berneker je bil (ne le v tem primeru) veliko bolj moderen
    v samem pristopu in uspelo mu je veliko bolj prepričljivo ujeti duhovni portret
    Trubarja.'
  - '"Vedno žalosten, sam zase, rahločuten" Zajec se je torej v Ljubljano vrnil 14
    let po negativni izkušnji, ki je spremljala odkritje Prešernovega spomenika, za
    njim pa je bila tudi izkušnja internacije. V enem od zapisov leta 1921 je opisan
    takole: “Vendar z njegovega lica ne odseva ta sreča. On je vedno žalosten, sam
    zase, rahločuten, in vedno o nečem težko premišljuje. Glava mu je venomer polna
    načrtov, a žep mu je vedno prazen. Kadar kdo slučajno pogleda tega malega in neznatnega
    človeka, jadno oblečenega, niti ne bi mogel verjeti, da je to tvorec Prešernovega
    spomenika, da je ta človek živel in študiral več let v Parizu, v središču vse
    lepote in vsega okusa.”'
  - Kot nam pove opis in nam pokaže tudi Smrekarjeva Maškarada, je bil Zajec majhne
    rasti, vase zaprt, tih in skromen človek. “Majhen je, tih, skromen in ponižen,
    plah v vedenju, okoren v govoru in nespreten v rabi peresa. Zajec se zaveda svoje
    velike sposobnosti, vendar ne pozna ošabnosti, nego je ljubezniv in skromen, marljiv
    ter neumoren pri delu in študiranju. Mož je plodovit, a v izvrševanju vedno skrben
    in natančen, pristopen pametni kritiki in sam sebi najstrožji sodnik,” beremo
    v najzgodnejšem opisu umetnika leta 1902, ko je bil star 33 let.
  - Poročil se je razmeroma pozno – leta 1931 z Rozo Peterlin iz Velikih Lašč, ki
    pa je po treh letih umrla. Zatem se je poročil z njeno mlajšo sestro Josipino
    (Pepco) Peterlin, ko je imela 38 let, Zajec pa 69. Pepca je zlasti njegove zadnje
    mesece zvesto dokumentirala v dnevniku, ki ga hranijo v Narodni galeriji. V pismu
    bratu, ki je živel v Ameriki, sicer omenja, da njeno srce bije za Danija (Danila
    Požarja), s katerim se je po Zajčevi smrti tudi poročila. Požarja sta zakonca
    Zajec na dom kot podnajemnika sprejela leta 1944. Glede na zapise v dnevniku kustosinja
    sklepa, da je bil med zakoncema topel, spoštljiv odnos in je Zajec Pepčino naklonjenost
    do Danila tudi razumel.
  - Zamera do predvojne Jugoslavije Čeprav je šlo kiparstvo svojo pot, so se mlajše
    generacije v poznejšem obdobju vseeno s spoštovanjem ozirale na Zajca, pove Mateja
    Breščak. Zajec se je držal zase, umaknil se je od samega likovnega središča in
    v družbenem življenju ni izstopal. Med ljudmi, ki so mu bili blizu, je bil Jože
    Plečnik (ki ga ob odkritju Prešernovega spomenika ni tako očitno kritiziral).
    Plečnik je Zajcu pomagal leta 1927 nastopiti mesto učitelja Oddelku za arhitekturo
    Tehniške fakultete v Ljubljani, kjer je ostal do upokojitve leta 1940. Pozneje
    se je pritoževal, da mu predvojna Jugoslavija kljub izobrazbi ni priznala profesorskega
    naslova, ampak ga je “smatrala kot običajnega kamnoseka”, in da mu je pravo priznanje
    dodelila šele povojna oblast. Leta 1950 so mu podelili Prešernovo nagrado za življenjsko
    delo na področju kiparstva. To je bilo dve leti pred kiparjevo smrtjo.
  - Zadnje kiparjeve dneve je v dnevniku skrbno opisovala njegova žena. Obiskovala
    ga je v ateljeju – zadnji kiparjev atelje je bil na podstrešju v Švicariji v Tivoliju
    (ljubljanska občina mu ga je namenila še pred vojno) – in ob nekem januarskem
    dnevu leta 1952 zapisala, da ni mogel končati kipa Poljub in da je sredi dela
    odložil leseno modelirko “v zemljo nedovršenega kipa”. Bolezen ga je trdno priklenila
    na bolniško posteljo. Na postelji je delal načrte s tušem in vodenimi barvicami
    – 88 po številu v obliki albuma, 89 slika s tušem je zadnje delo, tj. 18. 6. 1952.
    30. 7. 1952 ponoči ob 12. uri 10 minut je nehalo biti srce in delavne roke so
    za večno ostale negibne.
  - Zadnji živeči predstavnik generacije tistih prelomnih let Petnajst dni pred smrtjo
    je dopolnil 83 let. Na razstavi ponuja vpogled v intimnejši del kiparjevega življenja
    in dela “zadnja soba”, ki pred nas med drugim postavi skicirke in posnetek kiparja
    ob delu. Posnetek je nastal malo pred tem, ko je dobil Prešernovo nagrado. In
    čeprav je kratek, ponuja dragocen pogled v nekaj trenutkov ustvarjanja kiparja
    prve generacije prenove kiparstva na Slovenskem – Bernekerja, Gangla, Repiča in
    Peruzzija ni bilo več. Pravzaprav je tudi generacija impresionistov odšla v desetletju
    prej – Zajec je bil še skoraj zadnji živeči predstavnik tistih prelomnih let v
    slovenski likovni umetnosti, ko se je 19. stoletje poslovilo in je 20. stoletje
    zakorakalo s svojo drugačnostjo.
  - Razstavo, ki si jo lahko ogledate do 11. februarja 2024, spremlja tudi obsežen
    katalog, ki ga z izjemo predgovora v celoti podpisuje Mateja Breščak.
  title: Ivan Zajec – kipar, ki se nikoli ni otresel "bremena" Prešernovega spomenika
