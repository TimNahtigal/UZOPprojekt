  paragraphs:
  - Ilievski je navijačem Olimpije dobro znan, saj je v treh epizodah igral za zeleno-bele,
    nazadnje leta 2011. Nosil je tudi drese Partizana, Barcelone, Lottomatice, Tau
    Ceramice, Efesa, Nymburka in zagrebške Cedevite. Kariero je končal leta 2017.
  - V košarkarski karieri je Ilievski med drugim osvojil naslov prvaka Lige Aba (2002),
    naslov slovenskega (2002), španskega (2004), italijanskega (2008) in češkega (2014)
    državnega prvaka. Vrsto let je bil tudi član makedonske reprezentance, s katero
    je nastopil na treh evropskih prvenstvih v košarki, leta 2011 pa je tekmovanje
    sklenil na četrtem mestu.
  - V zadnjih letih je bil predsednik Košarkarskega kluba Ilirija.
  - '" Zadovoljen in srečen sem, da se, tokrat v malce drugačni vlogi, vračam v klub,
    ki mi je dal ogromno in ki je bil odskočna deska za mojo kariero. Vso energijo
    in ambicije bom skupaj z vsemi sodelavci v klubu vložil v to, da spišemo uspešno
    zgodbo in da smo skupaj s člani strokovnega štaba in igralci velika družina, ki
    se dobro razume, v kateri vlada pozitivna energija, ki se ne čuti le znotraj kolektiva,
    temveč vidi tudi na zunaj," je ob naznanitvi prihoda na mesto športnega direktorja
    povedal Ilievski.'
  - Kot je dodal, je zanj velika čast, da je postal športni direktor najtrofejnejšega
    košarkarskega kluba v Sloveniji. " Želim si, da bi slovenski športni navdušenci
    in navijači prepoznali naše delo in se nam v čim večjem številu pridružili na
    naših domačih tekmah."
