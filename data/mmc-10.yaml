  url: https://www.rtvslo.si/gospodarstvo/cisti-dobicek-luke-koper-ob-polletju-visji-od-nacrtovanega/718765
  topics: gospodarstvo
  authors:
  - G. K.
  date: '2024-08-22T17:47:24'
  figures:
  - caption: Dobiček Luke Koper je bil v prvem polletju nad pričakovanji.
    img: https://img.rtvcdn.si/_up/upload/2023/12/04/66139281.jpg
    source: BoBo
  id: '718765'
  keywords:
  - Poslovni izid
  - Investicijski ciklus
  - Pretovor blaga
  - Čisti dobiček
  - Luka Koper
  lead: Luka Koper je v drugem letošnjem četrtletju na ravni skupine ustvarila 163,3
    milijona evrov čistih prihodkov od prodaje, kar je tri odstotke več kot v lanskem
    polletju, a vseeno je odstotek pod načrti. Čisti dobiček je bil 32,8 milijona
    evrov.
  mention: []
  paragraphs:
  - V Luki Koper so nerevidirano polletno poročilo komentirali z besedami, da je skupina
    polletje sklenila z dobrimi poslovnimi rezultati. Večina finančnih kazalnikov
    je tako presegla načrtovane, kljub postopnemu ohlajanju gospodarstva in napetim
    razmeram v Rdečem morju pa je upravljavec edinega slovenskega tovornega pristanišča
    v drugem četrtletju spet zaznal postopno rast pretovora, zlasti v zabojniškem
    segmentu.
  - V šestih mesecih skupaj je sicer skupni ladijski pretovor dosegel 11,3 milijona
    ton blaga, kar je bilo odstotek manj kot v lanskem prvem polletju in prav tako
    odstotek pod poslovnim načrtom.
  - Na zabojniškem terminalu so v Luki pretovorili 548.096 ton, kar je prav tako odstotek
    manj kot v enakem obdobju 2023 in dva odstotka pod načrti. Čeprav so prve mesece
    zaznamovale zamude v ladijskem transportu – tako na povezavah z Daljnim vzhodom
    kot med pristanišči v Sredozemlju –, so se razmere po pojasnilih iz Luke že aprila
    bistveno izboljšale, zato so drugo četrtletje sklenili s petodstotno rastjo prometa.
  - So se pa zamiki v prihodu ladij in postopno ohlajanje avtomobilskega trga odrazili
    na nižjem pretovoru vozil, ki je v prvih šestih mesecih znašal 409.460 vozil in
    bil medletno nižji za devet odstotkov, glede na načrtovanega pa za šest odstotkov.
  - Rast so po drugi strani zaznali na splošnih tovorih (devet odstotkov), kjer smo
    pretovorili več jeklenih izdelkov, in na tekočih tovorih (štiri odstotke). Na
    segmentu sipkih in razsutih tovorov je bil zaradi postopnega upada premoga skupni
    pretovor nižji, so pa v Luki v prvih šestih mesecih pretovorili več gnojil, pšenice
    in fosfatov.
  - Čisti prihodki od prodaje so bili s 163,3 milijona evrov za odstotek nižji od
    načrtov in za tri odstotke višji kot v prvem polletju lani. Več je bilo storitev
    polnjenja in praznjenja zabojnikovter drugih dodatnih storitev, manj prihodkov
    pa so zaradi hitrejšega obrata blaga v Luki zaznali iz obračunavanja skladiščnin.
  - Dobiček iz poslovanja (EBIT) skupine je s 37,3 milijona evrov za 26 odstotkov
    presegel načrte, a bil vseeno za odstotek nižji kot v lanskem prvem šestmesečju.
    Družba je imela nižje stroške energentov in materiala ter storitev vzdrževanja,
    višji pa so bili ob usklajevanju plač in novem zaposlovanju stroški dela. So bili
    pa vsi ti stroški nižji od načrtov, skupno so bili tako stroški poslovanja za
    šest odstotkov nižji od načrtovanih.
  - Dobiček iz poslovanja pred amortizacijo (EBITDA) je bil s 54 milijoni evrov na
    ravni rezultata iz lanskega polletja, a 16 odstotkov višji od načrtov.
  - Čisti poslovni izid je bil z 32,8 milijona evrov za 24 odstotkov višji od načrtovanega
    in za tri odstotke nad izidom iz lanskega polletja, temu pa je prispeval tudi
    180 odstotkov višji poslovni izid iz financiranja v znesku 1,9 milijona evrov.
  - V Luki Koper so spomnili, da so na začetku leta zagnali tudi obsežen investicijski
    ciklus, ki so ga konec leta 2023 zastavili v strateškem poslovnem načrtu za obdobje
    2024–2028. Aprila so sklenili gradnjo več sončnih elektrarn skupne moči 4,2 megavata,
    ki se razprostirajo na strehah skladišč. Na drugem pomolu so začeli gradnjo 12.
    veza in nadaljevali premestitev skladiščnih blokov na zabojniškem terminalu, cevovodov
    na drugem pomolu in nadgradnjo polnilnih mest za goriva.
  - V šestih mesecih so za naložbe skupno namenili 20,7 milijona evrov, kar je sedem
    odstotkov več kot v lanskem prvem polletju, a vseeno za 14 odstotkov pod načrti.
    Še bistveno večje naložbe so načrtovane za naslednja četrtletja.
  title: Čisti dobiček Luke Koper ob polletju višji od načrtovanega
  n_comments: 1
