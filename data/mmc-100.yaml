  lead: '"ZDA skrbi, da izid volitev v Venezueli ne odraža volje volivcev," je dejal
    ameriški državni sekretar Antony Blinken. Sentiment ni nov. ZDA že 25 let "skrbi"
    venezuelsko vodstvo, ki se ne pod Hugom Chavezom ne pod Nicolasom Madurom ne uklanja
    Washingtonu.'
  mention:
  - Kaja Sajovic
  - Donald Trump
  - Juana Guaidoja.
  - Huga Chaveza
  - Tulsi Gabbard.
  - John Bolton
  - Marca Rubia
  - Javier Milei,
  - Elon Musk,
  - Benjaminu Netanjahuju
  - Ajamu Baraka.
