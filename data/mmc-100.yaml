- _id: 660685929bf5764acd04d930
  url: https://www.rtvslo.si/slovenija/protest-kmetov-bo-19-marca-v-ljubljani-ministrstvo-tezav-se-ne-da-resiti-takoj/701256
  topics: slovenija
  authors:
  - T. L. Š.
  date: '2024-03-12T09:43:38'
  figures:
  - caption: Anton Medved.
    img: https://img.rtvcdn.si/_up/upload/2024/03/12/66165602.jpg
    source: BoBo/Borut Živulović
  keywords:
  - Obdavčitev
  - OMD plačila
  - Protest kmetov
  lead: Protest kmetov bo potekal s traktorji in panoji pred ministrstvi in tudi pred
    Trgom republike. Pozivamo na mirne, kulturne proteste, saj menimo, da smo kmetje
    kulturni in ne pričakujemo nekih izgredov, je pojasnil predsednik sindikata kmetov
    Anton Medved.
  mention:
  - Anton Medved
  - Janez Beja
  - Roman Žveglič
  - Anja Kastelic
  - Borut Florjančič
  paragraphs:
  - '" Kmetijske organizacije smo se odločile, da kljub prizadevanjem ministrstva
    za kmetijstvo, ministrstva za naravne vire in drugih nismo zadovoljne z intenzivnimi
    pogajanji, ki niso rodila sadov, zato napovedujemo za 19. marca protest po celi
    Ljubljani s traktorji," je dejal predsednik sindikata kmetov Anton Medved, ki
    pričakuje okoli 2000 traktorjev na protestu, ki naj bi potekal od 10. do 14. ure.'
  - '" Opravičujemo se meščanom Ljubljane za neljube dogodke, vendar opozarjamo, da
    se borimo za svoje pravice, kajti kmetje smo tisti, ki zahtevamo od vlade in drugih
    določen pristop, da bomo lahko kmetje še naprej obdelovali slovensko podeželje,"
    je dodal.'
  - Janez Beja, predstavnik hribovskih kmetij, je povedal, da jih 45 tisoč zahteva
    umik obdavčitve izplačil za območja z omejenimi dejavniki za kmetijsko dejavnost
    (OMD-plačila).
  - '" Vsa leta to ni bilo obdavčeno, sedanja vlada pa je to obdavčila. Veliko kmetij
    je, kjer obdelujejo hribovita, strma območja. Tukaj ni prihodkov, in to je treba
    umakniti, če želimo ohraniti te površine, predvsem pa, če želimo mlade ohraniti
    na teh površinah," je poudaril in pojasnil, da zahtevajo zmanjšanje pristojbin
    za gozdne ceste.'
  - Med zahtevami, ki so jih predstavili predstavnik kmetijskih organizacij, je tudi
    gradnja suhih vodnih zadrževalnikov na kmetijskih površinah.
  - '" Kmetje ne nasprotujemo protipoplavnim ukrepom, vendar menimo, da se je treba
    s tresočo roko vključevati pri načrtovanju suhih vodnih zadrževalnikov, s katerimi
    bi izgubili ogromno najboljše kmetijske zemlje," je povedal predsednik Kmetijsko-gozdarske
    zbornice Slovenije (KGZS) Roman Žveglič. " Ključna zahteva je, da se naredi celovita
    presoja vplivov na okolje, da se preveri vsaka kmetija, kaj bi takšno načrtovanje
    za to kmetijo pomenilo in da se naredita ekonomski izračun in sanacijski načrt
    za vsako posamezno kmetijo," je dejal.'
  - 'Kmetje med drugim zahtevajo še zmanjšanje števila velikih zveri na območju Slovenije
    na okoljsko vzdržno. " Ob vstopu v Evropsko unijo smo imeli 800 medvedov, dva
    tropa volkov, zdaj pa se je to bistveno povečalo, in zahtevamo, da se to zmanjša,"
    je dejal Medved in poudaril, da je pred pašno sezono slovenskim kmetom treba povedati,
    ali še lahko v visokogorju pasejo: " Če se število zveri ne bo zmanjšalo, enostavno
    ne bodo mogli kmetje dati živine na pašo."'
  - '" Od vlade je odvisno, ali bodo imeli Ljubljančani težave s traktorji in s protestom
    v torek. Pričakujemo, da bomo do petka dosegli določen napredek pri teh zahtevah.
    Če bo izpolnjeno vseh sedem ključnih zahtev, potem bo protest odpovedan. Če bo
    ostala samo kakšna zahteva nedorečena ali pa da bomo potrebovali čas za dogovor,
    potem ga bomo zamrznili," je pojasnil predsednik KGZS-ja Žveglič.'
  - Predsednica Zveze podeželske mladine Anja Kastelic pa je opozorila, da je nedopustno,
    da sredi marca določene kmetije še vedno niso prejele izplačil, vezanih na zbirno
    vlogo, ki jim predstavljajo zagonska sredstva za začetek proizvodne sezone. "
    Mi zahtevamo takojšnja izplačila in pa zavezo, da bodo izplačila v prihodnjem
    letu redna in da bodo roki jasni," je dejala.
  - Predsednik Zadružne zveze Slovenije Borut Florjančič pa se je dotaknil kmetijskih
    okoljskih podnebnih ukrepov, ki po njegovih besedah ne smejo biti sami sebi namen.
    Ob tem je pozval k zagotovitvi dovolj sredstev za izvajanje ukrepov.
  - Ministrstvo za kmetijstvo, gozdarstvo in prehrano razume stisko kmetovalcev, ki
    je posledica negotovosti pri opravljanju kmetijske dejavnosti ter razmer na trgu
    s kmetijskimi proizvodi.
  - Kot so dodali, so z vsemi deležniki tvorno vključeni v procese in dosledno iščejo
    najboljše rešitve za vse. "Ministrstvo tako skupaj z drugimi resorji, pristojnimi
    za posamezne zahteve, aktivno preučuje izražene zahteve in išče pravno podprte,
    finančno vzdržne in tudi za kmetovalce sprejemljive rešitve," so ponovili.
  - V prvem sklopu je ministrstvo prejelo 15 zahtev od kmetov, nato jih je prišlo
    še enkrat toliko. "Za veliko njih smo že poiskali rešitve, k prav vsem pa smo
    dejavno pristopili," so dodali.
  - Zahteve kmetov jemljejo resno, glede iskanja odgovorov na zahteve pa največ težav
    pričakujejo pri tistih pričakovanjih, ki so vezana na ureditev v pravu EU-ja.
  - Ob napovedi protestov so dodali, da sta svoboda izražanja in pravica do zbiranja
    ter združevanja ustavni kategoriji.
  - So pa na ministrstvu poudarili, da so se izražene težave nakopičile v daljšem
    obdobju in se jih ne more rešiti niti vseh naenkrat niti takoj, temveč v procesu
    medsebojnega sodelovanja oz. pogovora. "Vemo, da je Slovenija majhna dežela z
    omejenimi kmetijskimi površinami in resursi, ki jih moramo prav zato skupaj negovati
    in jih vzdrževati," so dodali.
  - Po njihovem prepričanju je rešitve tako mogoče najti samo za mizo in v skupnem
    dogovarjanju z vsemi vpletenimi. " Zato bo še naprej prioriteta iskanje konstruktivnih
    rešitev, ki bodo v dobro vseh," so sklenili.
  title: 'Protest kmetov bo 19. marca v Ljubljani. Ministrstvo: Težav se ne da rešiti
    takoj.'
