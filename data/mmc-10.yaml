  paragraphs:
  - Današnji sestanek med Robertom Golobom in Sašem Bergerjem je bil sklican po tem,
    ko je Petrol zaradi nove regulacije cen pogonskih goriv za nedoločen čas zaprl
    štiri poslovalnice.
  - Prejšnji teden je Golob ob Petrolovi napovedi zaprtja nekaterih bencinskih servisov
    dejal, da podjetje s tem kaže vsem prebivalcem, za kaj mu v resnici gre. " Za
    navadno požrešnost po dobičku in da jim ljudje preprosto niso pomembni," je poudaril.
  - Kot so povedali v premierjevem kabinetu, so pogovori usmerjeni v iskanje rešitev
    za nastali spor. Po današnjem srečanju Goloba in Bergerja se bodo pogovori nadaljevali
    na ravni ministrstev.
  - V ponedeljek se je z Bergerjem v Kostelu – med bencinskimi servisi, ki jih je
    Petrol pred kratkim začasno zaprl, je namreč tudi tisti v Petrini v občini Kostel
    - sešel tudi minister za kohezijo in regionalni razvoj Aleksander Jevšek.
  - Kot je Jevšek povedal po ponedeljkovem srečanju, so se dogovorili, da bo v čim
    krajšem času stekel dialog med vlado in Petrolom o morebitnih rešitvah. Do srede
    bodo v Petrolu tudi znova pretehtali, ali je zaprtje omenjenih črpalk res smiselno.
  - Berger je ponedeljkov sestanek označil kot " pomemben korak k vsebinskemu in spoštljivemu
    dialogu, ki je temelj oziroma predpogoj za vzdržne dolgoročne rešitve".
