  lead: '"Nisem človek, pesnik sem," je plodovit in na številnih področjih dejaven
    italijanski pesnik Franco Arminio izjavil na začetku nenaslovljene pesmi na 128.
    strani zbirke Prepusti pot drevesom.'
  mention: []
  paragraphs:
  - 'Končal jo je z verzi "Resničnost ni moj kraj, morda prav zato lahko prepoznam
    / nekatere njene poteze: zaradi menjavanja bližine in oddaljenosti." V tej, zanj
    sicer netipično lakonični in nekako analitični pesmi Franco Arminio zelo posrečeno
    povzema svojo pesniško in življenjsko držo in usmerjenost. Je namreč izrazito
    dvoplasten pesnik, v tej dvoplastno sti pa presenetljivo enoten, naravno homogen.
    Po eni strani je njegova poezija močno intimistična in samopreiskujoča, po drugi
    pa odprta, iskateljska navzven, v zunanjo resničnost naravnega in družbenega okolja
    tu in zdaj. Ta poezija je kot rokavica, ki je enako trpežna, uporabna, pa tudi
    mehka in topla z obeh strani, naj bo obrnjena navzven ali navznoter.'
  - Pesnika, rojenega leta 1960, je zelo zaznamovala rodna Kampanja, dežela na jugu
    Italije, ki je bila zaradi težkih naravnih razmer vedno zaznamovana z revščino,
    leta 1980 pa jo je še posebej prizadel uničujoč in smrtonosen potres, po katerem
    si ni nikoli prav opomogla. Ljudje so se množično izseljevali, domove je začelo
    preraščati drevje, ogromno vasi je ostalo skoraj povsem praznih in stoletna kultura
    tradicionalnega, pretežno kmečkega načina življenja je izgubila tla pod nogami.
  - Arminio se kot časnikar, ki je začel pri lokalnih glasilih, pozneje pa prodrl
    v osrednje italijanske medije, kot režiser dokumentarnih filmov, neutruden organizator
    raznovrstnih kulturnih dogodkov in ne nazadnje tudi kot spletni komentator ves
    čas trudi ozaveščati javnost o socialnih in okoljskih tematikah, povezanih z degradiranim
    in siromašnim italijanskih jugom, posebej v krajih, ki jih je prizadel potres.
    Je torej nekakšen družbeni aktivist, preizkusil se je tudi v politiki, bil je
    kandidat za evropskega poslanca in za župana v rodnem kraju Bisaccia, kjer si
    je v nekdanji očetovi gostilni ustvaril dom in družino.
  - 'Vendar je treba razumeti, da so vse te dejavnosti, v katere je Arminio vprežen,
    prej kot vse drugo različni odvodi primarno pesniškega angažmaja; izražajo globoko
    človeško, pogosto paradoksalno in protislovno zaznavanje resničnosti, ki pa je
    po drugi strani tudi zategadelj estetsko, etično in spoznavno celovitejše. Če
    to opombo strnem tako, da si pomagam s parafrazo na začetku omenjenih verzov,
    bi mu lahko v usta položil tudi izjavo: Nisem politik, človek sem. Resničnost
    je pač preveč kompleksna, predvsem pa nikoli povsem razpoložljiva, zato še tako
    dober politični program vedno ostane ujet v svojo strugo, ki ga obsoja na to,
    da v skladu z lastnim principom, ne meneč se za postransko škodo, po čim krajši
    poti nezadržno teče navzdol.'
  - Poezija, po drugi strani, nikamor ne odteka, temveč odpira. Odpira čutila zaznavanja,
    prostor človeškega odpira v predčloveško in nadčloveško. " Poezija je od svetnikov
    in zveri, / nikoli od natančnih in omikanih " je Arminio zapisal v dialoški pesmi
    Pismo Pasoliniju. Poezija ni srednja mera, mlačno povprečje, poezija so skrajnosti.
    Skrajnosti, ki v trepetajoči, večno nemirni roki življenja vedno znova začrtavajo
    prostor našega bivanja, njegovo dno in njegov višek.
  - Skrajnosti pogosto vidimo v obliki nasprotij in nasprotja po navadi dojemamo s
    formalno-logičnega vidika, v njihovi izključujočnosti ; tako je nekaj bodisi visoko
    bodisi nizko, ne more pa biti oboje. No, v poeziji na splošno, v pesmih Franca
    Arminia pa še posebej, omejitve formalne logike ne veljajo. Za njegovo poezijo
    sta značilna prav poudarjeno združevanje nasprotij in izostren občutek za paradoksalne
    vidike bivanja in ambivalentne življenjske položaje. To kaže že kar prva pesem
    zbirke, tista, katere zaključni verz je pristal v njenem naslovu Prepusti pot
    drevesom. Beremo jo lahko tudi kot nekakšen moto, koncentriran pesniški program.
    Pesnik priklicuje v zavest, da je vsak človek smrtno bitje in da je hkrati – ne
    zaradi tega ali pa navkljub temu – vsak človek rojen za to, da življenje izkusi
    kot nekaj dobrega. Potem nadaljuje, kaj si zamišlja kot dobro, in k temu poziva.
    Dobro lahko zazna le tisti, ki je odprt, ki zna prisluškovati. Pri tem mora biti
    hkrati ponižen in pokončen, ustrežljiv in ponosen, občutljiv za milino in zmožen
    ostrine. Miroljuben namen ne izključuje borbenega duha, nepreračunljiv pogum ne
    izključuje prizemljenega občutka za to, kaj je res pomembno.
  - Arminio seveda ne piše priročnikov za samopomoč in receptov za dobro življenje,
    temveč poezijo. Je pa res, da to ni poezija, ki bi se trudila ostati v čistih,
    snežno belih sferah brezinteresne estetske kontemplacije, ampak angažirana poezija.
    Angažirana v elementarno dobrem pomenu, brez trohice resentimenta, brez dlake
    sovraštva, zagrenjenosti in moralističnega izvzemanja lastnega položaja, kar vse
    se v podobne pesniške projekte pogosto tako rado in kar nekako samo od sebe od
    nekod pritepe.
  - 'Na štiri razdelke razdeljena zbirka (Zaledje oči, Kratkost ljubezni, Pesnik z
    družino, Poezija v času spleta) je tematsko sicer še kar široka, toda prevladujoča
    vsebinska intonacija in formalni vzorec, s tem pa tudi prepoznavna značilnost
    teh pesmi, je slej ko prej vokativ, poziv, nagovor. To so pesmi, ki te hočejo
    vznemiriti, ne pomiriti, pesmi, ki tako brezkompromisno resnicoljubno razgaljajo
    utečeno in predvidljivo, konformno in samozadostno, da se v najboljših variantah
    na višji ravni dotaknejo ravno območja miru, ki ga daje občuteno spoznanje, pesniška
    vednost. Verzi iz nenaslovljene pesmi na str. 45 pravijo: "Vedi, da te reši /
    le stiska. In vedi, da si rešen, / ko se razkrije tvoja bornost."'
  - Iz oddaje S knjižnega trga.
  title: 'Franco Arminio: Prepusti pot drevesom'
