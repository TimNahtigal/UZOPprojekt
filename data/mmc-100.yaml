  lead: 'Roman Vrnitev domov pisatelja, pesnika, prevajalca in urednika Janija Virka
    je konkretno soočanje s spraševanjem o življenju, njegovih skrivnostih, zakonitostih
    in času. '
  mention: []
  paragraphs:
  - V vse to je avtor spretno vpletel vse like in jih proti koncu dela sestavil v
    mozaik celotne zgodbe, ne nazadnje življenja samega. Prav to skladanje delčkov
    je odlično izpisano.
  - Občasno se avtor ukvarja z motivi in temami, ki jih je v svojih romanih, na primer
    v Raheli, že obravnaval. Protagonist roman Vrnitev domov Blaž Rowenski se bliža
    tako imenovani prelomnici življenja, vstopu v zrela leta. Tok pripovedi nas tako
    na fizični kot na mentalni ravni spretno vrača domov. Povodi za to so različni,
    skupni sta jim neizogibnost in občutek za odgovornost. Virk spretno povezuje in
    niza vprašanja, dejstva in pomisleke, kot jih pač prinaša življenje. Vse pa je
    povezano, ključna točka je namreč dom oziroma sidro, ki bi ga protagonist rad
    ohranil.
  - Izjemno subtilno in tehtno premišljevanje o življenju je v romanu prikazano iz
    različnih vidikov, pri čemer gre za like in likinje, ki se spopadajo z boleznijo,
    sindromom praznega gnezda ali vprašanjem o očetovstvu. Roman bi morda lahko primerjala
    z delom Sama Ruglja Resnica ima tvoje oči, saj se obe deli soočata z nekaterimi
    notranjimi pomisleki in tudi struktura je podobna.
  - Med mlajšimi odraslimi pa so v romanu jasni premisleki o podnebnih spremembah,
    aktivizem in razmišljanje o rusko-ukrajinski vojni. Virk vojne ne prikazuje črno-belo,
    postavlja tudi vprašanje o imenu in položaju ruskega jezika in slovanstva. Vmes
    pa ne manjka ironičnih pomislekov o ezoteriki ali podobnih novodobnostih, ki jih
    ponuja svet.
  - Roman Vrnitev domov nas na berljiv način vodi med Nemčijo in Slovenijo, z vmesnimi
    spomini v Jugoslavijo. Ključna točka je protagonistovo vračanje v Ljubljano, v
    kateri se je rodil in odraščal. Ob tem Virk spretno pelje dve Blaževi življenji,
    in sicer med nekoč in danes, v tujini in doma. Prav tu obstane in se ne preda
    pretiranemu sentimentalizmu, čeprav se vprašanju o domu ne izogne. Vračanje je
    bolj posledica neizpolnjenih sanj na poti v odraslost in spomina na nekoč ljubljeno
    osebo. Prav to zadnje je eno ključnih gonil zgodbe, ki protagonista potisne v
    spomine in mogoče skušnje. Avtor ga v takih podrobnostih celo prikaže nekoliko
    nespretnega, pri čemer je pomembno razrahljanje dominantne moške vloge. Tudi preostali
    moški liki v romanu so prikazani s hibami, ki travmatično posegajo v življenja
    likinj.
  - Roman Vrnitev domov prikazuje umetniško in kulturno dogajanje, v katero sta vključena
    zakonca Rowenski in in na podlag tega lahko začutimo predvsem utrip in pogled
    v slovensko in nemško govorečem okolju. Prav ta del ima močno sporočilnost o dogajanju
    na "sceni" in vstopu nanjo, zlasti s prikazovanjem določenega pripetljaja. Avtor
    spretno ruši togosti in predvidljivosti, a jih vedno postavi na stran zasidranega
    in mirnega, tudi sam zaključek romana se izogne klišeju.
  - Čeprav bi lahko rekli, da roman Janija Virka Vrnitev domov govori tudi o zaljubljenosti,
    analizira predvsem ljubezen in odločitve o njej, predvsem pa o njenem pomenu in
    vrednosti. A ne gre za moraliziranje. Roman je močan tudi na simbolni ravni, saj
    mu ne manjka pomenskih odtenkov. Vse je namreč lahko pot; spomin in točka vračanja
    morata ostati. Težko pa je nositi skrivnost in z njo živeti.
  - Iz oddaje S knjižnega trga.
