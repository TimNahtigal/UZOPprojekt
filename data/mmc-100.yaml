  paragraphs:
  - '"Verjamem, da v demokratični in pravni državi, kot je Slovenija, ni in ne sme
    biti prostora za takšne srhljive zlorabe. Kakršno koli podrejanje institucij za
    doseganje političnih ciljev ter obračunavanje s političnimi nasprotniki, mediji
    in civilno družbo je nedopustno, moralno zavržno in morebitno kaznivo dejanje.
    Takšni politiki in posameznikom moramo kot družba odločno reči ne," je v odzivu,
    ki so ga posredovali iz njegovega kabineta, dejal premier Robert Golob.'
  - Urad RS za preprečevanja pranja denarja je po poročanju portala N1 na podlagi
    anonimke leta 2021 sprožil eno najobsežnejših preiskav bančnih računov v državi.
    V manj kot treh tednih je poslal 238 zahtev za vpogled v 195 transakcijskih računov
    107 fizičnih oseb in podjetij. Obsežno dokumentacijo naj bi po poročanju portala
    Necenzurirano hranil v prostorih nekdanjega arhiva, del te dokumentacije pa naj
    bi medtem celo izginil.
  - Tedanji direktor urada Damjan Žugelj je v odzivu na razkritje medijev med drugim
    zapisal, da pri preiskavi ni šlo za "nobeno pregledovanje in preverjanje lastnikov
    medijskih hiš", "takšne lažne obtožbe in vodenje postopkov po nareku medijev"
    pa imajo po njegovih besedah za cilj osebno diskreditacijo ter "lahko povzročijo
    nesluteno nestabilnost v postopkih tudi v drugih državah".
  - Ob razkritju so v koaliciji opomnili, da je bil zakon o preprečevanju pranja denarja
    in financiranja terorizma sprejet tik pred koncem mandata prejšnje vlade Janeza
    Janše. Več koalicijskih poslancev je pri tem menilo, da je šlo za premišljen manever
    za politično obračunavanje. Janša je navedbe zavrnil kot absurdne.
  - Oglasila se je tudi informacijska pooblaščenka Mojca Prelesnik, ki je ponovila,
    da aktualni zakon o preprečevanju pranja denarja in financiranja terorizma nima
    varovalk in omogoča zlorabe. Julija lani je zato na ustavno sodišče naslovila
    zahtevo za presojo ustavnosti zakona. "Nam so zazvonili alarmi predvsem zaradi
    anonimnih prijav, anonimnih ovadb, kjer v bistvu lahko urad pridobiva veliko količino
    osebnih podatkov. Bančni podatek, ne nazadnje pa tudi davčni podatek, lahko pove
    vse o vašem življenju," je povedala za POP TV.
  - Žuglja sicer zaradi suma zlorabe uradnega položaja preiskuje Nacionalni preiskovalni
    urad. Po poročanju N1 naj bi policija in tožilstvo vodila preiskavo v smeri, ali
    je Žugelj s sprožitvijo ene najobsežnejših preiskav v zgodovini urada morebiti
    kršil zakon, zlorabil položaj in pomembno državno institucijo.
