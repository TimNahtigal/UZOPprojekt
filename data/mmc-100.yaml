  url: https://www.rtvslo.si/slovenija/skoraj-tretjina-vseh-zelezniskih-nesrec-so-nesrece-na-zelezniskih-prehodih/717752
  topics: slovenija
  authors:
  - G. C.
  date: '2024-08-12T07:37:45'
  figures:
  - caption: Hoja po železniški progi ni zgolj smrtno nevarna, ampak je tudi nelegalna.
    img: https://img.rtvcdn.si/_up/upload/2022/04/03/65976787.jpg
    source: BoBo
  id: '717752'
  keywords:
  - Nepravilno prečkanje
  - Preventivni nadzor
  - Železniški prehodi
  lead: Za povečanje varnosti na železniških prehodih Slovenske železnice izvajajo
    preventivni nadzor nad prečkanjem železniške proge. Po zakonu o varnosti v železniškem
    prometu je predvidena globa za prepovedano prečkanje proge 400 evrov.
  mention:
  - Matjaža Kranjca
  paragraphs:
  - Namen preventivnega nadzora, ki bo potekal do 21. avgusta in v katerem sodelujejo
    z republiškim inšpektoratom za železniški promet in policijo, je ozaveščanje javnosti
    o nevarnostih nepravilnega prečkanja železniške proge, zmanjšanje števila nesreč
    in povečanje varnosti. Po ocenah Mednarodne železniške zveze je na svetu več kot
    pol milijona železniških prehodov, od tega jih je nekaj več kot 20 odstotkov v
    EU-ju.
  - Skoraj tretjina vseh železniških nesreč v Evropi in drugod po svetu so nesreče
    in smrti kot posledica na železniških prehodih. Če k temu dodamo še nedovoljeno
    zadrževanje na železniških tirih in njihovo nepravilno prečkanje, se število povzpne
    na več kot 90 odstotkov vseh železniških nesreč, so navedli pri Slovenskih železnicah.
  - Na leto umre od 18 do 22 ljudi
  - Po besedah direktorja družbe SŽ-Infrastruktura Matjaža Kranjca na slovenskih tirih
    letno v povprečju umre od 18 do 22 neudeležencev v železniškem prometu, bodisi
    zaradi samomorov, nepravilnega prečkanja proge ali nepravilnega gibanja ob progah.
    Pri tem na nivojskih prehodih zaradi nepravilnega prečkanja proge letno v povprečju
    umrejo dva do trije ljudje, pogosto so to mladi, je dejal Kranjc.
  - Nepravilno prečkanje proge je smrtno nevarno, zato je nujno, da se vsi udeleženci
    v prometu zavedajo tveganja in dosledno upoštevajo prometne predpise. Hoja po
    železniški progi pa ni zgolj smrtno nevarna, ampak je tudi nelegalna. Po zakonu
    o varnosti v železniškem prometu je predvidena globa za prepovedano prečkanje
    proge, ki jo izreka republiški inšpektorat, 400 evrov.
  - Med nadzorom bodo predstavniki Slovenskih železnic, republiškega inšpektorata
    za železniški promet in policije izvajali poostrene kontrole na najbolj kritičnih
    železniških prehodih in mestih, kjer se dogajajo prekrški. Poleg nadzora bodo
    potekale tudi informativne aktivnosti, ko bodo mimoidoče opozarjali na pravilno
    obnašanje v bližini železniških prog.
  - Pri Slovenskih železnicah vse udeležence v prometu pozivajo, da železniško progo
    prečkajo na označenih mestih, se pred prečkanjem proge prepričajo, da ni prihajajočih
    vlakov, na železniških prehodih dosledno upoštevajo signalizacijo in varnostne
    naprave, ne hodijo po železniških tirih in med prečkanjem ne uporabljajo slušalk
    ali mobilnih telefonov. Po njihovih navedbah je veliko nesreč mogoče preprečiti,
    zato je treba spoštovati prometno signalizacijo in varno prečkati železniško progo,
    kjer in ko je to dovoljeno.
  - Vsaka žrtev na železnici je po Kranjčevih besedah preveč, obenem pa ob takšnih
    nesrečah nastanejo tudi velike ovire v železniškem prometu, ki jih najbolj občutijo
    potniki. Preventivne akcije, kot je trenutna, naj bi pripomogle, da bi bilo žrtev
    čim manj.
  title: Skoraj tretjina vseh železniških nesreč so nesreče na železniških prehodih
