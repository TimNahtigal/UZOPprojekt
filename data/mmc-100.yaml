  mention:
  - Roberta Goloba
  - Tatjani Bobnar
  paragraphs:
  - Po politično burnih tednih vlada Roberta Goloba že drugi mesec zapored izgublja
    javno podporo.
  - '" Ni na meni, da v tem trenutku kritiziram notranjepolitično situacijo, trenutno
    se bolj kaže kot kriza koalicije ali pa predvsem kot kriza vladajoče stranke,"
    je po drugem predsedničinem forumu (na temo prehranske samooskrbe in varnosti)
    na Brdu pri Kranju dejala predsednica republike Nataša Pirc Musar, ki opozarja,
    da mora vlada znova pognati voz z reformami, predvsem zdravstveno.'
  - '" Vsi imamo občutek in vemo, da nas ta občutek ne vara, da so vse reforme zastale.
    Edino, kar teče, in prav je, da teče, so popoplavne reforme," je poudarila.'
  - Veliko prahu je dvigovala napoved premierja o rekonstrukciji vlade in morebitnem
    krčenju števila ministrstev, kar je Golob zagovarjal še pred prazniki. " Vendarle
    sem vesela, da rekonstrukcije ne bo, to bi bil spet predolg mrtvi tek," je dejala
    predsednica in izrazila tudi jasno podporo nekdanji ministrici Tatjani Bobnar,
    ki se je po odhodu iz ministrskih vrst zaposlila v predsedničinem kabinetu.
  - '" Na teh zaslišanjih nisem prisotna niti se z Bobnarjevo ne pogovarjam o tem.
    Lahko pa vam samo ponovno zatrdim, da ji popolnoma zaupam. Ni na meni, da komentiram,
    komu sama bolj verjamem, še vedno verjamem v pravno državo in ta mora opraviti
    svoj posel," je pojasnila.'
  - Kako pa pretresi vplivajo na njen odnos s premierjem? " Seveda ne prav dobro,
    razumljivo je, da so določene napetosti zaradi tega, a ravno včeraj sem s predsednikom
    vlade govorila in se že dogovarjava, kdaj se naslednjič vidiva na sestanku. Moja
    želja je, da oba razmišljava o prihodnosti Slovenije,'' je sklenila predsednica.
