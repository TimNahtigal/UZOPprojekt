  - 'Ob 21.00:'
  paragraphs:
  - Ljubljančani so v Banjaluki prevladovali vse do izključitve Raula Florucza v uvodu
    drugega polčasa, nato pa z desetimi igralci prejeli gol v sodniškem dodatku, strelec
    je bil eden izmed dveh Slovencev v ekipi Borca Sandi Ogrinec. Gregor Bajde takrat
    ni igral za domačo zasedbo.
  - Čeprav Olimpija ne bo mogla računati na svojega najboljšega posameznika v tej
    sezoni Florucza, pa to ne spreminja želje po preboju v osmino finala, kjer zmagovalca
    tega dvoboja čaka ali dunajski Rapid ali Fiorentina. Ljubljanska zasedba je namreč
    tudi zadnji obračun na domačem prvenstvu, v katerem že deset tekem ne pozna poraza,
    suvereno dobila proti Nafti (3:0), Sanchez pa je obenem lahko spočil nosilce igre.
  - Navijači dajejo samozavest " Na eni tekmi se zgodi marsikaj, vsaka je drugačna.
    Pripravljamo se, da bomo prevladovali, to je naš slog. Pokazali smo, da lahko.
    Zdaj bomo poskušali enako. Pred našimi navijači bo drugačno ozračje, navijači
    pri tem igrajo pomembno vlogo, dajo samozavest na domačih tekmah in s tem pomagajo.
    Sicer pa popolnoma zaupam v naše igralce. Je pa nogomet igra napak, te odločajo
    o končnem izidu. Kdor naredi manj napak, zmaga," je na novinarski konferenci povedal
    Victor Sanchez.
  - 'Pričakovati je, da se bo Borac bolj osredotočil na branjenje, ampak španski strateg
    na ljubljanski klopi opozarja, da nihče ne more imeti stoodstotno žoge v svoji
    posesti in da ima vsaka ekipa priložnost napasti: " Smo pa videli, kako so domači
    proslavili svoj zadetek v Banjaluki, kot da so naredili nekaj posebnega z igralcem
    več. To kaže, da se zavedajo, da igrajo proti dobri ekipi."'
  - 'V Ljubljani je zaradi zmag Ob Floruczu bo sicer zaradi kazni manjkal tudi ljubljanski
    strateg, a pravi, da to ne bo igralo velike vloge: " Zaupamo v igralce, sodelavce
    in načrt. Imamo druge igralce, ki so že med sezono pokazali, da ga lahko nadomestijo.
    Vsi igralci radi igrajo take tekme, to pa velja tudi za trenerje, ki si želimo
    narediti pomembne stvari. Tu sem od prvega dneva, da zmagam. Motivacija za preboj
    v naslednji krog je velika. Čeprav ima tekmec enake cilje, upamo, da se bomo veselili
    dobrega izida."'
  - Olimpijo je že v gosteh spremljalo veliko pristašev zeleno-belih, po napovedih
    iz kluba in glede na dobro prodajo vstopnic pa se ji v Stožicah obeta spodbuda
    skoraj polnega stadiona, kar bi bila rekordna podpora za ljubljanski kolektiv
    na evropskih tekmovanjih. Že dva dni pred tekmo je bilo prodanih 12.000 vstopnic.
  - '"Za nas je zelo pomembno, da bo veliko navijačev. Potrebujemo to, da je mesto
    z nami," je povedal Alex Blanco. Španec meni, da bodo morali biti v primerjavi
    s prvo tekmo odločnejši v napadalnem delu igre.'
  - Obračun v Stožicah bodo sodili litovski sodniki na čelu z Manfredasom Lukjančukasom.
  - 'Riera: Tudi na Cipru bomo nastopili s svojo identiteto in slogom Med 16 najboljših
    ekip v Konferenčni ligi se bodo na Cipru na povratni tekmi z Apoelom v četrtek
    poskušali prebiti tudi Celjani. Na prvi tekmi sta ekipi remizirali (2:2).'
  - '"Izid bi lahko bil boljši, a kot sem rekel na koncu, se moramo posvetiti številnim
    izboljšavam. Seveda se moramo zelo dobro braniti, vendar smo samozavestni, dobre
    volje in nastopili bomo s svojo identiteto, svojim slogom. Vsi vemo, kaj to pomeni.
    Prevladati moramo na strani nasprotnikov in si ustvariti več priložnosti kot oni.
    Potem bomo videli, ali bo to dovolj za zmago," je pred tekmo za TV Slovenija dejal
    trener Celjanov Albert Riera.'
  - Zmagovalca v osmini finala čaka Djurgarden ali Lugano.
