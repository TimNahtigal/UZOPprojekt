  lead: Predstavniki gospodarske in obrtne zbornice so notranjega ministra Boštjana
    Poklukarja na sestanku opozorili na dolgotrajnost postopkov za pridobivanje enotnih
    dovoljenj za delo in prebivanje za voznike v mednarodnem prometu.
  mention: []
  paragraphs:
  - Poklukar je potrdil zavezo k zmanjšanju administrativnih ovir, so v sporočilu
    za javnost navedli na ministrstvu.
  - Predstavnika sekcij za promet in prevoz blaga obeh zbornic sta predvsem poudarila
    dolgotrajnost postopkov, na kar je Poklukar odgovoril, da je ministrstvo v preteklih
    letih upravnim enotam, ki odločajo v postopkih izdaje dovoljenj, dalo usmeritve
    za hitrejše vročanje dovoljenj in prednostno obravnavo prošenj za izdajo enotnega
    dovoljenja.
  - Ob tem je poudaril tudi pomen novele zakona o tujcih, ki je začela veljati 27.
    aprila, s katero se zlasti odpravljajo administrativne ovire in omogoča hitrejše
    vodenje postopkov izdaje in vročanja dovoljenj za prebivanje in potrdil o prijavi.
    Napovedal je tudi prenovo zakonodaje o tujcih in pripravo sodobne migracijske
    strategije.
  - Poklukar je še dejal, da se na ministrstvu zavedajo, da gre za pomembno panogo
    pri zaposlovanju tujcev in jih pozval k tvornemu oblikovanju rešitev, ki bi lahko
    še skrajšale postopke. S skupnim sodelovanjem želijo pomagati podjetnikom in obrtnikom
    pri zaposlovanju tujcev in odpravljanju težav z delovno silo ter biti konstruktiven
    partner pri zmanjševanju administrativnih ovir pri zaposlovanju tujcev, so navedli
    na ministrstvu.
  - Predstavniki zbornic so opozorili tudi na težave v prometu – zlasti na primorski
    avtocesti – zaradi prevozov tovornjakov v Luko Koper in iz nje. Ministru so predlagali
    sklic sestanka, na katerem bodo skupaj z drugimi deležniki poskušali najti rešitve
    za trenutne razmere, je ministrstvo še dodalo v sporočilu za javnost.
