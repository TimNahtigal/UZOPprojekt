  lead: Pred t. i. črnim petkom, ko trgovci s popusti vabijo potrošnike k nakupom,
    strokovnjaki Evropskega potrošniškega centra ponujajo svetovanje, kako se zaščititi
    pred nepotrebnimi nakupi. Na pasti popustov opozarjajo tudi inšpektorji in ZPS.
  mention:
  - Romana Javornik
  paragraphs:
  - Če potrošnika po nakupu daje občutek slabe vesti, lahko po zaslugi pravice do
    odstopa od pogodbe, ki jo zagotavlja EU, večino izdelkov, kupljenih prek spleta,
    vrnejo v 14 dneh. Za izdelke, kupljene v fizični trgovini, ta pravica ne velja.
    Vseeno pa nekateri trgovci omogočajo vračilo brezhibnih izdelkov, tudi kadar so
    ti kupljeni v njihovih fizičnih prostorih.
  - '"Ta pravica ščiti potrošnike pred prodajnimi taktikami, ki temeljijo na pritisku,
    in deluje kot svojevrsten popravni izpit za nepotrebne ali prenagljene nakupe.
    Potrošnikom omogoča, da svoj nakup premislijo še enkrat," je pojasnila vodja Evropskega
    potrošniškega centra (EPC) Slovenija Romana Javornik.'
  - Da bi izkoristili to možnost, pa morajo potrošniki razumeti drobni tisk. Ta pravica
    namreč ne zajema vseh izdelkov, in sicer ni mogoče vrniti posamezniku prilagojenih
    izdelkov, odprtih zdravstvenih in higienskih izdelkov, digitalnih vsebin ter vstopnic
    in časovno vezanih storitev, kot so potovanja ali hotelske nastanitve.
  - Pravica do odstopa od pogodbe, ne da bi moral potrošnik navesti razlog za svojo
    odločitev, velja za večino naročil prek spleta, po telefonu ali pošti. Potrošnik
    mora prodajalca o tem obvestiti v 14 dneh, lahko tudi samo po elektronski pošti,
    nato pa ima na voljo še 14 dni, da izdelke vrne v dobrem stanju. Pri tem bo morda
    moral kriti stroške pošiljanja vrnjenega blaga.
  - Če ima izdelek napako, pa ga lahko vrne tudi pozneje kot v 14 dneh, pri čemer
    pravice iz garancije veljajo po celi Evropski uniji tudi med črnim petkom, so
    zagotovili v EPC-ju Slovenija. Potrošnikom, ki so glede svojih pravic negotovi,
    v EPC-ju Slovenija ponujajo osebno svetovanje, in sicer jih je bilo mogoče v četrtek
    obiskati v nakupovalnem središču Aleja v Šiški v Ljubljani.
  - Da bodo potrošniki dan popustov izkoristili za nakup kakovostnega izdelka, ki
    ga v resnici potrebujejo, so vrsto nasvetov na svojih spletnih straneh objavili
    tudi v Zvezi potrošnikov Slovenije (ZPS). Med drugim jim svetujejo, naj si pred
    odhodom po nakupih v fizično ali spletno trgovino naredijo seznam želja, gledajo
    na ceno in ne na "popust" ter preberejo splošne pogoje, ob tem pa naj ne nasedajo
    lažnim promocijam in bodo pozorni na morebitne spletne prevare.
  - V britanski potrošniški organizaciji Which so leta 2021 ugotovili, da je 99,5
    odstotka "neverjetnih ponudb" enakih ali celo bolj ugodnih v drugih obdobjih leta.
    V raziskavi so preverili več tisoč cen in ugotovili, da z nakupom na črni petek
    skoraj zagotovo ne boste dosegli najnižje cene v zadnjem letu, so že zapisali
    v ZPS-ju.
  - Inšpektorji nameravajo v času popustov črnega petka izvajati poostrene nadzore.
    Kot so pred kratkim sporočili s Tržnega inšpektorata RS, za znižanja v času črnega
    petka veljajo iste zakonske določbe kot ob siceršnjih akcijah in popustih. Potrošnikom,
    ki kupujejo v času akcij oziroma popustov, tudi na inšpektoratu svetujejo, naj
    kupujejo premišljeno.
  - Temu, kitajska spletna tržnica, ki potrošnike navdušuje z izjemno nizkimi cenami
    in velikimi popusti, ni tako nedolžna, kot se zdi na prvi pogled. Na ZPS-ju namreč
    svarijo, da lahko nakupovanje na Temuju in podobnih spletnih tržnicah, kot je
    Shein, s stališča evropskega potrošnika prinaša tveganja in pomisleke glede zaščite
    potrošniških pravic, varnosti izdelkov in zakonitosti njenih poslovnih praks.
  - S čim nas Temu zapelje? S slogani, kot je 'nakupuj kot milijarder' in privlačnimi
    igrami za pridobitev popustov, s katerimi potrošnike na platformi zadržijo čim
    dlje časa, s čimer dosežejo čim večjo potrošnjo. Po besedah ZPS-ja pri tem uporabljajo
    t. i. temne vzorce, ki spadajo med nepoštene in zavajajoče poslovne prakse. Na
    primer odštevalnik časa, ki te sili v hiter nakup, saj bo sicer ugodna priložnost
    "izginila" ali pa lažno opozorilo "zadnji kos", ki se pojavi, če imamo določen
    izdelek predolgo v nakupovalni košarici.
  - Tudi prirejanje "naključnih" nagradnih iger, ko potrošnik zavrti kolo sreče in
    za nagrado prejme brezplačen vrednostni bon, pri ljudeh povzroči strah pred izgubo
    nagrade ali obžalovanje, da te ne bi izkoristili, kar jih spodbudi k novim in
    novim nakupom, so še pojasnili na ZPS-ju
  - Danska potrošniška organizacija Forbrugerrådet Tænk je avgusta 2024 objavila teste
    različnih izdelkov. Med njimi so bili izdelki za otroke (igrače in nosilke za
    dojenčke), elektronika (adapterji, nadzorne kamere) in kozmetika. Rezultati so
    skrb vzbujajoči – kar 79 odstotkov izdelkov ni ustrezalo pravilom EU-ja o varnosti
    proizvodov.
  - Temu ni neposreden trgovec, temveč omogoča tretjim osebam, da prodajajo izdelke
    na njegovi platformi. Hitra poizvedba na platformi pokaže, da kupujete pri podjetjih,
    ki so večinoma na Kitajskem, pri čemer pa je velikokrat težko vzpostaviti stik
    z njimi, če gre kaj narobe.
  - Ena izmed največjih skrbi je, kako Temu obdeluje osebne podatke uporabnikov. Njegova
    politika zasebnosti namreč navaja, da se podatki uporabnikov lahko obsežno delijo
    tako z matično kot tudi s partnerskimi družbami.
  - Za posamezen spletni nakup so Slovenci letos namenili povprečno 56 evrov mesečno,
    kar je 10 evrov manj kot lani. Tako kot lani so mesečno opravili dva do tri nakupe
    prek spleta, je pokazala raziskava o nakupnih navadah. Skoraj polovica anketiranih
    na spletu najpogosteje kupuje oblačila in obutev.
  - Kot ugotavlja Agencija za komunikacijska omrežja in storitve RS (Akos), se je
    povprečni skupni znesek spletnih nakupov glede na lansko leto znižal. Tako so
    pogosti nakupovalci za nakupe v spletnih trgovinah v treh mesecih pred raziskavo
    zapravili v povprečju 361 evrov, lani pa 387 evrov. Občasni uporabniki spletnih
    trgovin so v tem času letos v povprečju porabili 186 evrov, leto prej pa 252 evrov.
  - Skoraj polovica, 48 odstotkov anketiranih, na spletu najpogosteje kupuje oblačila
    in obutev, 26 odstotkov izdelke za šport in prosti čas, 22 odstotkov pa kozmetiko.
    Sledijo prehranska dopolnila, pohištvo ali izdelki za dom in vrt ter izdelki za
    avtomobile ali druga vozila. Prek telefona pogosteje nakupujejo ženske, in sicer
    v 70 odstotkih, medtem ko moški spletne nakupe pogosteje opravljajo prek računalnika,
    v 54 odstotkih.
  - V starostni skupini do 44 let se je v primerjavi z lani delež uporabnikov, ki
    opravijo večji del nakupov prek pametnega telefona, zvišal na 82 odstotkov, lani
    pa je bil 71,5-odstoten. Nad to starostjo so pogostejši nakupi prek računalnika;
    tukaj kupuje 52,5 odstotka uporabnikov, starejših od 44 let.
  - V starostnih skupinah se razlikujejo tudi plačilne navade, in sicer so uporabniki
    v starostni skupini do 44 let kot plačilno sredstvo za svoje nakupe najpogosteje
    izbrali nakup s kartico (57 odstotkov), starejši od 44 let pa plačilo po povzetju
    (49 odstotkov).
  - Po povzetju v večji meri plačujejo ženske. Tako vrsto plačila je navedlo 43,5
    odstotka anketirank, plačilo s kartico pa dobrih 38 odstotkov. Prek plačilnih
    platform plačuje 8,5 odstotka žensk in nekaj več moških uporabnikov spletnih trgovin,
    in sicer 16 odstotkov.
  - Kar se tiče dostave, so v raziskavo zajeti prebivalci najpogosteje izbrali dostavo
    na dom, takšnih je bilo 71 odstotkov uporabnikov. Za dostavo v paketomat se jih
    je odločilo 12 odstotkov, nekaj anketiranih pa si je dostavo naročilo v službo
    (štirje odstotki). Skoraj vsi (96 odstotkov) za dostavo spletnih nakupov nad zneskom
    50 evrov pričakujejo brezplačno dostavo.
  - Sodelujoči v anketi pogosteje nakupujejo v domačih spletnih trgovinah. Izkušnjo
    z nakupi pri spletnih trgovcih iz držav EU-ja ima 90 odstotkov vprašanih, izkušnjo
    z nakupi pri spletnih trgovcih zunaj držav EU-ja pa 72 odstotkov vprašanih.
  - Tudi v tokratni raziskavi so anketiranci večinoma ocenili, da je možnost izbire
    ponudnika dostave pri spletnih nakupih izdelkov pomembna. Tako je menilo 79 odstotkov
