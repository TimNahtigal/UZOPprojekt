  lead: "Kultni igralec Robert De Niro je prvič v karieri sprejel vlogo v televizijski\
    \ seriji. Zero Day bo politična srhljivka o teorijah zarote, v kateri bo Angela\
    \ Bassett igrala ameriško predsednico.  \r\n"
  mention:
  - Angela Bassett
  - Dan Stevens
