  paragraphs:
  - Prva Afričanka in teniška igralka arabskega rodu, ki se je uvrstila v finale turnirja
    za grand slam Ons Jabeur, je močno kritizirala odločitev organizatorjev Rolanda
    Garrosa, da znova dajo prednost moškim dvobojem v večernem terminu na osrednjem
    stadionu Philippa Chatrierja.
  - Vseh šest dni ob 20.15 igrajo moški Niti en dan Rolanda Garrosa niso bile ženske
    uvrščene v elitni termin, ki se začne ob 20.15 po krajevnem času. V nedeljo je
    Ben Shelton premagal Lorenza Sonega, v ponedeljek je Jannik Sinner izločil domačina
    Arthurja Rinderknecha, v torek je ljubljenec občinstva Gael Monfils po zaostanku
    z 0:2 v nizih premagal Huga Delliena. V sredo je Holger Rune premagal Emiliana
    Navo, danes bosta ob 20.15 igrala Monfils in peti nosilec Jack Draper, petkov
    večerni termin pa je rezerviran za Carlosa Alcaraza in Damirja Džumhurja.
  - Ženske vsak dan začenjajo spored ob 11.00 pred precej praznimi tribunami Odkar
    so leta 2022 uvedli nočne dvoboje, sta bila samo dva od 35 dvobojev v posamični
    konkurenci ženska. Po drugi strani se prvi dvoboji dneva na igrišču Philippa Chatrierja
    običajno igrajo pred pol praznimi tribunami. Vseh šest letošnjih uvodnih dvobojev
    v posamični konkurenci so odigrale ženske. Danes je ob 11.00 Jessica Pegula ugnala
    rojakinjo Ann Li, v petek ob 11.00 pa bosta igrali prva igralka sveta Arina Sabalenka
    in Srbkinja Olga Danilović.
  - Ons Jabeur ogorčena Nekdanja druga igralka sveta Jabeur je lani zagovarjala stališče,
    da si igralke in igralci zaslužijo " boljši razpored ", potem ko je več dvobojev
    trajalo dlje od polnoči. V torek je izrazila novo kritiko na račun prenosov turnirja
    v Parizu, ko je spregovorila po gladkem porazu v prvem krogu proti Poljakinji
    Magdaleni Frech. Kritizirala je odločitev, da so nočni termini obračunov rezervirani
    za moške.
  - '30-letnica, ki je lani in predlani na pariškem pesku izpadla v četrtfinalu, je
    bila vidno nezadovoljna zaradi očitnega favoriziranja moškega tenisa: " Žalostno
    je, da se to še vedno dogaja. V Evropi je to žalostno za ženski šport na splošno.
    Kdor koli sprejema odločitve, mislim, da te osebe nimajo hčera, ker mislim, da
    nihče ne bi tako ravnal s svojimi hčerkami."'
  - 'Moretton: Razmišljamo o tem, kaj bi lahko bilo bolje za gledalce Gilles Moretton,
    predsednik francoske teniške zveze, je ta teden povzročil polemiko, ko je dejal,
    da urnik narekuje, kaj bo " bolje za gledalce ".'
  - '" Urnik je ena ključnih točk na turnirju. Včasih moramo razmišljati o tem, kaj
    bi lahko bilo bolje za gledalce in zato sprejemamo takšne odločitve, da sledimo
    temu. "'
  - 'Jabeur, dvakratna finalistka Wimbledona, se je odzvala v šaljivem tonu: " To
    je nekoliko ironično. Ne prikazujejo ženskega športa, ne prikazujejo ženskega
    tenisa, nato pa postavijo trditev: ''Ja, ampak večinoma po TV gledajo moške.''
    Seveda, da navijači bolj gledajo moške, ker daješ prednost moškim v najbolj gledanih
    terminih. Vse to je povezan o."'
  - Tudi izjemen obračun Osake in Badose ni bil v elitnem terminu " Škoda za zvezo.
    Veliko odličnih igralk si zasluži, da bi bile tudi one na tem razporedu. Eden
    od takšnih dvobojev, ki bi si zaslužil najboljši termin, je zanesljivo obračun
    Naomi Osake in Paule Badose. Tako neverjeten dvoboj. Morali bi biti tam. Tako
    kot lani, Iga Swiatek in Naomi Osaka, bi si zaslužili, da sta tam. Veliko odličnih
    dvobojev je, ki bi si zaslužili, da so v ospredju, " je bila ogorčena Tunizijka.
  - '" Nisem prepričana, o kakšnih navijačih govori predsednik zveze. Vem, da sem
    teniška navijačica. Ogledala si bom ženske dvoboje."'
  title: Elitni termin ob 20.15 vedno rezerviran za moške obračune, ženske pa igrajo
