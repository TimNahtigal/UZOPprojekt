  lead: V okviru praznovanja 50-letnice Univerze v Mariboru je od 16. aprila na rektoratu
    na ogled razstava del akademskega kiparja in profesorja Dušana Zidarja z oddelka
    za likovno umetnost pedagoške fakultete.
  mention: []
  paragraphs:
  - Postavitev v Dvorani Borisa Podrecce je del serije vizualnega dnevnika Zaloga-
    Belvedere z umetnikove kulturne rezidence lani na Dunaju. " Osebna izkušnja premika
    v novo okolje je sprožila razmislek o migriranju ter o oskrbi in preskrbi v sodobni
    družbi. V nastalih podobah spoj preteklosti in sedanjosti prikazuje, ne kot zlitje
    enega z drugim, temveč kot razteg enega čez drugega – kot prikaz antropocentrične
    predoziranosti, ki se izraža skozi različne kombinacije perspektiv, pomenov in
    prostor-čas razsežnosti. Pri tem imajo posebno vlogo tudi neposredni komentarji
    oziroma ironični kontrapunkti, ki podobe dodatno izpostavljajo in artikulirajo
    kritično tematiko dnevnika," o razstavi sporočajo z univerze.
  - Dušan Zidar, rojen leta 1962 v Ljubljani, je končal študij kiparstva na Akademiji
    za likovno umetnost v Ljubljani, kjer je opravil tudi podiplomski študij. Pri
    svojem delu uporablja različne medije, vključno s kiparstvom, risbo, hrupom in
    multidisciplinarno umetnostjo. Imel je številne samostojne in skupinske razstave
    v Sloveniji in tujini.
  - Od leta 2000 je zaposlen kot profesor na oddelku za likovno umetnost na Pedagoški
    fakulteti Univerze v Mariboru.
  - Razstava je del umetniškega programa ob 50-letnici univerze, ki je s 17 fakultetami
    v osmih krajih, Univerzitetno knjižnico Maribor in Študentskimi domovi druga največja
    in druga najstarejša univerza v Sloveniji. Praznovanje jubileja poteka vse leto
    z različnimi dogodki. Prihodnji teden se bodo s še enim koncertom predstavili
    študenti oddelka za glasbo pedagoške fakultete.
  title: Ob 50-letnici Univerze v Mariboru razstava del Dušana Zidarja
