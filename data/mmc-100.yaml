  lead: 'Dosedanji predsednik stranke Konkretno Zdravko Počivalšek in podpredsednik
    Alojz Kovšca sta okoli leto dni po volitvah podala odstopni izjavi. Na izrednem
    kongresu je bil za novega predsednika izbran član sveta stranke Janez Demšar. '
