    img: https://img.rtvcdn.si/_up/upload/2022/01/04/65953669.jpg
    source: ''
  lead: 'Kljub nižji ceni povprečne košarice osnovnih živil potrošniki opozarjajo,
    da vse več družinskega proračuna namenijo za nakup osnovnih življenjskih potrebščin.
    Vse pogosteje opažajo tudi, da so izdelki na policah ob istih cenah količinsko
    manjši. '
  mention:
  - ' Zala Jakša'
  - ' Alina Meško'
  paragraphs:
  - Cene hrane in brezalkoholnih pijač so se na mesečni ravni zvišale za 2,1 odstotka,
    na letni pa kar za več kot 19 odstotkov. Najbolj, za 54 odstotkov, se je od lanskega
    januarja podražil sladkor, sledi mu jedilno olje – zanj je treba odšteti 47 odstotkov
    več. Podražili so se tudi številni drugi izdelki. "Sveže posneto mleko za 38 odstotkov,
    maslo za 37 odstotkov, kruh se je v enem letu podražil za 17 odstotkov, meso za
    20 odstotkov. Pri hrani in brezalkoholnih pijačah ni nobene stvari, ki bi jo lahko
    izpostavila, da se je pocenila," poudarja Zala Jakša s Statističnega urada.
  - Da so živila iz dneva v dan dražja, nakupovalna vrečka pa vse bolj prazna, ugotavljajo
    tudi kupci. "Vedno kupujem iste stvari, pa se mi zdi, da je vedno znova kakšna
    stvar za 50 centov ali evro dražja," je ena od nakupovalk dejala za Radio Slovenija.
    "Vedno se čudim – nekaj malega kupim, pa nikoli ne stane pod 30 evrov. Res, vse
    je dražje," pa je stanje komentirala druga.
  - Potrošniki pa ob tem opozarjajo še na to, da trgovci v nekaterih primerih spreminjajo
    količino oziroma težo izdelkov, ceno pa pri tem ohranijo nespremenjeno. "Če so
    opazili, da je proizvajalec zmanjšal količino in izdelek na videz zgleda enak
    in je cena ostala enaka, nam to lahko pošlje preko spletnega obrazca na naši spletni
    strani," kupcem svetuje Alina Meško iz Zveze potrošnikov Slovenije. Gre namreč
    za nesprejemljivo prakso oziroma zavajanje. Tudi zato, ker so se po podatkih Statističnega
    urada cene hrane v Sloveniji zvišale bolj kot povprečno v državah evroobmočja.
