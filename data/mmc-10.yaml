  lead: 'Na evropskem prvenstvu v plavanju smo videli dva slovenska polfinalna nastopa
    - oba v isti skupini polfinala discipline 200 m prosto. Janja Šegel je zasedla
    tretje mesto in se po času uvrstila v veliki finale, Katja Fain je bila prepočasna. '
  mention:
  - Štafeta sedma
  paragraphs:
  - Šegel, ki bo v Beogradu v finalu nastopila že tretjič, je na bazenu 25. maj dobro
    formo na 200 m prosto potrdila že v predtekmovanju in v štafeti, kjer je v treh
    poskusih dosegla izid okrog 1:57,8, najhitreje 1:57,74.
  - V polfinalu je bila z 1:57,65 najhitrejša Madžarka Minna Abraham pred prvo favoritinjo
    Čehinjo Barboro Seemanovo, ki je slavila v drugi skupini. Kanček hitrejši od plavalke
    Fužinarja sta bili v polfinalu še Islandka Saefridur Sol Jorunnardottir in Nemka
    Nicole Meiere.
  - '"V polfinalu sem plavala na polno. Želela sem izid 1:57, a po treh zelo hitrih
    tekmah tudi teh 1:58 nizkih nič ne pove za jutri. Verjamem, da se bom borila za
    kolajno. Zdaj se moram le spočiti. V vodi je trenutno močnejša Čehinja, sama pa
    bom skušala odplavati sproščeno in si ne ustvarjam pritiska," je dejala 23-letna
    Ravenčanka, ki je izjemno hitro nato plavala v štafeti.'
  - Vesela je bila tudi glasnega navijanja. "Presenečena sem bila, ko sem videla vse
    te zelene majice in zastave na startu. Lepo je, da so prišli. Super sem bila presenečena
    in res hvala vsem."
  - Delno zadovoljna je bila tudi Mariborčanka Katja Fain z izidom 2:00,45 in 13.
    mestom. "Za mano sta dve zelo težki sezoni. Lanska se ni izšla po pričakovanjih.
    Letos sem lepo stopnjevala dosežke, gradila samozavest. Borila sem se do konca,
    rezultat pa je kakršen je. Vesela sem, da bom šla na olimpijske igre s štafeto
    in pomagala puncam tam. Tudi danes je bil nastop zelo dober, sama sem dosegla
    svoj najboljši izid na 100 m prosto. Več od finala si nismo mogli želeti."
  - Štafeta sedma Štafeta na 4 x 100 m prosto je osvojila sedmo mesto. Janja Šegel,
    Katja Fain, Hana Sekuti in Tjaša Pintar so v finalu na EP-ju nastopile že drugič.
    Tudi vzkliki številnih slovenskih navijačev na sotočju Donave in Save pa so pomagali,
    da je četverica v finalu dvignila ritem, vse po vrsti so izboljšale jutranje čase,
    in ubranila položaj pred "odpisanimi" Srbkinjami, ki so na domačem bazenu močno
    dvignile tempo.
  - Nikakor pa ne gre prezreti slovenskega rekorda ob zlatu na sredozemskih igrah
    2022, kjer je v štafeti namesto koroške mladinke Sekuti sodelovala prva sprinterka
    v državi Neža Klančar. Z enakim dosežkom 3:38,52 bi danes osvojile bron, le štiri
    stotinke so bile hitrejše srebrne Danke, zmagale so Madžarke.
  - '"Z rekordom se nismo obremenjevale. Zbrale smo se za naš nastop, saj lahko damo
    od sebe le to, kar v resnici zmoremo. Je pa rekord iz Orana seveda super, a sama
    mislim, da ne bo prav dolgo ostal in bo še boljši," je morebitno preračunavanje
    zavrnila najizkušenejša v ekipi Tjaša Pintar. O štafeti pa dodala: "Zelo sem vesela,
    da sem del te ekipe. Zelo rada plavam za Slovenijo. To je zame velika čast in
    to skušam izkoristiti. Mi moramo biti veseli vsakega popoldanskega nastopa in
    ponosni na vsak finale."'
  - 'Novinka v ekipi je 17-letna mladinka Sekuti: "Nisem pričakovala, da bom letos
    plavala v finalu na svetovnem in tudi na evropskem prvenstvu. Seveda sem vesela,
    da nam je tukaj to uspelo že dvakrat. Zame pa je to pomembna izkušnja. To je članska
    tekma, več je gledalcev, več je adrenalina. A le tako lahko stopim korak višje."'
  title: Janja Šegel verjame, da se bo na 200 m prosto borila za kolajno
