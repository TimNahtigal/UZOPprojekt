  lead: Nogometaši Olimpije bodo v četrtek ob 18.45 v Stožicah igrali povratno tekmo
    1/16 finala Konferenčne lige. Izbranci Victorja Sancheza so kljub zaostanku 0:1
    optimisti, ob napovedani izvrstni podpori s tribun poudarjajo, da imajo zgodovinsko
    priložnost.
  mention:
  - Raula Florucza
  - Sandi Ogrinec
  - Victor Sanchez
