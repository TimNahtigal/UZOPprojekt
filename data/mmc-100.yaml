- _id: 672033ca58188dfedc672ba8
  url: https://www.rtvslo.si/sport/hokej/liga-icehl/najraje-bi-igral-za-jesenice-v-ligi-icehl-a-to-zal-ni-vec-mogoce/725685
  topics: sport
  authors:
  - Aleš Golob
  date: '2024-10-28T16:05:08'
  figures:
  - caption: Rok Tičar si želi, da bi risi prvič po letu 2005 obstali v elitni diviziji.
      Od 9. do 25. maja jih čaka težko delo v Stockholmu.
    img: https://img.rtvcdn.si/_up/upload/2024/10/27/66263318.jpg
    source: www.alesfevzer.com
  - caption: Aprila 2021 se je Tičar veselil naslova v Ligi IceHL. KAC je premagal
      Bolzano s 4:1 v zmagah.
    img: https://img.rtvcdn.si/_up/upload/2022/09/26/66020854.jpg
    source: www.alesfevzer.com
  id: '725685'
  keywords:
  - Rok Tičar
  - Gradec
  - Liga IceHL
  lead: Rok Tičar je bil po nedeljski zmagi Gradca v Tivoliju s 4:2 nasmejan. Z izdatno
    finančno injekcijo so cilji najvišji v zadnjem desetletju. Ni še rekel zadnje
    besede tudi v reprezentanci. Še nikoli ni obstal v elitni diviziji in maja je
    nova priložnost.
  mention:
  - Aleš Golob
  paragraphs:
  - 35-letni Jeseničan se je dokazal v Podmežakli. Z železarji je osvojil naslova
    državnih prvakov v letih 2010 in 2011, ko je v Ligi Ebel zbral kar 68 točk (24
    golov in 44 podaj). Hitro se je podal v tujino, kjer igra že 13 let.
  - V močni Ligi DEL je igral za Krefeld in Köln, pa nato za Slovan iz Bratislave.
    Preizkusil se je tudi v drugi najmočnejši ligi na svetu. V Ligi KHL je najprej
    igral za Jekaterinburg, pa nato za Torpedo iz Nižnega Novgoroda, Novosibirsk in
    za kitajski Kunlun Red Star.
  - Od leta 2020 naprej je znova v Ligi IceHL, kjer je postal prvak s Celovčani pred
    tremi leti. Lani na Dunaju ni šlo po načrtih, zato pa so cilji z močno ekipo Gradca
    zelo visoki v tej sezoni.
  - V lanski sezoni je Gradec popolnoma odpovedal. Zasedel je zadnje mesto v Ligi
    IceHL. Predsednik Jochen Pildner - Steinburg je napovedal slovo po 25 letih. Marca
    je njegovo mesto prevzel ambiciozni Herbert Jerich in se takoj zavzel za popolno
    prevetritev. Menedžer Bernd Vollman je moral na novo sestaviti ekipo, prišlo je
    17 novih igralcev.
  - Kako bi ocenili drugo gostovanje v Tivoliju v dveh tednih? Precej bolje ste se
    pripravili na zmaje. V petek smo razočarali navijače, ko smo izgubili proti Asiagu
    z 1:4. Tokrat smo dobili večino dvobojev, vseskozi smo imeli igralca pred vratarjem
    Kolinom. Prva dva zadetka smo dosegli na isti način, s spremembo smeri ploščka
    pred vrati. Ustavili smo njihove protinapade, nismo izgubljali ploščkov na modri
    črti. Tudi kazni ni bilo veliko.
  - Gradec igra tehnično dovršen hokej, ne stavite na agresivno igro. Na začetku sezone
    se je zelo dobro izšlo. Na začetku sezone smo dobili pet tekem zapored, čeprav
    nismo na vsaki tekmi igrali odlično. V zadnjih tednih smo doživeli tudi nekaj
    porazov. Morda je celo zelo dobrodošlo, da smo izgubili proti Asiagu na domačem
    ledu, saj smo vsi videli, da se ne bodo vpisovale zmage le na talent in na lepo
    igro.
  - Po zelo slabi lanski sezoni je poleti prišlo 17 novih igralcev. Ste presenečeni,
    da se je vse sestavilo že tako hitro? Mislim, da smo se zaradi tega dobili že
    na začetku avgusta. Hitro sem opazil, da so se stvari spremenile s prihodom predsednika
    Jericha, saj je prinesel veliko kapitala. Lepo je biti v ekipi, ki si želi zavzeti
    vrh lestvice.
  - Kakšni so cilji v letošnji sezoni? Redni del želimo končati med prvo šesterico.
    Cilj je torej neposreden preboj v končnico. Odigrali smo šele četrtino rednega
    dela in do pravih tekem v končnici bo minilo še veliko časa. Zmaga v Tivoliju
    je pravi kazalnik, v to smer želimo iti v nadaljevanju sezone.
  - V zadnjih štirih letih ste vseskozi v Ligi IceHL. V Celovcu ste osvojili naslov
    prvaka leta 2021, lani ste igrali na Dunaju, letos pa v Gradcu. Kako bi primerjali
    vse tri klube. Kakšna je razlika v organizaciji? Vse je povezano z denarjem. V
    Celovcu sem se vrhunsko počutil. Na te tri sezone imam res lepe spomine. Dolgoletna
    mecenka kluba Heidi Horten je na žalost umrla. Če je klub potreboval novega igralca,
    je menedžer odšel do gospe Horten, dobil denar in pripeljal vrhunskega igralca.
    Zdaj se to spreminja. Celovec bo imel kmalu težave, saj so bili vseskozi odvisni
    le od nje.
  - Pred začetkom lanske sezone so mi zelo pozno sporočili, da ne bodo podaljšali
    pogodbe, čeprav sem bil med nosilci igre. Na Dunaju vložek ni tako velik. Gradi
    se na tujih hokejistih. Za končnico Lige IceHL moraš imeti štiri dobre napade,
    zato je bila lanska sezona zelo težka. 60 minut je bilo težko igrati na visoki
    ravni.
  - Prvič v zgodovini Gradca je prišel predsednik z denarjem. Zaveda se, da se pokala
    za naslov prvaka ne da kupiti. To je dober začetek. Igralci imamo pogoje za delo
    vrhunske, lahko napredujemo in lahko smo zadovoljni s prvo četrtino rednega dela.
  - Tudi v Ljubljani se je marsikaj spremenilo. Prišel je novi strateški partner Alexandre
    Lefebvre. Cilji so se zelo dvignili. Hitro sem opazil nov veter v Ljubljani. Dobro
    se dela in Olimpija igra zelo dobro. Navijači so znova v velikem številu na tribunah.
    To je odlično tudi za reprezentanco.
  - Vaš nekdanji soigralec in dolgoletni prijatelj Robert Sabolič je podpisal pogodbo
    z Olimpijo. Ste bili presenečeni nad njegovo odločitvijo? Nekajkrat ste že omenili,
    da si ne predstavljate, da bi oblekli zeleni dres. Ko smo bili otroci, smo gledali
    Tomaža Razingarja, brata Rodman in ruske ase. Ko sem igral hokej pred blokom,
    nisem sanjal o Ligi NHL, ampak sem želel zaigrati za Jesenice. Seveda bi najraje
    igral za Jesenice v Ligi IceHL. Žal to ni več mogoče, srce pa imam še vedno na
    Jesenicah. Pomembno je, da igram blizu doma, saj imam družino.
  - Leta 2011 ste skupaj s Saboličem in Žigo Jegličem blesteli na Jesenicah. To je
    bila zadnja dobra sezona železarjev v Ligi Ebel, ni veliko zmanjkalo do končnice.
    Osvojili ste tudi naslov državnega prvaka. Kako gledate na trenutni položaj na
    Jesenicah, ki bodo težko kmalu našle pot nazaj v Ligo IceHL? Vse se začne in konča
    z denarjem. Niso dobro poslovali, veliko napak je bilo narejenih. To se je moralo
    poznati. Trpeli bodo še dolga leta. Upam, da se bo kakšen bogati gospod našel
    tudi na Jesenicah. Verjamem, da se vodstvo kluba trudi, vendar Alpska liga ne
    nudi dovolj visoke ravni. Tudi za mlajše hokejiste to ni dovolj kakovostna liga.
    Potrebujejo vzornike.
  - Dopolnili ste 35 let. Imate še željo igrati za reprezentanco na velikih tekmovanjih?
    Maja bo na sporedu svetovno prvenstvo elitne divizije. Imam še nekaj neizpolnjenih
    želja v izbrani vrsti. Želim si, da bo Slovenija obstala v elitni diviziji, kar
    nam ni uspelo že 19 let. To zelo boli, saj smo bili večkrat blizu. Upam, da bo
    dolga sezona v Gradcu, saj je potem kratko obdobje do reprezentančnih tekem. Še
    vedno je nekaj posebnega igrati za domovino.
  - Tudi na olimpijskih kvalifikacijah v Rigi niste igrali slabo, a ključni tekmi
    ste izgubili. Podobne stvari se dogajajo na tekmah elitne divizije. Kaj zmanjka
    v ključnih trenutkih? Odločajo malenkosti na najvišji ravni. Vse reprezentance
    imajo štiri močne napade. Ko smo pod pritiskom, naredimo napako, kar vrhunske
    reprezentance takoj kaznujejo.
  title: Najraje bi igral za Jesenice v Ligi IceHL, a to žal ni več mogoče
  n_comments: 16
