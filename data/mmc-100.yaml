  paragraphs:
  - V seriji, ki jo producira Netflix, bosta poleg dvakratnega oskarjevega nagrajenca
    nastopila torej še Angela Bassett in Dan Stevens. Snemanje serije v šestih epizodah
    se je začelo v New Yorku. Igralsko zasedbo zaokrožijo še Matthew Modine, Lizzy
    Caplan, Jesse Plemons, Joan Allen in Connie Britton.
  - De Niro bo upodobil priljubljenega, a zapletenega nekdanjega predsednika ZDA,
    ki po upokojitvi zdaj vodi komisijo, zadolženo za preiskavo kibernetskega napada.
    Bassett so angažirali za vlogo aktualne predsednice ZDA, Stevens pa bo igral televizijskega
    voditelja.
  - 'Sinopsis serije ne razkriva veliko: " Zero Day si zastavlja vprašanje, ki ga
    premlevamo vsi: kako najti resnico v svetu v primežu krize, ki ga parajo sile
    onkraj našega nadzora? So te sile posledice naših lastnih dejanj, morda celo naše
    domišljije, še posebej v času, ko ne manjka teorij zarot in pretvez?"'
  - Dobitnik oskarjev za vlogi v filmih Pobesneli bik in Boter 2 se je doslej pojavil
    le v peščici televizijskih produkcij, med drugim v televizijskem filmu iz leta
    2017 Čarovnik za laži, v katerem je odigral vlogo milijarderja in goljufa Bernieja
    Madoffa. Njegov nastop v Zero Day bo njegova prva vloga v čisto pravi seriji.
    Osemdesetletni igralec bo sodeloval tudi kot izvršni producent.
  - Scenarij so spisali Eric Newman, Noah Oppenheim ter novinar New York Timesa in
    dobitnik Pulitzerjeve nagrade Michael S. Schmidt.
