- _id: 646b0b4be7b5bc23d6763b78
  url: https://www.rtvslo.si/gospodarstvo/na-vladi-potrdili-zakon-ki-poenostavlja-digitalno-delovanje-gospodarskih-druzb/662319
  topics: gospodarstvo
  authors:
  - G. K.
  date: '2023-03-23T14:13:00'
  figures:
  - img: https://img.rtvcdn.si/_up/upload/2021/06/14/65899985.jpg
    source: 'Foto: Pixabay'
  - caption: Minister za gospodarstvo Matjaž Han.
    img: https://img.rtvcdn.si/_up/upload/2023/03/14/66066556.jpg
    source: BoBo
    caption.en: Minister for Economy Matjaž Han.
  lead: Vlada je sprejela predlog novele zakona o gospodarskih družbah, ki prinaša
    enostavnejše ustanavljanje podjetij prek spletnih registrskih postopkov, bolj
    učinkovite čezmejne operacije ter korporativno upravljanje. Potrdili so tudi novi
    zakon o patentih.
  mention:
  - Matjaž Han
  paragraphs:
  - Cilj predloga je zagotoviti več digitalnih rešitev za podjetja, vanj pa se v slovenski
    pravni red prenašata evropski direktivi glede uporabe digitalnih orodij in postopkov
    na področju prava družb in glede čezmejnih preoblikovanj, združitev in delitev,
    je povzel minister za gospodarstvo, turizem in šport Matjaž Han.
  - Predlog bo ob postopkih v fizični obliki omogočil spletno ustanavljanje podjetij
    in vnašanje sprememb podatkov v sodni register na elektronski način z uporabo
    spletnih digitalnih orodij. V ta namen bodo do začetka leta 2025 nadgradili orodja
    sistema SPOT in vzpostavili videokomunikacijski sistem za neposredno varno videopovezavo
    strank z notarji.
  - Na portalu SPOT bo zagotovljen dostop do brezplačnih informacij o podjetjih, zlasti
    glede postopkov spletnega ustanavljanja, identifikacije oseb, pristojbin in pravil
    v zvezi z imenovanjem v upravni, poslovodni ali nadzorni organ družbe. S tem bodo
    zagotovili večjo preglednost in zaščito interesov deležnikov, so zapisali na ministrstvu.
  - Predlog dopolnjuje postopke v zvezi s čezmejnimi združitvami in na novo ureja
    postopke glede čezmejnih delitev in preoblikovanj podjetij. Poleg njih prinaša
    ukrepe za zaščito družbenikov, delničarjev, upnikov in delavcev v družbah, ki
    sodelujejo v čezmejnih operacijah. V skladu s predlogom bodo družbeniki in delničarji,
    ki nasprotujejo čezmejni operaciji, lahko zahtevali prevzem svojih deležev v zameno
    za primerno denarno odpravnino. Če bodo presodili, da ta ni primerna, bodo lahko
    zahtevali dodatno denarno odpravnino. Enako velja za družbenike in delničarje.
  - Upniki, ki ne bodo zadovoljni z zaščito, ki jo ponuja družba v načrtu čezmejne
    operacije, bodo lahko na sodišču zahtevali zavarovanje svojih terjatev. Delavcem
    se bo zagotavljala pravica do obveščenosti in delno tudi pravica do posvetovanja.
    Pravice delavcev bodo v primeru čezmejnih operacij urejene še v posebnem zakonu,
    ki bo urejal pravice delavcev do soodločanja.
  - S predlogom se uvaja pravila za izvedbo elektronskih in virtualnih skupščin podjetij.
    Ta bodo izboljšala korporativno upravljanje družb, spodbudila delničarje k večji
    udeležbi na skupščinah in zmanjšala stroške poslovanja. Možnost sklica takšne
    skupščine moral predvidevati statut podjetja. Tudi skupščine družb z omejeno odgovornostjo
    bodo lahko sklicane elektronsko, izvajale pa se bodo lahko tako po telefonu kot
    tudi prek videoklicev.
  - Predlog uvaja ukrep, ki bo varoval manjšinske delničarje in družbenike v postopkih
    sodnega preizkusa menjalnega razmerja ter denarne odpravnine v primerih iztisnitev
    manjšinskih delničarjev iz družb ali statusnega preoblikovanja.
  - Manjšinski delničarji imajo možnost sodne revizije. Sprožijo lahko postopek sodnega
    preizkusa primernosti menjalnega razmerja ali denarne odpravnine in v teh primerih
    mora glavni delničar ali družba založiti predujem za stroške postopka. Ker je
    v praksi glavni delničar ali družba lahko zavlačeval ali celo zaustavil postopek
    sodnega preizkusa, vlada predlaga pravno podlago, ki bo sodišču omogočila izterjavo
    predujma po uradni dolžnosti. Morebitna pritožba glavnega delničarja ali družbe
    izvršbe ne bo mogla zadržati.
  - Novi zakon o gospodarskih družbah bo omogočil tudi, da lahko pristojni organi
    v primeru, ko ima oseba izrečeno prepoved opravljanja funkcije direktorja v drugi
    državi članici, zavrnejo imenovanje te osebe za opravljanje funkcije direktorja
    v Sloveniji. Ta določba je vključena z namenom, da se zaščiti vse osebe, ki sodelujejo
    s podjetji ter se prepreči goljufivo ravnanje ali druge zlorabe. Izmenjava informacij
    med pristojnimi organi o veljavnih prepovedih opravljanja funkcije direktorja
    bo potekala prek sistema povezovanja poslovnih registrov BRIS.
  - Vlada je sprejela tudi predlog novele zakona o industrijski lastnini, s katero
    želi poenostaviti in poceniti obstoječe postopke, denimo prijave patentov. Namen
    je tudi ureditev upravnih postopkov v zvezi z razveljavitvijo znamke ter slovensko
    ureditev še dodatno uskladiti z evropsko in mednarodno.
  - Zakon o industrijski lastnini ureja vrste pravic industrijske lastnine, kot so
    patent, dodatni varstveni certifikat, model, znamka in geografska označba, kot
    tudi postopke za podelitev in registracijo teh pravic ter njihovo sodno varstvo.
  - Po predlogu novele bo lahko Urad za intelektualno lastnino sklenil pogodbe z drugimi
    uradi in organizacijami za zagotovitev novih informacijskih storitev. S sklenitvijo
    pogodbe z Evropsko patentno organizacijo bi denimo omogočil prijaviteljem nacionalnih
    patentnih prijav, da že v nekaj mesecih po vložitvi prijave pridobijo kakovostno
    informacijo o tem, ali njihov izum izpolnjuje vse pogoje za podelitev patenta,
    so pojasnili na ministrstvu za gospodarstvo, turizem in šport.
  - Pogodba z Evropsko patentno organizacijo bi nekaterim prijaviteljem zagotovila
    tudi precejšnje finančne olajšave. Evropski urad namreč za poizvedbo o stanju
    tehnike s pisnim mnenjem, kadar je ta vložena preko urada, s katerim ima sklenjen
    sporazum, prizna 80 odstotkov popusta na ceno storitve. "To pomeni, da bodo prijavitelji
    namesto 2336 evrov plačali le 467 evrov - takšna ureditev velja za do 400 nacionalnih
    patentnih prijav letno," je v sporočilu po seji vlade zapisal gospodarski minister
    Han.
  - Zaradi prenosa določb evropske direktive sta predvidena dva nova upravna postopka
    za razveljavitev in ugotovitev ničnosti znamke. Zdaj tečejo ti postopki pred Okrožnim
    sodiščem v Ljubljani, po novem pa bodo potekali tudi pred Uradom za intelektualno
    lastnino.
  - Kompleksnejše primere, povezane s kršitvijo pravic iz znamke, bo še naprej reševalo
    sodišče. "Stranke bodo tako lahko hitreje in z nižjimi stroški dosegle razveljavitev
    znamke ali ugotovitev ničnosti znamke. Razveljavitev znamke je možna, kadar se
    na primer v zadnjih petih letih ni uporabila v gospodarskem prometu, ali če je
    postala generičen izraz za določeno blago ali storitve, kot na primer superga
    in kalodont. Za nično pa se znamka ugotovi, če sploh ne bi smela biti registrirana,"
    je pojasnil Han.
  - S potrditvijo predlaganih sprememb se bo zakon uskladil tudi s sporazumom o Enotnem
    sodišču za patente. Ta določa, da bo Enotno sodišče za patente reševalo spore
    v zvezi z evropskim patentom z enotnim učinkom in klasičnim evropskim patentom,
    pri čemer bo imela sodba učinek v vseh sodelujočih državah. To bo hitreje in predvidoma
    ceneje, kot če bi vlagali tožbe v vsaki državi posebej, pričakujejo na gospodarskem
    ministrstvu. Enotno sodišče za patente bo začelo delovati 1. junija 2023.
  - Medtem bo slovensko sodišče (Okrožno sodišče v Ljubljani) še naprej pristojno
    za spore glede nacionalnih patentov in v prehodnem obdobju tudi za klasične evropske
    patente, če se bodo njihovi imetniki odločili za izključitev pristojnosti Enotnega
    sodišča za patente.
  - Predlog novele zakona še določa, da bo Urad za intelektualno lastnino po uradni
    dolžnosti razglasil za ničnega evropski patent, vpisan v nacionalni register,
    kadar je ta razveljavljen pri Evropskem patentnem uradu. S tem se zagotavlja večjo
    pravno varnost.
  - Novela zakona bo tudi omogočila, da imetnik evropskega patenta, pri katerem Evropski
    patentni urad iz formalnih razlogov ni registriral enotnega učinka, kljub temu
    pri Uradu za intelektualno lastnino vpiše evropski patent v register patentov,
    ki bo učinkoval kot nacionalni patent.
  - Prav tako bo omogočila dodatne načine, s katerimi bi imetnik nacionalnega patenta
    lažje ohranil veljavnost patenta po desetem letu trajanja. Med predlaganimi spremembami
    na ministrstvu izpostavljajo še skrajšanje objektivnega roka za vložitev zahteve
    za nadaljevanje postopka po zamudi in uvedbo enotne tarife zastopnikov.
