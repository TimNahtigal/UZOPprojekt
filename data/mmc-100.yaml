  lead: Mednarodna organizacija za človekove pravice Human Rights Watch (HRW) je obtožila
    sudanske paravojaške sile (RSF) in zavezniške milice, ki se že več kot leto in
    pol bojujejo proti sudanski vojski, da na jugu države množično izvajajo spolno
    nasilje.
  mention: []
  paragraphs:
  - HRW v danes objavljenem poročilu navaja primere posilstev, tudi spolnega suženjstva.
  - Nevladna organizacija s sedežem v New Yorku v najnovejšem poročilu navaja, da
    je od septembra lani dokumentirala na desetine primerov žensk in deklet, starih
    od sedem do 50 let, ki so bile žrtve spolnega nasilja, vključno s skupinskimi
    posilstvi in spolnim suženjstvom v sudanski zvezni državi Južni Kordofan.
  - Južni Kordofan je v veliki meri pod nadzorom oborožene uporniške skupine Sudansko
    ljudsko osvobodilno gibanje-sever (SPLM-N), ki nadzoruje tudi sudanske Nubske
    gore in dele zvezne države Modri Nil.
  - Paravojaške Sile za hitro posredovanje (RSF), ki se od aprila lani borijo proti
    sudanskim oboroženim silam pod vodstvom generala Abdela Fataha Al Burhana, so
    se tudi spopadle s skupino SPLM-N za nadzor območja.
  - Kot v poročilu še navaja HRW, je bilo veliko žrtev skupinsko posiljenih na svojih
    domovih ali domovih sosedov, pogosto vpričo družinskih članov, nekatere pa so
    borci RSF-ja ugrabili in zasužnjili, poroča francoska tiskovna agencija AFP.
  - Vodja ZN-a za humanitarne zadeve Tom Fletcher je konec novembra opozoril na "epidemijo
    spolnega nasilja" nad ženskami v Sudanu.
  - Neodvisna mednarodna misija Združenih narodov za ugotavljanje dejstev v Sudanu
    je pred tem oktobra sporočila, da sta obe vojskujoči se strani zagrešili zlorabe,
    vključno z mučenjem in spolnim nasiljem. Ob tem je za izvajanje spolnega nasilja
    v velikem obsegu posebej obtožila paravojaške sile RSF.
  - Državljanska vojna v Sudanu, ki je izbruhnila aprila lani, je doslej zahtevala
    najmanj 20.000 življenj, skoraj osem milijonov ljudi pa je bilo prisiljenih zapustiti
    svoje domove. Od tega jih je čez meje Sudana zbežalo več kot dva milijona. Humanitarno
    pomoč zdaj potrebuje že več kot 25 milijonov ljudi.
  title: HRW paravojaške sile v Sudanu obtožuje spolnega nasilja
