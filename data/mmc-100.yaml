  paragraphs:
  - Trojica festivalskih koncertov se bo v dvorani Marjana Kozine v Slovenski filharmoniji
    zvrstila ob januarskih petkih ob 19.30.
  - Ob instrumentalnem ciklu Antonia Vivaldija (1678–1741), v katerem bosta z orkestrom
    nastopili solistki – violinistka Patricija Avšič in violončelistka Klara Avšič
    –, bodo iz njegovega opusa odigrali še Koncert za dva violončela v g-molu, na
    sporedu je tudi Koncert za dve oboi v F-duru Tomasa Albinonija (1671–1751). Pod
    umetniškim vodstvom Ane Dolžan bodo kot solisti nastopili še violončelistki Petra
    Greblo in Alja Mandič Faganel ter oboista Sorin Crudu in Pietro Savonitto.
  - Drugi koncert v znamenju Händla 19. januarja bo koncert v celoti posvečen mojstru
    baročne opere Georgu Friedrichu Händlu (1685–1759). Filharmoničnemu orkestru bo
    dirigiral Federico Maria Sardelli. Kot solistka se bo pridružila Sophie Gallagher,
    ki bo odpela nekaj najlepših arij iz Händlove opere Alcina. Sopranistka je iz
    petja diplomirala na Kraljevem glasbenem kolidžu v Londonu in magistrirala na
    Visoki šoli za glasbo v Ženevi. Redno sodeluje z ženevskim orkestrom Gli Angeli,
    od leta 2020 pa deluje v sklopu umetniške rezidence Brera Musica Umetnostne galerije
    Brera v Milanu.
  - Za sklep festivala znova Vivaldi 26. januarja bo znova odzvanjala glasba Antonia
    Vivaldija. Izvedli bodo dela, ki jih je zložil za beneško vzgojno-izobraževalno
    ustanovo revnih in osirotelih otrok Ospedale della Pieta, od koder so izšli številni
    vrhunski glasbeniki. Njihovi koncerti so bili v Vivaldijevem času pomemben del
    glasbenega življenja v Benetkah.
  - V ospredju bosta religiozni vokalno-instrumentalni skladbi Lauda Jerusalem (Hvali,
    Jeruzalem) in Beatus vir (Blagor človeku), v katerih bodo kot solisti nastopili
    pevci in pevke Zbora Slovenske filharmonije. V dvojici koncertov za violino, orgle
    in godala bosta kot solistki nastopili članici filharmoničnega orkestra Irina
    Kevorkova in Marika Przybyl, orgelske dele bo izvedel Tomaž Sevšek. Tudi zadnji
    festivalski koncert se bo odvil pod vodstvom Sardellija, ki velja za velikega
    poznavalca in poustvarjalca Vivaldijeve glasbe. Dejaven je tudi kot flavtist ter
    je uredil in posnel številne skladateljeve skladbe, napisal več študij ter dirigiral
    na svetovnih premierah in snemanjih mnogih Vivaldijevih oper. Leta 2007 je bil
    imenovan za nadaljevalca kataloga Vivaldijevih del.
