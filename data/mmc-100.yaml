  date: '2023-07-13T12:46:10'
  figures:
  - caption: 'Foto: BoBo'
    img: https://img.rtvcdn.si/_up/upload/2020/05/22/65675694.jpg
    source: ''
  lead: 'V kraju v bližini Kopra je v sredo 35-letnik vzel plinsko jeklenko, se zaprl
    v hišo in grozil, da jo bo razstrelil. Prerezal je gumijasto cev jeklenke in odprl
    ventil. V hiši je bilo več ljudi, njihova življenja so bila ogrožena. '
  mention: []
  paragraphs:
  - Policijo je okoli 11. ure poklicala občanka, ki je prijavila glasno prepiranje
    in razbijanje v vasi vokolici Kopra. Nato so policisti prejeli še sporočilo, da
    je vzel plinsko jeklenko in se zaprl v hišo.
  - Na kraj so napotili več patrulj. 35-letnik je bil zaklenjen v hišo in grozil,
    da jo bo s plinom razstrelil. Prerezal je gumijasto cev 10-kilogramske plinske
    jeklenke, na kateri je odprl ventil in z njo hodil po objektu, v katerem se je
    nabrala večja količina plina butan. V tem času je bilo v hiši več ljudi, katerih
    življenja so bila ogrožena. Policisti so na kraj poklicali pogajalca in specialno
    enoto.
  - Storilec je grozil tudi s skokom z balkona, kar so mu preprečili. Policisti so
    nato vstopili v stanovanje in ga prijeli. "V postopku je 35-letnik še naprej grozil
    inin kršil javni red in mir ter se aktivno upiral, zato so bila uporabljena prisilna
    sredstva ter odrejeno pridržanje," so zapisali na PU-ju Koper. Gasilci Gasilske
    brigade Koper so zavarovali plinsko jeklenko in prezračili prostore.
  - Med prevozom z intervencijskim vozilom je 35-letnik poškodoval notranjost vozila
    ter nato policistom grozil in jih brcal. Na kraj je bil poklican dežurni zdravnik,
    ki je za moškega odredilhospitalizacijo.
  - Zoper 35-letnega moškega bodo podane kazenske ovadbe za povzročitev splošne nevarnosti,
    preprečitev uradnega dejanja in napad na uradno osebo. Poleg tega so policisti
    osumljenemu izrekli tudi ukrep prepoved približevanja ožjim družinskim članom
    in stanovanjski hiši v okolici Kopra.
