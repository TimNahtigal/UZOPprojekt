    na oblasti, v Wildersovi vladni koaliciji ne bo sodelovala.
  - Geert Wilders, 60-letni politični veteran, je s svojo plavolaso razkuštrano glavo,
    gromkimi nastopi in ostro protiislamsko retoriko eden najbolj prepoznavnih političnih
    obrazov na Nizozemskem in tudi eden najbolj prepoznavnih nizozemskih politikov
    onstran nizozemskih meja. Že skoraj dvajset let ima policijsko varstvo, ker so
    mu zaradi ostrih izjav proti islamu grozili s smrtjo.
  - V parlamentu je že četrt stoletja. Začel je v 90. letih z Ljudsko stranko za svobodo
    in demokracijo VVD, bil je tudi mentor mladega Marka Rutteja. Leta 2004 je stranko
    zaradi njenih, po njegovem mnenju nesprejemljivih stališč podpore vstopu Turčije
    v Evropsko unijo, zapustil in oblikoval PVV, Stranko za svobodo.
  - In v njej je, kot pravi Christoph Schmid t, politični komentator nizozemskega
    dnevnika Trouw in nekdanji dolgoletni dopisnik iz Bruslja, nesporni vladar. "
    Nenavadno pri tej stranki je, da nima članov. Ima samo enega člana, to je Geert
    Wilders. Druge stranke imajo na tisoče članov, prirejajo kongrese. A v tem primeru
    gre za zelo nenavadno stranko brez članov. Seveda imajo simpatizerje in donatorje,
    stranki lahko vedno pošljete denar, hvaležno ga bodo sprejeli. Toda struktura
    stranke je preprosto čudna, ker je brez članov. Poleg tega je Geert Wilders obseden
    z nadzorom; ne le pri nacionalnih, tudi pri evropskih ali lokalnih volitvah želi
    poznati seznam kandidatov, saj v stranki o vsem odloča prav on."
  - Človek, ki bi zaprl mošeje in islamske šole, prepovedal Koran, močno omejil priseljevanje,
    Nizozemsko odpeljal iz Evropske unije ali vsaj zaprl pipico njenih izplačil v
    evropske blagajne in jo izključil iz evropskih kmetijskih ter okoljskih politik,
    človek, ki bi ustavil nizozemsko dobavo orožja Ukrajini, je po desetletju politične
    osame in po rušilni volilni zmagi danes prvi kandidat za premierja in za sestavo
    nove nizozemske vlade.
  - Julija je zaradi spora v koaliciji glede omejitve azilne politike padla vlada
    premierja Marka Rutteja. Rutte je napovedal, da se umika iz domače politike, stranko
    VVD pa je prevzela 46-letna Dilan Yesilgoz, pravosodna ministrica v njegovi vladi.
  - Ankete so v predvolilni kampanji kazale tesne razlike med četverico vodilnih,
    a na prvem mestu je bila ves čas prav vladna stranka VVD.
  - Preobrat se je zgodil v zadnjem tednu pred volitvami. Wilders je v anketah skočil
    na prvo mesto. A da bo njegova zmaga tako prepričljiva, ni napovedal nihče.
  - Analitiki so si edini. Dilan Yesilgoz je storila veliko strateško napako.
  - '"Že septembra je izjavila, da je pripravljena sodelovati z Geertom Wildersom
    in s PVV-jem," pojasnjuje Christoph Schmidt. "In to, potem ko je Rutte v celotnem
    obdobju svojega vladanja vztrajal, da z Wildersom ne bo sodeloval, ker je skrajnež
    in ker svojih diskriminatornih besed o Maročanih ni nikoli preklical. Znan je
    njegov govor, v katerem je dejal: manj, manj, manj Maročanov na Nizozemskem. Za
    to je bil tudi obsojen. In Rutte je od tistega trenutka dalje PVV Geerta Wildersa
    javno obravnaval kot ekstremistično stranko, s katero ne bo sodeloval. Nato pa
    Ruttejeva naslednica izjavi, da se bo ta politika spremenila in da je odprta za
    sodelovanje z Wildersom. Od tega trenutka so tudi ljudje na Nizozemskem začeli
    razmišljati drugače, v smislu: v redu, glas za Wildersa ni več izgubljen glas,
    saj bodo to stranko zdaj jemali resno in bo morda sodelovala v vladi. Tako se
    je zlasti v zadnjih tednih Geert Wilders v javnomnenjskih anketah začel spektakularno
    vzpenjati."'
  - Da je Wildersu pot do zmage na široko odprla prav Dilan Yesilgoz, meni tudi Peter
    Verovšek, profesor zgodovine in teorije evropske integracije na univerzi v Groningenu
    na severu Nizozemske. Ljudska stranka, zaverovana v svojo premoč, je z namigom,
    da bi lahko sodelovala z Wildersom, želela volivcem dokazati svoja trdna in ostra
    stališča za omejevanje migracij. A je dosegla ravno nasprotno. "Ko je to rekla,
    je nekaterim svojim volivcem, ki bi morda taktično raje volili za VVD, dala dovoljenje,
    da gredo k Wildersu, saj bosta stranki sodelovali," pravi profesor Verovšek. "S
    tem je prebila sanitarni kordon, ki se je leta gradil okoli Wildersove stranke,
    ona pa jo je na neki način normalizirala. To je bila po mojem mnenju ključna taktična
    napaka, in ko sta ona in stranka VVD naredili korak nazaj, češ, saj ni tako mislila,
    je bilo že prepozno."
  - Čeprav se je izkazalo, da je to bil strel v koleno, je bila, nazaj gledano, odločitev
    VVD, da se v predvolilni kampanji spogleduje z Wildersom, logična taktična poteza.
    Stranka je bila doslej v vladi odvisna tudi od levo usmerjenih strank, kar je
    vladanje oteževalo in nazadnje tudi pripeljalo do padca Ruttejeve vlade, meni
    Tom Louwerse, profesor političnih ved na univerzi v Leidnu, ki raziskuje volilna
    gibanja.
  - '"VVD si je skušal zagotoviti več možnosti za sklepanje koalicije," pravi profesor
    Louwerse. "Zadnji dve vladni koaliciji z VVD-jem na čelu sta bili bolj ali manj
    desnosredinski koaliciji, v katerih pa so morali sodelovati tudi s strankami,
    ki so bile usmerjene levo od njih. Bili so najbolj desna stranka, kar pa je bilo
    problematično. Če si vodilna stranka v koaliciji, je bolje, če si na sredini,
    kajti tako dosežeš več. In verjetno so mislili, da si, če Wildersa ne izključujejo
    več, odpirajo možnosti za koalicijo na desnici, upali so, da bi s to možnostjo
    morda v pogajanjih celo bolj pritisnili na stranke na levici. Ampak očitno je,
    da se je to popolnoma izjalovilo."'
  - Nova vodja VVD-ja Dilan Yesilgoz ima turške in kurdske korenine. Na Nizozemsko
    je iz Turčije prišla kot begunka, ko je bila še otrok. Politično kariero je začela
    na levici, a je nato presedlala v Ruttejevo stranko. V parlamentu je od leta 2017,
    znana je tako po svojih odmevnih nastopih v televizijskih pogovornih oddajah kot
    po svoji podpori omejevanju priseljevanja.
  - 'Novinarski kolega Christoph Schmidt meni, da je bila odločitev, da jo izberejo
    za Ruttejevo naslednico, dobra. "Ljudje jo kot ministrico pozitivno ocenjujejo.
    Poleg tega je ženska, kar je prav tako pomembno, saj Nizozemska še nikoli ni imela
    predsednice vlade. Velja za močno, ker je mlada in privlačna tudi za nove volivce.
    Mislili so, da je bila pač znotraj stranke najboljša alternativa v smislu: nič
    boljšega nimamo. Kajti težko je naslediti nekoga, kot je Mark Rutte, ki ima res
    velik sloves. "'
  - 'Frans Timmermans, prvokategornik v domači in v evropski politiki, je v štirih
    letih dobil še drugo košarico: potem ko se mu je leta 2019 položaj predsednika
    Evropske komisije za las izmuznil iz rok in potem ko je poleti zapustil Bruselj
    in postal premierski kandidat koalicije laburistov in zelenih, je zdaj v položaju,
    ko ga je za dvanajst poslanskih mest prehitel skrajni desničar.'
  - '"Mislim, da sta Timmermans in njegova nova koalicija dveh levih strank, Zelenih
    in Delavske stranke, doživela uspeh, saj so zdaj druga najmočnejša sila na Nizozemskem,
    so celo pred VVD-jem," meni Christoph Schmidt. "To sodelovanje je delovalo in
    je ljudi pritegnilo. Vendar očitno ni bilo dovolj, da bi Timmermansu zagotovilo
    zmago, kar je seveda zanj veliko razočaranje. Ampak na splošno menim, da je na
    Nizozemskem trenutno preprosto premalo levih volivcev, pa če je na levi vodja
    Timmermans ali kdo drug. Država je pač desno usmerjena. Na Nizozemskem preprosto
    ni dovolj levih volivcev. To je dejstvo."'
  - Del volilnega taktiziranja desnosredinskega VVD-ja je bilo tudi to, da so v predvolilni
    kampanji življenjsko draginjo, predvsem pomanjkanje stanovanj, povezali s priseljevanjem.
    Taktiziranje, ki se jim je vrnilo kot bumerang. Večina politikov se strinja, da
    je to težava, a večina volivcev je več kot očitno menila, da ga ne morejo rešiti
    tisti, ki ga v 13 letih na oblasti niso. Kako velik in kakšen problem je priseljevanje
    na Nizozemskem?
  - '"Številke so velike, vendar ne izjemno velike," pojasnjuje Schmidt, "ampak ne
    gre za cunami, kot je izjavil Wilders, ki govori o migracijskem cunamiju. To je
    močno pretirano. Obstajajo pa seveda nekatere težave, na primer pri stanovanjski
    politiki.Največji del migracij na Nizozemskem sicer predstavljajo delovni migranti
    iz Evropske unije. Prihajajo iz Bolgarije ali Poljske in tu delajo. To število
    je zelo veliko. Ob njih pa imamo še begunce, ki prihajajo večinoma iz Sirije ali
    Afganistana. Njihovo število ni tako veliko, a problem je v tem, da imajo ti ljudje,
    ko dobijo pravico do azila na Nizozemskem, pravico tudi do nastanitve. Občina,
    v kateri so, mora poskrbeti, da dobijo stanovanje. In ker tudi veliko Nizozemcev
    čaka na občinska stanovanja, to podžiga protimigrantsko razpoloženje. Pravijo:
    oh, ti migranti, prihajajo od drugod, a imajo prednost pred mano, dobijo stanovanje,
    medtem ko jaz še vedno živim pri starših. Problem je dejansko stanovanjska kriza,
    ki pa je povezana tudi z migracijami."'
  - 'Profesor Verovšek v nizozemskem primeru vidi tudi lekcijo za evropski politični
    parket: "Zdi se mi, da je tudi to treba postaviti v širši kontekst. Na Poljskem
    je zmagala – ne bom rekel leva sredina – ampak neka desna sredina, ki ni tako
    radikalna. Tudi v Španiji je levici uspelo prevladati. Vidimo torej, da je treba
    v Evropi zelo taktično pristopati do skrajne desnice. Ta ima seveda možnosti za
    uspeh, tako kot jih je imela v preteklosti, ampak kot smo videli v teh primerih,
    jo je mogoče tudi ustaviti. Ko se v nekem političnem prostoru druge stranke ogradijo
    od skrajne desnice, se lahko če ne popolnoma ustavi, pa postavi v kot. Očitno
    je tudi, da ko se v kampanji govori o politikah, o katerih rada govori desnica,
    torej o migrantih, o tem, da gre preveč denarja za humanitarne namene, za Ukrajino,
    za Gazo, da so to teme, ki so vedno v korist desnici. To so teme, ob katerih desnica
    vedno zmaga. Zato je pomembno, da druge stranke pozornost volivcev preusmerijo
    na druge težave, na druge teme, in ne govorijo samo stvareh, ki pomagajo desnici."'
  - Nizozemsko zdaj čakajo dolga koalicijska pogajanja. Dilan Yesilgoz je že sporočila,
    da VVD, prvič po 13 letih ne bo več sodelovala v vladi, ne bodo pa nasprotovali
    morebitni manjšinski vladi. Torej z Wildersom v vladi da, če so oni glavni, a
    z Wildersom ne, če je on premier.
  - Wilders za večino v 150-članskem parlamentu potrebuje najmanj 76 sedežev. Gibanje
    kmetov in državljanov, ki je nastalo leta 2019 po protestih kmetov proti vladnim
    okoljskim ukrepom, je kljub velikim pričakovanjem zdaj dobilo le sedem poslanskih
    mandatov, kar Wildersu ne pomaga veliko, a ima stranka zaradi uspeha na marčevskih
    lokalnih volitvah veliko moč v senatu, s čimer lahko blokira zakonodajo, ki ji
    nasprotuje.
  - Nova družbena pogodba priljubljenega sredinskega politika Pietra Omtzigta, ki
    se je proslavil z razkrivanjem nepravilnosti v političnem sistemu, pred tremi
    meseci še sploh obstajala ni, zdaj pa bo imela 20 poslanskih mandatov; Wildersu
    sporočajo, da se bo moral zelo potruditi in zgladiti svoje ostre robove, če se
    bo želel pogovarjati z njimi. " Rekel je, da bo deloval ustavno, da ima zdaj druge
    prioritete," pojasnjuje profesor Verovšek, "ideje, da bi zaprli islamistične šole,
    prepovedali mošeje – še vedno tako misli, a zdaj so druge stvari pomembnejše.
    Nedvomno se zaveda, da česa takega morebitni koalicijski partnerji ne bodo podpirali.
    Skrajna stališča je umiril že med predvolilno kampanjo. Da jih sicer še vedno
    zagovarja, a da zdaj niso prioriteta."
  - '"Vprašanje pa je, ali mu bo uspelo postati politik, ki bo gradil mostove vsaj
    s strankami, ki so mu blizu," meni tudi Tom Louwerse, profesor političnih ved
    na univerzi v Leidnu.'
  - Koalicijska pogajanja bodo po napovedih trajala več mesecev. Do sestave nove vlade
    pa bo začasno še naprej vodil Mark Rutte.
