  paragraphs:
  - '"Venezuela ... kupujemo nafto od Venezuele? Ko sem šel (iz Bele hiše), je bila
    Venezuela pred tem, da se sesuje. Prevzeli bi jo in prevzeli bi nafto. Imeli bi
    jo pred vrati," je dejal Donald Trump na zborovanju republikanske stranke junija
    lani, s čimer je spodbudil domneve številnih, da naj bi ZDA stale za poskusom
    državnega udara leta 2019 v Venezueli, ko naj bi skušal Washington spraviti Madura
    z oblasti in ustoličiti mladega, neizkušenega, a proameriškega desničarskega opozicijskega
    politika Juana Guaidoja.'
  - Zgodba, ki se ponavlja že vse od vladavine pokojnega Huga Chaveza, ki je šel s
    svojimi socialističnimi politikami in kritiko ZDA ameriški administraciji močno
    v nos, tako da je skušala administracija Georgea W. Busha Venezuelo čim bolj osamiti.
  - A karizmatični Chavez je užival neomajno podporo Venezuelcev, ki so pod njim zacveteli.
    Denarja je bilo zaradi visokih cen nafte takrat dovolj, vlada je vsem zagotavljala
    zdravstveno zavarovanje, šolanje in stanovanja, stopnja brezposelnosti in stopnja
    neenakosti sta bili najnižji v Latinski Ameriki, stopnja pismenosti pa najvišja.
  - A ZDA so Chavezu ves čas nasprotovale, in ko je bil leta 2002 izveden poskus državnega
    udara, je Chavez zanj okrivil ZDA, Cijini dokumenti pa kažejo, da je takratna
    Busheva administracija že nekaj tednov prej vedela za puč.
  - ZDA, ki imajo dolgo – in pogosto krvavo – zgodovino prevratov in poskusov prevratov
    v Latinski Ameriki, redno izražajo "zaskrbljenost" in grozijo s sankcijami, kadar
    je v teh državah izvoljen voditelj, ki jim ne ustreza. Vzroki so različni, a pri
    Venezueli je eden glavnih – nafta.
  - '"Za nafto gre … spet," je februarja 2019 med nemiri v Venezueli tvitnila takrat
    še demokratska kongresnica in predsedniška kandidatka Tulsi Gabbard.'
  - Ta južnoameriška država ima namreč največje naftne rezerve na svetu, Trump pa
    kot predsednik ni skrival, da si Washington želi nadzirati naravne vire tujih
    držav. Tako se je leta 2020 v intervjuju za Fox News hvalil, da ameriška vojska
    zaseda z nafto bogate predele Sirije prav zato, da bi se ZDA okoristile z njeno
    nafto.
  - Podobne izjave so dajali tudi drugi člani Trumpove administracije. Tako je njegov
    takratni svetovalec za nacionalno varnost John Bolton ob poskusu menjave Madura
    za Guaidoja januarja 2019 v pogovoru za Fox News neposredno dejal, da se želijo
    Washington in ameriške korporacije okoristiti z venezuelsko nafto.
  - '"Opazujemo te naftne zaloge. To je daleč najpomembnejši vir prihodkov za venezuelsko
    vlado. Zelo resno preučujemo, kaj storiti s tem," je razlagal.'
  - '"Pogovarjamo se z večjimi ameriškimi podjetji, ki so bodisi v Venezueli bodisi
    tu v ZDA. Mislim, da imamo isti cilj. Venezuela je ena od treh držav, ki sem jih
    označil za ''trojko tiranije''. Za ameriško gospodarstvo bi veliko pomenilo, če
    bi lahko ameriška naftna podjetja vlagala in delovala v venezuelski naftni industriji.
    Bilo bi dobro za prebivalce Venezuele. In bilo bi dobro za ZDA."'
  - Še isti mesec so ZDA uvedle sankcije proti venezuelskemu državnemu naftnemu podjetju
    PDVSA. "Z našimi sankcijami proti Venezueli smo zamrznili sedem milijard sredstev
    PDVSA-ja, sankcije pa bodo državo stale 11 milijard izgubljenih dohodkov v naslednjem
    letu," se je pohvalil Bolton.
  - S sankcijami je bila Venezuela gospodarsko močno načeta, gospodarsko stanje pa
    je povzročilo tudi eno največjih migrantskih kriz na svetu, pri čemer je državo
    zapustilo skoraj 7,7 milijona prebivalcev – od tega jih je večina skušala boljše
    življenje iskati v latinskoameriških državah.
  - 'Ne gre zanemariti niti Boltonovega posrednega priznanja, ko je leta 2022 govoril
    o vdoru Trumpovih podpornikov v kongres: "6. januar ni bil državni udar, jaz že
    vem, saj sem jih načrtoval veliko. Samo poglejte, kaj smo skušali storiti v Venezueli
    ..."'
  - Se zgodovina ponavlja?
  - Osrednji zahodni mediji so polni naslovov o "dvomljivih" izidih volitev v Venezueli
    in kako svetovni voditelji izražajo skepso glede legitimnosti in poštenosti volilnega
    procesa.
  - '"ZDA in latinskoameriški voditelji po Madurovi razglasitvi zmage dvomijo o izidu
    volitev v Venezueli," se bere naslov v Forbesu.'
  - V članku ta ameriška revija navaja ameriškega državnega sekretarja Blinkna ("Resno
    nas skrbi, da oznanjeni izid ne odraža volje ali glasov venezuelskega ljudstva"),
    republikanskega senatorja Marca Rubia ("Najbolj predvidljiva in absurdna volilna
    prevara v moderni zgodovini ") in peščico latinskoameriških voditeljev, pri čemer
    prednjačijo skrajno desni voditelji, kot sta argentinski predsednik Javier Milei,
    čigar izjav zahodni mediji vse do zdaj nikdar niso jemali prav resno, ali pa urugvajski
    predsednik Luis Lacalle Pou.
  - Eden najbolj angažiranih v podpori venezuelski opoziciji in kritiki Madura pa
    je v zadnjih 48 urah Elon Musk, ki je v nizu tvitov napadel "venezuelskega diktatorja"
    in pri tem delil tudi nekaj videoposnetkov, ki so jih bralci naglo prepoznali
    kot neverodostojne. Zanimivo je, da Musk do aprila letos o Venezueli ni tvitnil
    niti enkrat.
  - Morda je zgolj naključje, ampak večina voditeljev, ki so ostro kritizirali izid
    venezuelskih volitev, je tudi neomajnih podpornikov Izraela.
  - In medtem ko je Maduro izrazil vso podporo palestinskemu narodu in ostro obsodil
    Izrael, celo ob oddaji glasu, je desničarska vodja venezuelske opozicije Maria
    Corina Machado, ki podpira Madurovega izzivalca Edmunda Gonzaleza Urrutio, izrazila
    popolno podporo Izraelu.
  - Še več – Machado je leta 2018 izraelskemu premierju Benjaminu Netanjahuju poslala
    pismo, v katerem ga je prosila, naj Izrael vojaško posreduje v Venezueli.
  - Kot pri prejšnjih očitkih nelegitimnih volitev ZDA tudi tokrat niso predložile
    dokazov.
  - 'Kot so opozorili pri WikiLeaksu: "Desničarska opozicija Venezuele in ameriški
    mediji trdijo, da se je na volitvah 28. julija zgodila prevara glede na izide
    vzporednih volitev, ki jih je izvedla z ameriško vlado povezana družba Edison
    Research, ki sodeluje s CIO povezanimi ameriškimi državnimi propagandnimi organi
    ter je bila dejavna v Ukrajini, Gruziji in Iraku."'
  - Ob tem je treba poudariti, da tuji opazovalci – 900 vse skupaj – o nepravilnostih
    niso poročali.
  - '"Sem v Venezueli kot opazovalec in lahko z gotovostjo povem, da po sistematičnem
    vmešavanju protidemokratičnih sil iz ZDA volilni izidi odražajo voljo volivcev,"
    je na omrežju X zapisal aktivist za človekove pravice Ajamu Baraka.'
  - Opazovalci iz ameriškega odvetniškega ceha (NLG) pa so v ponedeljek sporočili,
    da je " delegacija ugotovila transparenten, pošten volilni postopek, pri čemer
    je bila vsa pozornost usmerjena na legitimnost, dostop do volišč in pluralizem
    ".
  - '"Kljub stabilnosti volilnega sistema opozicija s podporo ZDA in proti Maduru
    uperjenih zahodnih medijev ne želi sprejeti izidov, s čimer spodkopava stabilnost
    venezuelske demokracije," so med drugim poudarili.'
  - In kdo točno so protestniki, ki so se množično podali na ulice po Madurovi razglasitvi
    zmage? Neodvisni mediji poročajo, da gre za besne privržence desne opozicije,
    pri čemer je ena skupina požgala bolnišnico, druga pa zrušila kip staroselskega
    poglavarja Coromota in pri tem vzklikala "Naj živi Kristus", ko so vlekli kip
    te zgodovinske osebnosti po ulicah.
  - '"Napad venezuelskih desničarjev na staroselski kip, "duhovni simbol chavizma",
    točno kaže, kakšen tip nasilnega rasizma podpirajo ameriške politične elite in
    milijarderji, kot je Elon Musk. Tu ne gre za volitve. Tu gre za povrnitev starega
    kolonialnega reda," je na omrežju X zapisal eden vidnejših ameriških staroselskih
    aktivistov, novinar in zgodovinar na Univerzi v Minnesoti Nick Estes.'
  - MintPress, neodvisni novinarski čuvaj (watchdog), navaja, da v Venezueli poteka
    državni udar, protestniki pa so ponoči zažgali bolnišnico in lekarno v Caracasu
    za socialno ogrožene. Ameriški neodvisni novičarski portal The Grayzone News dogajanje
    v Venezueli označuje za " še eno ameriško barvno revolucijo ".
  - '"Ne prenehajte kritično razmišljati samo zato, ker so vam vse življenje dopovedovali,
    da je Venezuela "socialistična". Venezuelska opozicija se sklicuje na volilne
    prevare in izpodbija tako rekoč vsake volitve, ki so jih izgubili, odkar se je
    Chavez povzpel na oblast. A kljub temu jim nikdar ne uspe predložiti dokazov,
    to pa zato, ker ima venezuelski volilni proces precej več varovalk, da ni nepravilnosti
    in prevar, kot tisti, ki ga imamo v ZDA," j e na omrežju X zapisala novinarka
    Greyzona Anya Parampil in avtorica knjige Korporativni državni udar.'
  - Parampil ni edina, ki to izpostavlja – nekdanji ameriški predsednik Jimmy Carter
    je volilni sistem v Venezueli leta 2012 označil celo kot "najboljšega na svetu".
    Za enega najslabših na svetu pa je po drugi strani označil ameriškega, in sicer
    zaradi izjemnih finančnih vložkov zasebnih donatorjev, nad katerimi ni nobenega
    nadzora in pregleda.
  - V Venezueli se volilne naprave aktivirajo z dvostopenjskim postopkom preverjanja,
    volivci ob oddaji glasu skenirajo svoj prstni odtis, oblasti prvič že po zaprtju
    volišč vzamejo vzorec oddanih glasov, celoten postopek pa spremljajo mednarodni
    opazovalci.
  - Je pa dogajanje v Venezueli očitno eno redkih, ki je povezalo ameriške republikance
    in demokrate – čeprav na slednje v zadnjih tednih leti kar nekaj očitkov glede
    lastnega volilnega procesa in transparentnosti.
  - 'Neodvisna ameriška predsedniška kandidatka Jill Stein tako pravi: "Medtem ko
    Bidnova administracija pridiga Venezueli glede demokracije, njena lastna stranka
    s tožbami preprečuje kandidaturo tekmecem, najema posameznike, da sabotirajo nasprotnike,
    in celo zadržujejo javna sredstva, do katerih smo upravičeni. Utihnite glede Venezuele
    in nehajte ubijati demokracijo v ZDA."'
  title: Volitve v Venezueli - res oporečne ali izid zgolj ne ustreza ZDA?
