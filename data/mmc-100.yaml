  date: '2022-12-23T23:15:00'
  figures:
  - caption: Sodelujoči na novinarski konferenci.
    img: https://img.rtvcdn.si/_up/upload/2022/12/23/66046482.jpg
    source: YouTube
  lead: Center za tehnologijo genske in celične terapije, s katerim želi Kemijski
    inštitut pacientom omogočiti hitrejši dostop do zdravljenja, je dobil zeleno luč
    za sofinanciranje iz EU-ja, 30 milijonov evrov vreden projekt pa bo sofinancirala
    tudi vlada.
  mention:
  - Igor Papič
  - Roman Jerala
  - Mojce Benčina
  - ' Samo Zver,'
  - ' Damijan Osredkar'
  - ' Špela Miloševič'
  paragraphs:
  - V centru bodo razvijali nove načine zdravljenja, ki so izjemno učinkoviti, saj
    so ciljani in prilagojeni posameznim bolnikom ali skupinam bolnikov. Delujejo
    na neposreden vzrok bolezni, zato lahko omogočijo celo trajno ozdravitev. Ključnega
    pomena pri razvoju takšnih načinov zdravljenja je odličnost raziskav s področja
    sintezne biologije, nevrobiologije, genetike in imunologije, so poudarili govorci.
  - Ta razvoj bo podpiralo sodelovanje znanstvenikov in zdravnikov UKC-ja Ljubljana,
    pomembno povezovalno vlogo pa bodo imeli tudi bolniki in njihovi zagovorniki.
    Center bo tako predstavljal pomemben most med biomedicinskimi raziskavami za napredno
    zdravljenje in prenosom teh raziskav do bolnikov.
  - Minister za izobraževanje, znanost in šport Igor Papič je poudaril, da bo z gradnjo
    centra uresničen prehod iz bazičnega raziskovanja v uporabo teh raziskav. Dodal
    je še, da se mu zdi pomembno, da se inovacije razširijo v družbo, kar bo center
    spodbujal na kliničnem področju. Vodja odseka za sintezno biologijo in imunologijo
    na Kemijskem inštitutu Roman Jerala je ob tem dejal, da je inštitut že zdaj v
    vrhu evropske znanosti. Predstavil je nekatera najnovejša dognanja na področju
    molekularne in strukturne biologije, ki so jih slovenski znanstveniki objavili
    v prestižnih znanstvenih revijah. Udeleženci so poudarili, da bo center z novimi
    prostori in drugačno pravno zgradbo omogočal nadaljnji razvoj stroke.
  - Vsi sodelujoči so poudarili nujnost stopanja v korak z najrazvitejšimi državami
    na svetu, vzpostavitev centra pa bo ta cilj do velike mere dosegla, saj takšnih
    centrov v Evropi ni veliko. Centru se bodo pridružili tudi partnerji iz tujine,
    in sicer iz Velike Britanije, Nizozemske in Nemčije.
  - Center bo imel okoli 1400 kvadratnih metrov raziskovalnih površin, bo pa v neposredni
    bližini Kemijskega inštituta. Po besedah raziskovalke in strokovne sodelavke pri
    projektu centra Mojce Benčina so interes za izgradnjo centra izrazile tudi organizacije
    bolnikov tako v tujini kot v Sloveniji, organiziran pa bo kot zasebna neprofitna
    raziskovalna organizacija s statusom delovanja v javnem interesu.
  - Benčina je ocenila, da bo center vzpostavljen v petih letih, projekt pa ima zagotovljeno
    financiranje za šest let. Center bo v tem času tudi lažje privabljal zaposlene
    iz tujine, saj za plače raziskovalcev ne bo veljal javni plačni sistem.
  - Na današnji konferenci so sodelovali tudi predstojnik kliničnega oddelka za hematologijo
    na Univerzitetnem kliničnem centru (UKC) Ljubljana Samo Zver, predstojnik oddelka
    za otroško in razvojno nevrologijo UKC-ja Ljubljana Damijan Osredkar in Špela
    Miloševič, predsednica in soustanoviteljica Fundacije CTNNB1 ter mama dečka Urbana,
    ki je bil diagnosticiran z redkim genetskim sindromom CTNNB1, ki povzroča hude
    nevrološke motnje.
  title: 30 milijonov za projekt, s katerim bodo bolniki z redkimi boleznimi hitreje
