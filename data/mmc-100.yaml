  paragraphs:
  - Zvezdnica serije Razočarane gospodinje (za vlogo Gabrielle Solis je bila leta
    2006 nominirana za zlati globus za glavno žensko vlogo) je blestela na zabavi
    v eni izmed restavracij v Miamiju, je za Page Six povedal očividec.
  - Za ta poseben dogodek je izbrala obleko modne hiše Ermanno Scervino, ki je bila
    posuta z bleščicami. S temi je bila okrašena tudi trinadstropna rojstnodnevna
    torta.
  - Ob Evi je bil njen mož Jose Baston, predsednik mehiške televizijske hiše Televisa,
    ki jo je ljubeče podpiral, je dodal vir.
  - Med gosti so bili tudi najbližji prijatelji, med njimi igralka Gabrielle Union,
    košarkar Dwyane Wade, pevka in igralka Becky G, tenisač Grigor Dimitrov ...
  - Večer je bil poln smeha, plesa in naklonjenosti med prijatelji, je dodal ameriški
    People. Becky G je ob spremljavi mariačev zapela serenado z naslovom Como La Flor.
  - 'Longoria je po uradnem delu praznovanje nato nadaljevala v nočnem klubu skupaj
    s prijateljicami. "Eva se je zabavala do jutranjih ur," je povedal vir in dodal,
    da se je preizkusila tudi kot didžejka: "Navdušila je množico."'
  - 'Vse utrinke je igralka delila tudi na svojem Instagramu, kjer je objavila tudi
    kolaž fotografij, ki so nastale ob abrahamu. Pripisala je: "To so petdeseta."'
  title: Večer, poln plesa in smeha, ali kako je Eva Longoria proslavila abrahama
