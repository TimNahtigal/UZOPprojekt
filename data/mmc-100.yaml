  lead: Kriminalisti so na območju ljubljanske in mariborske policijske uprave izvedli
    hišne preiskave v stanovanjskih in poslovnih prostorih ter pri državnih organih
    zaradi suma zlorabe uradnega položaja pri razpisu za financiranje projektov.
  mention:
  - Kaja Primorac
  paragraphs:
  - Na Policijski upravi Ljubljana so pojasnili, da so kriminalisti sektorja kriminalistične
    policije PU-ja Ljubljana skupaj z mariborskimi kriminalisti v sredo izvedli skupno
    pet preiskav stanovanjskih in poslovnih prostorov ter prostorov državnega organa
    zaradi suma, da so tri fizične osebe in ena pravna oseba izvedle kaznivo dejanje,
    ker so na javnem razpisu dosegle, da so se na razpis med prejemnike uvrstile organizacije,
    ki niso izpolnjevale meril za dodelitev denarja.
  - Med hišnimi preiskavami je sodelovalo 21 kriminalistov policijskih uprav Ljubljana
    in Maribor. Noben osumljenec ni bil pridržan. Preiskavo bodo nadaljevali s pregledom
    zasežene poslovne dokumentacije in elektronskih naprav ter z zbiranjem obvestil.
    Več informacij zaradi interesa preiskave niso posredovali.
  - Neuradno naj bi šlo za preiskavo, povezano z razpisom, zaradi katerega je odstopila
    ministrica Sanja Ajanović Hovnik.
  - Ministrstvo za javno upravo je marca lani objavilo javni razpis za krepitev državljanskih
    pravic in opolnomočenje nevladnih organizacij na tem področju v vrednosti približno
    10,6 milijona evrov. Komisija za preprečevanje korupcije (KPK) je lani pri izvedbi
    razpisa zaznala sum kršitve nasprotja interesov in novembra uvedla preiskavo zoper
    nekdanjo ministrico za javno upravo Sanjo Ajanović Hovnik.
  - Med največjimi prejemniki sredstev na omenjenem razpisu je bil namreč Inštitut
    za preučevanje enakosti spolov, ki ga vodi njena nekdanja sodelavka in poslovna
    partnerica Kaja Primorac. Ta je tudi direktorica in solastnica podjetja Smart
    center, katerega solastnica in direktorica je bila do sredine junija Ajanović
    Hovnik.
  - Ajanović Hovnik je sicer oktobra s položaja ministrice odstopila. Kot so takrat
    sporočili iz kabineta predsednika vlade, se je za to odločila, ker ne želi, da
    ministrstvo ali vlada nosita breme razčiščevanja, povezanega z opravljanjem njene
    funkcije.
  - Ministrstvo je na začetku leta razpis razveljavilo, več nevladnih organizacij
    pa je zaradi tega protestiralo, saj menijo, da razveljavitev ni bila zakonita.
  - STA je za odziv o hišnih preiskavah prosil tudi ministrstvo, kjer so uredništvo
    usmerili k organom kazenskega pregona. Nekdanja ministrica Sanja Ajanović Hovnik
    na vprašanja ni želela odgovarjati.
