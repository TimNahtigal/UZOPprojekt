  - Na nasledstveno krizo, ki je monaški dvor pestila pred slabima dvema desetletjema,
    je ostal le še spomin. Po palači ob večjih družinskih dogodkih danes kar mrgoli
    mladeži, zdaj pa se jim je pridružila še ena deklica.
  - Kot sta na družbenem omrežju Instagram oznanila 32-letni Louis Ducruet, sin princese
    Stephanie in njegova žena Marie, sta po Victoire, ki se je rodila aprila lani,
    dočakala še Constance, ki se je družini pridružila v ponedeljek. "Naša družina
    je s prihodom naše male Constance spet zrasla. Nekdo se je zelo veselil, da jo
    bo spoznal," je zapisala ponosna mama Marie Hoa Chevallier in objavila fotografijo,
    na kateri je v posteljici videti v odejo zavito štručko, ograjico pa držita dve
    majhni roki – kot je razbrati iz objave, pripadata novorojenkini starejši sestri
    Victoire.
  - 59-letna princesa Stephanie, ki ima poleg Louisa tudi dve hčerki, 30-letno Pauline
    Ducruet in štiri leta mlajšo Camille Gottlieb, je tako drugič postala babica.
    Mlajšo sestro trenutnega kneza Alberta II. po številu vnukov trenutno močno prekaša
    sestra Caroline, ki jih ima že sedem.
  - 'Njen najstarejši sin Andrea ima z ženo Tatiano Santo Domingo dva sinova in hčerko:
