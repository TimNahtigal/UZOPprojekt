- _id: 67cee279bfc9178e1df3454d
  url: https://www.rtvslo.si/slovenija/zakaj-ne-bi-zakonska-prepoved-rabe-telefonov-v-solah-resila-tezave/737943
  topics: slovenija
  authors:
  - Taja Lesjak Šilak
  date: '2025-03-10T06:09:32'
  figures:
  - caption: Uporaba telefonov pri mladostnikih se kaže zlasti v slabši koncentraciji.
    img: https://img.rtvcdn.si/_up/upload/2022/04/02/65976595.jpg
    source: Pixabay
  id: '737943'
  keywords:
  - Vzgojno-izobraževalne ustanove
  - Digitalne naprave
