  lead: Človekoljubne organizacije so sporočile, da je v brodolomu čolna, ki je potonil
    okoli 90 kilometrov južno od Kanarskih otokov, najverjetneje umrlo najmanj 50
    prebežnikov iz Senegala.
  mention: []
  paragraphs:
  - Prebežniki so se odpravili na izredno nevarno pot z zahoda Afrike v Evropo, ko
    se je njihov leseni čoln pred obalo otoka El Hierro, ki spada pod Kanarske otoke,
    prevrnil.
  - Tovorna ladja, ki je bila v bližini, je poklicala špansko reševalno službo, ki
    je s svojega središča na Tenerifu proti kraju nesreče poslala hitri čoln in helikopter.
    Uspeli so rešiti devet ljudi, ki so se obdržali na potapljajočem se čolnu. Drugih
    ljudi niso videli.
  - Na čolnu je bilo po njihovih podatkih okoli 60 ljudi. Plovilo je iz senegalskega
    mesta Mbour izplulo pred devetimi dnevi, poroča Guardian.
  - Gre za zelo nevarno prebežniško pot, na kateri so nesreče pogoste. Ena najhujših
    se je zgodila oktobra leta 2020, ko je v brodolomu kmalu po izplutju iz istega
    senegalskega mesta umrlo 140 ljudi.
  - Neka nevladna organizacija je nedavno ocenila, da je samo letos na tej poti, katere
    cilj je obala Kanarskih otokov, umrlo 6618 ljudi, med njimi 384 otrok, kar pomeni
    v povprečju kar 18 smrti na dan.
  - Po podatkih španskih oblasti pa je na njihove obale med 1. januarjem in 15. aprilom
    letos prišlo več kot 16.6000 prebežnikov, kar je za več kot 11.000 več kot v enakem
    obdobju lani. Velika večina prebežnikov, ki je v državo prišla po morju, se je
    izkrcala na Kanarskih otokih – kar 14.030.
  - Na tisoče ljudi iz podsaharske Afrike beži iz domovine zaradi spopadov, revščine
    in ekonomske nestabilnosti.
  title: Pred Kanarskimi otoki se je prevrnil čoln s prebežniki iz Senegala. Umrlo
    naj bi okoli 50 ljudi.
