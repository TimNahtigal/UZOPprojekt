  lead: Moja mama je za prvomajske praznike obiskala Benetke. Domov pa je prišla z
    zbadajočo bolečino v peti. Bolečina je bila najmočnejša zjutraj, ko je vstala
    iz postelje in kadar je po daljšem sedenju naredila prve korake.
  mention:
  - Urban Praprotnik
  paragraphs:
  - Naša stopala so sestavljena iz 26 kosti in 29 mišic, vse od pete do prstov pa
    poteka pomembno vezivno tkivo, ki mu rečemo plantarna fascija. Vloga te fascije
    je zelo povezana s tekom, saj vpliva na spremenljivo togost stopala pri teku.
    Ko stopimo na tla in so prsti na nogi v srednjem položaju, kar omogoča bolj popustljivo,
    mehkejše stopalo, pri čemer stopalni lok popusti. Zaradi tega je naš dotik s tlemi
    bolje blažen. Ko pa končujemo odriv in se pri tem prsti iztegnejo, to napne tudi
    to stopalno vezivno tkivo. Stopalo takrat postane trše, kar poveča učinkovitost
    odriva.
  - Kadar nekaj dni veliko dlje časa stojimo na nogah, kar je naredila moja mama v
    Benetkah, se stopalna vez preobremeni. Pa tudi kadar povečamo velikost obremenitev,
    kar se zgodi tekaškemu začetniku, katerega stopalo ni vajeno tako velikih razteznih
    sil, tudi ni dobro. To vodi do zelo majhnih raztrganin vezivnega tkiva, poškodbe
    plantarne fascije, ki jo običajno čutimo s skelečo bolečino na spodnji, rahlo
    notranji strani pete. Poškodovano vezivno tkivo se celi, a se lahko pri tem zabrazgotini.
    Zato postane na tem mestu manj prožno in tudi bolj podvrženo ponavljanju raztrganin.
    Rešitev težave se skriva v povrnitvi prožnosti vezivnega tkiva z njenim počasnim
    raztezanjem in masiranjem ter učvrstitvijo celotnega stopala s postopnim povečevanjem
    količine in intenzivnosti obremenitev. Koristi pa lahko tudi povečanje gibljivosti
    gležnja in primernejša izbira obutve, po potrebi tudi podpora stopala s pomočjo
    posebnih vložkov.
  - Ker tako veliko ljudi premalo hodi in še manj teče, je povsem pričakovano, da
    imajo zaradi tega šibkejša stopala in ta so toliko bolj podvržena težavam. Z redno
    hojo in tekom obremenjujemo stopala in ta so zaradi tega odpornejša. A je pri
    tem pomembna primerna postopnost pri povečevanju količine in jakosti.
  - Mama se je imela v Benetkah lepo, težava s stopali pa je bila spodbudno opozorilo,
    da si naj čez zimo ne privošči zimskega spanca.
  - Vabim vas, da se tudi vi lotite vadbe za stopala. Hodite živahno, hodite v klanec,
    pa bosi doma po prednjem delu stopal. Če vam sklepi še dobro služijo, začnite
    tudi po malem teči. Vabim vas, da se vključite v trimesečno uvajanje v tek, ki
    je namenjeno popolnim začetnikom, pa tudi tistim, ki so že tekli, a so jih tekaške
    poškodbe zaustavile. Vadba je celo brezplačna, ker jo podpira Mestna občina Ljubljana
    v okviru projekta Ljubljana je šport. Gremo na tek! Več.
  - 'Obvestilo uredništva:'
  - Mnenje avtorice oziroma avtorja ne odraža nujno stališč uredništev RTV Slovenija.
