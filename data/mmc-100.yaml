    img: https://img.rtvcdn.si/_up/upload/2023/11/06/66130992.jpg
    source: BoBo/Žiga Živulović ml.
  - caption: Na leposlovnem oddelku je največ pozornosti namenjene slovenskim avtorjem
      v prevodih.
    img: https://img.rtvcdn.si/_up/upload/2023/11/06/66130996.jpg
    source: BoBo/Žiga Živulović ml.
  lead: V knjigarni Konzorcij so odprli 37. prodajno razstavo Frankfurt po Frankfurtu.
    Predstavljajo približno 4700 najboljših tujih knjig preteklega leta. Naslovna
    tema letošnjega Frankfurta po Frankfurtu je Slovenci v prevodih.
  mention:
  - Miha Kovač
  - ' Alenka Kepic'
  - Senja Požar
  - Tanja Petrič
  - Katarine Modic
  paragraphs:
  - Letošnji knjižni sejem v Frankfurtu je bil za Slovenijo najpomembnejši do zdaj,
    saj se je na največjem knjižnem sejmu na svetu predstavila kot častna gostja.
    Priprave so bile temeljite in pričakovano je bila uspešna tudi predstavitev slovenske
    literarne bere, so razstavi na pot zapisali v Mladinski knjigi.
  - Na odprtju je o tem, kako uspešna je bila predstavitev Slovenije na letošnjem
    jubilejnem 75. Frankfurtskem knjižnem sejmu, spregovoril sokurator častnega gostovanja
    Slovenije na sejmu Miha Kovač, glavna urednica Mladinske knjige in direktorica
    Cankarjeve založbe Alenka Kepic Mohar pa je strnila vtise o sejemskem nastopu
    Mladinske knjige in Cankarjeve založbe ter njunih avtorjev.
  - Odprtju je opoldne sledila okrogla miza z naslovom Slovenci v prevodih, ki jo
    je vodila novinarka Pia Prezelj. Njene sogovornice so bile pristojna za prodajo
    avtorskih pravic v tujino pri Mladinski knjigi Senja Požar, prevajalka Alexandra
    Natalie Zaleznik, predsednica Društva slovenskih književnih prevajalcev Tanja
    Petrič ter pisateljica in prevajalka Erica Johnson Debeljak. Sejem v Frankfurtu,
    na katerem je bila Slovenija letos častna gostja, je sprožil kolesje, ki bi ga
    veljalo ohraniti, so se strinjale sodelujoče.
  - Najboljše tuje knjige preteklega leta z različnih strokovnih področij in v zadnjem
    letu nagrajena leposlovna dela, ki so predstavljena na razstavi, je izbrala ekipa
    knjigarjev Konzorcija pod vodstvom Katarine Modic.
