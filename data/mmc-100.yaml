  topics: gospodarstvo
  authors:
  - T. K. B.
  date: '2023-05-31T10:41:00'
  figures:
  - caption: Zavarovalnica Sava. (Fotografija je arhivska.)
    img: https://img.rtvcdn.si/_up/upload/2017/09/08/65434348_photo_509026_20161121_4.jpg
    source: BoBo
  lead: Čisti dobiček Zavarovalne skupine Sava je v prvem četrtletju glede na isto
    obdobje lani poskočil za 144,3 odstotka na 20,1 milijona evrov, je objavila obvladujoča
    družba skupine Sava Re.
  mention: []
  paragraphs:
  - Obseg poslovanja Zavarovalne skupine Sava, ki zajema vse obračunane bruto premije
    in druge prihodke, je v prvem četrtletju znašal 260,2 milijona evrov, kar je 9,9
    odstotka več kot v istem obdobju lani. K rasti obsega poslovanja je največ prispevala
    rast bruto premij pri premoženjskih zavarovanjih in pozavarovanju, pri obeh tako
    zaradi povečanja cen kot tudi zaradi organske rasti poslovanja, medtem ko bruto
    premije življenjskih zavarovanj niso sledile lanskemu obsegu, saj je bila prodaja
    zavarovanj z enkratnimi vplačili v prvem četrtletju lani izjemoma izredno visoka,
    so zapisali v poročilu, objavljenem na spletnih straneh Ljubljanske borze.
  - Skupni obseg bruto premij je znašal 161,3 milijona evrov, kar je 15,4 odstotka
    več kot v istem obdobju lani. Na trgih EU-ja se je okrepil predvsem zaradi rasti
    bruto premij avtomobilskih zavarovanj, ki je bila najbolj povezana z rastjo povprečne
    premije zaradi zvišanja cen zavarovalnih storitev kot odziv na škodno inflacijo
    (rast cen avtomobilskih delov in storitev popravil). Povečanje pa je tudi posledica
    organske rasti oz. pridobitve novih zavarovancev in števila zavarovanj. Predvsem
    z organsko rastjo je skupina dosegla 23,4-odstotno povečanje bruto premij na trgih
    zunaj EU-ja, pojasnjujejo.
  - K rasti čistega dobička je med drugim prispeval višji zavarovalni rezultat, ki
    je porasel za 55,1 odstotka, na 23,8 milijona evrov. Povečanje so dosegli predvsem
    pri pozavarovanju in premoženjskih zavarovanjih zaradi večjih zavarovalnih prihodkov
    in tudi zaradi drugačne strukture večjih škod, ki so v letu 2023 v večji meri
    sprožile pozavarovano zaščito skupine in bile s tem prenesene pozavarovateljem.
    V letu 2022 je bilo sicer več škod, ki pa pozavarovalnih kritij niso sprožile
    v takšnem obsegu, so navedli.
  - Dodatno pa so rast zavarovalnega rezultata pripisali tudi temu, da je bil rezultat
    prvega četrtletja lani pod močnim pritiskom škodne inflacije. K čistemu dobičku
    je prispeval tudi močno povečan finančni rezultat zaradi ugodnejšega gibanja na
    finančnih trgih. Donosnost lastniškega kapitala se je povečala za 7,5 odstotne
    točke, na 13,4 odstotka.
  - Skupina je v prvem četrtletju dosegla 32,5 odstotka načrtovanega obsega poslovanja
    za vse leto 2023. Čisti dobiček je znašal 37,9 odstotka načrtovane spodnje meje
    v načrtu za vse leto 2023. Prav tako so bili od letnih ciljev mnogo boljši tudi
    vsi drugi ključni kazalniki poslovanja, so zapisali.
  - Skupščina Save Re bo 5. junija med drugim odločala o predlogu, da družba za dividende
    za lani nameni 24,9 milijona evrov oz. 1,60 evra bruto na delnico, kar bi bilo
    deset centov oz. 6,7 odstotka več kot lani. Po dividendni politiki naj bi družba
    za dividende namenila med 35 in 45 odstotki čistega dobička Zavarovalne skupine
    Sava. Skupina je imela lani 68,2 milijona evrov čistega dobička, 10,4 odstotka
    manj kot leto prej.
