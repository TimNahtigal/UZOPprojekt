  title: 'Ključen problem: kapaciteta tirov ne dopušča večjega števila vlakov'
  paragraphs:
  - Lani so imele Slovenske železnice okrog 40 milijonov evrov dobička iz poslovanja
    (EBIT), letos pričakujejo še nekoliko boljši rezultat. "Polnokrvno digitalizirane"
    naj bi postale do konca leta 2024, do takrat naj bi tudi pridobile celotni delež
    v avtobusnem prevozniku Nomago. Čez osem let bo železniški potniški promet v državi
    odprt za tujo konkurenco.
  - SŽ-Potniški promet ima z državo podpisano pogodbo v vrednosti 73 milijonov evrov
    za opravljanje obvezne gospodarske javne službe, to pomeni, da država predpiše
    vozne rede in cene vozovnic, ki jih tudi subvencionira. Do leta 2031 bo podjetje
    SŽ edini prevoznik v potniškem prometu, od takrat naprej pa bo moralo za prevoze
    oziroma potnike tekmovati z drugimi ponudniki. Pa bo sploh zanimanje za opravljanje
    tovrstnih storitev glede na stanje tirov in potovalne čase?
  - 'Slovenske železnice bodo letos prepeljale približno 15 milijonov potnikov. Če
    bi bile enako uspešne kot češke železnice, bi jih skoraj 30 milijonov. Zakaj torej
    ni potnikov še več, če promet po tirih prispeva k zmanjšanju izpustov? Generalni
    direktor Dušan Mes, ki je na tem položaju rekordnih 11 let, odgovarja: "Kapaciteta
    tirov ne dopušča več vlakov. To je, kot bi rekel, da v Sloveniji ni avtocest.
    Tako je na železnicah. Ne vem, kako bi šli na morje, če ne bi bilo avtocest …
    Ko bo število prog večje, bo večje tudi število potnikov. Doslej je bilo malo
    vloženega v regionalne proge, kar pa za potniški promet pomeni izjemno priložnost."'
  - Švicarji se ponašajo s točnostjo železniških povezav, ker imajo dvotirne železnice,
    to pomeni, da vlaki vozijo pogosteje in se lahko srečujejo. Na naših regionalnih
    progah bi potrebovali dvotirnost vsaj od Ljubljane do Kamnika, Novega mesta, Kočevja,
    Kranja, Grosuplja, med drugim našteva Mes, ki v morebitni prihodnji konkurenci
    na potniškem delu vidi dobrodošlo spodbudo za izboljšanje vseh storitev.
  - Država in Unija z evropskimi nepovratnimi sredstvi sta doslej pri posodabljanju
    prog prednost namenjali glavnemu križu, ki se vklaplja v evropske koridorje. Katere
    proge bi morale zdaj priti na vrsto? Nujno je rešiti ljubljansko vozlišče, poudarja
    Mes. Zdaj gre ves tovorni promet skozi prestolnico. Tu je še omenjeni promet do
    Kranja (nujna dvotirnost) ali Kamnika (nujna prenova proge), vse bolj aktualno
    pa je vprašanje, kako skrajšati potovalne čase na relacijah Maribor–Ljubljana
    in Ljubljana–Koper. Ključno merilo za konkurenčnost železniškega prevoza je, da
    je po trajanju potovanja primerljiv s cestnim.
  - '"Ko bodo obnovitvena dela končana, bomo uvajali direktne vlake Novo mesto–Ljubljana
    in Maribor–Ljubljana s postankom v Celju. Izračunali smo, da se da priti na cilj
    v manj kot 90 minutah. Celo Zasavje je že danes konkurenčno," nadaljuje Mes. Če
    bi hoteli med prestolnico in Koprom ali Mariborom potovati eno uro, bi morali
    zgraditi nove železniške odseke.'
  - Največ jeze in ogorčenja med potniki je v preteklosti povzročal zaostanek za drugimi
    digitaliziranimi železnicami. Tako se je dogajalo, da na nekaterih progah vozovnice
    ni bilo mogoče plačati s kartico ali pa je bilo treba prek spleta kupljeno vozovnico
    celo natisniti.
  - Slovenske železnice so v digitalizacijo vložile 20 milijonov evrov, od tega v
    potniški promet pet milijonov. Generalni direktor napoveduje, da bo do konca prihodnjega
    leta digitalizacija primerljiva z avstrijsko ali nemško. Vse nakupe in rezervacije
    bo mogoče opravljati prek telefona, na voljo bodo podatki o vseh ponudbah, voznih
    redih, lokacijah vlakov, zastojih, zamudah, povezavah z avtobusnimi prevozniki,
    rezervacijskih sistemih na postajališčih za parkirišča in podatki o morebitni
    souporabi vozil (car sharing). Digitalizacija naj bi potekala skupaj z nakupom
    stoodstotnega deleža (zdaj znaša 50 %) avtobusnega prevoznika Nomago, ki bo med
    drugim dopolnjeval železniški prevoz. Nomago zaposluje približno 1200 ljudi in
    dosega 120 milijonov letnih prihodkov. Prihodki SŽ-ja znašajo približno 640 milijonov
    evrov, zaposlenih je 6900 sodelavcev, v zadnjem času so število povečali zaradi
    zaposlitve agencijskih delavcev. Od prevzema Nomaga je logično pričakovati sinergije.
  - Na vprašanje o nadaljnji nujnosti elektrifikacije prog direktor železnic odgovori,
    da je elektrificiran glavni železniški križ, druge proge pa po večini niso. Toda
    po njegovem mnenju izziv ni več elektrifikacija, sodobni vlaki na dizel (sploh
    pa na vodik) so enako zmogljivi in varčni. "Veliko večji okoljski učinek bo država
    dosegla, če bo nadgradila obstoječe proge in jih spremenila v vsaj delno dvotirne."
    To pomeni, da se dolgotrajno čakanje na elektrifikacijo ne izplača, namesto nje
    je treba čim več potnikov spraviti na tire. Železnice so kupile 52 Stadlerjevih
    potniških garnitur, od tega 21 dizelskih. V načrtu je nakup še dvajsetih vlakov.
  - Med pandemijo in po napadu Rusije na Ukrajino so se roki dobav vlakov podaljšali
    s treh na skoraj pet let. SŽ bo načrtovane vlake menda dobil v dveh letih. Se
    pa hitri obrati v gospodarski dejavnosti nedvomno razberejo iz tovornega prometa
    in dobavnih rokov za vlake. "Gospodarstvo se ohlaja, to opazimo po količini tovora
    na določenih relacijah. Pričakujemo, da se bodo v letih 2024 in 2025 razmere spremenile
    in bo več vagonov ter lokomotiv na voljo s krajšimi dobavnimi roki, ker gospodarstvo
    ne bo več raslo tako kot v preteklih letih."
  - Januarja 2022 je v lastništvo družbe SŽ-Tovorni promet z 49-odstotnim deležem
    vstopilo češko podjetje EPLI (EP Logistics International), ki ima v svoji skupini
    logistično divizijo. Dogovarjanje s Čehi in usklajevanje pogodbe sta bila dolgotrajna.
    "Po enem letu ocenjujemo, da je to partnerstvo dobro, predvsem pa tovornemu delu
    železnic omogoča vlaganja. Tovorni promet je družba, ki sicer v tem hipu posluje
    zelo dobro, dejstvo pa je, da je manko investicij zadnjih desetletij velik. Danes
    imamo načrt, kako do leta 2027 vložiti 300 milijonov evrov. Tovorni promet bo
    potreboval vsaj 30 novih lokomotiv, da bo sploh ostal konkurenčen. Treba bo kupiti
    vsaj 700 novih vagonov in čim prej izvesti prevzeme na Hrvaškem, v Srbiji, Italiji
    in Avstriji." Močan tovorni promet oziroma konkurenčnost na tem delu namreč narekuje
    uspeh železnic.
  - Dušan Mes med najtežja obdobja v svoji karieri prišteva lansko negotovost po eksploziji
    borznih cen električne energije. Železnicam se je iztekla triletna pogodba, po
    kateri so za elektriko plačevale približno 60 evrov/MWh. Poslovodstvo in ponudnik
    energije sta staro pogodbo podaljšala za tri mesece, letos zakupljena elektrika
    ima ceno 130 evrov/MWh, kar je ugodno v primerjavi z drugimi velikimi podjetji
    in panogami. Nekaj časa je bil strošek zelo negotov. "Če bi kupili elektriko po
    300 evrov, bi imeli v polletju vsaj za 60 milijonov višje stroške," pripoveduje
    gost podkasta. Mimogrede, nemška država bo letos za plačilo elektrike nemškim
    železnicam (Deutsche Bahn) namenila pomoč v vrednosti 1,1 milijarde evrov.
  - Poleg cen energentov so se zvišale tudi plače. Inflacija je namreč najbolj udarila
    zaposlene z nizkimi plačami. Tretjina zaposlenih na SŽ-ju (glede na izobrazbo
    in zahtevnost dela) prejema minimalno plačo, ki se je povečala za 12 odstotkov.
    V podjetju so lani plače povišali za šest odstotkov, julija letos naj bi jih še
    za tri odstotke.
  - 'Za kar nekaj dvigov obrvi pa je poskrbela plačana zdravstvena preventiva, ki
    je drugi zaposleni v državnih podjetjih niso deležni: to je pravica vsakih pet
    let do šest dni subvencioniranega zdravilišča. SŽ je tudi solastnik Term Olimia,
    ki v večini izvajajo te storitve, do njih so upravičeni delavci v operativi. Mes
    zagovarja boniteto z nižjim deležem bolniških odsotnosti in dejstvom, da je ugodnost
    ob nizkih plačah tisto, kar delodajalec še lahko ponudi zaposlenim, ki jih na
    nekaterih mestih tudi že primanjkuje.'
  - Železniški sindikati veljajo za ene najmočnejših in najbolj neustrašnih delavskih
    zastopnikov, ki so sposobni spodnesti katerega koli direktorja. Vendar pa v zadnjem
    desetletju v javnosti ni vidnih razpok oziroma prepirov. Mes pravi, da je napetosti
    med njim in sindikati sicer dovolj, vsak teden rešujejo probleme, v javnosti pa
    napetosti ne razkazujejo, ker bi s tem krnili ugled družbe in povzročali tudi
    poslovno škodo. "Odnos do mene je korekten," dodaja, vsi naj bi bili tudi osredotočeni
    na poslovanje in dobičkonosnost podjetja. Po njegovih besedah so drugod po Evropi
    na železnicah, v pristaniščih ali letalskih družbah sindikati enako zelo zahtevni.
  - Zakaj ni ravnal odločneje leta 2018, ko so v javnost prišli posnetki telefonskega
    pogovora, v katerem prvi sindikalist in nadzornik železnic Silvo Berdajs grobo
    žali delavca in mu grozi zaradi prestopa v drug sindikat? Mes, ki prizna, da bi
    tiste čase najraje hitro pozabil, pravi, da so ukrepali optimalno. Berdajs je
    takrat začasno izstopil iz nadzorniških funkcij. Glede strožjega ukrepanja pa
    se sprašuje, kaj bi v pravnem smislu sploh še lahko storili, še posebno če lahko
    sindikat vodi tudi nekdo, ki ne dela na železnicah.
  - Za konec še pogled na nesrečo pri Hrastovljah junija 2019. Poka tirnice, zaradi
    katerega je iztirjenje vlaka povzročilo izlitje več kot sedem tisoč litrov kerozina,
    se ni dalo predvideti, ker je bila tirnica pregledana v rokih, pogosteje, kot
    to določajo pravilniki, pripoveduje Mes. Prepričan je, da ni šlo za malomarnost.
    Kljub temu je SŽ spremenil interne pravilnike, da so pregledi prog in menjave
    elementov pogostejši. Koprski kriminalisti so sicer v zadevi podali štiri kazenske
    ovadbe.
  - V podkastu Srce bije za posel smo prvemu možu železnic zastavili tudi vprašanja
    o ljubljanskem potniškem centru, zaposlovanju političnih kadrov in sponzorstvih.
    Vabljeni k poslušanju.
