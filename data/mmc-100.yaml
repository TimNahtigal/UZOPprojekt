    img: https://img.rtvcdn.si/_up/upload/2023/12/06/66139874.jpg
    source: AP
  lead: 'Umrl je sloviti televizijski scenarist in producent Norman Lear, avtor serij,
    kot sta bili All in the Family in Sanford and Son; v žanr situacijske komedije
    je vključil politično noto in komentarje družbe. Star je bil 101 leto. '
  mention:
  - The Jeffersons
  - Good Times
  - Archie Bunker
  - The Jeffersons
  - Good Times
  - ' Rob Reiner'
  - George Clooney
  paragraphs:
  - Norman Lear je podobo ameriške televizije krojil v sedemdesetih in zgodnjih osemdesetih
    letih prejšnjega stoletja; znan je bil po serijah, ki so žanr humoristične nanizanke
    povezale s problematikami in težavami "resničnega sveta". Serija The Jeffersons
    je denimo popisovala ovire na karierni poti članov temnopolte družine; druga temnopolta
    družina, tista v seriji Good Times, se je spopadala z revščino in diskriminacijo.
    Protagonistka serije Maude je bila feministka brez dlake na jeziku, naslovna junakinja
    v seriji Mary Hartman, Mary Hartman pa se je spopadala s številnimi težavami tistega
    časa (in z lastno nevrotičnostjo).
  - '"Če si se v šestdesetih ozrl po televizijski pokrajini, je bila največja težava,
    ki je lahko doletela družino, to, da ''je mama opraskala avto in mora zdaj preprečiti,
    da bi oče to izvedel''. Ali pa: šef prihaja na večerjo, njej pa se je prismodila
    pečenka. Implicitno sporočilo vseh teh serij je bilo, da sploh nimamo resničnih
    težav, " je Lear razmišljal v intervjuju za The New York Times leta 2012.'
  - Archie Bunker, zoprni ameriški Slehernik Največji dosežek v njegovi karieri je
    bila nanizanka All in the Family oz. njen glavni lik Archie Bunker, ki se je razrasel
    v ikono ameriške televizije. Archie, ki ga je upodabljal Carroll O’Connor, je
    bil jezen, predsodkov poln možak, ki je kar naprej rentačil nad etničnimi manjšinami
    (in svojimi družinskimi člani) – a je bil zaradi svojega zmedenega načina govorjenja
    in entuziazma gledalcem tudi pri srcu. Archie je imel zelo močna mnenja o "subverzivcih",
    zajedavcih socialne podpore in "materah Terezah", enako rad pa je zmerjal svojo
    "avšasto" ženo, "cmerasto" hčerko in "butastega Poljaka", s katerim je bila ta
    poročena. Vse te izjave so bile za televizijo tistega časa škandalozne in več
    kritikov je serijo raztrgalo – a pri občinstvu se je izkazala za uspešnico.
  - '"Nikoli nisem spoznal človeka s predsodki, na katerem ne bi bilo tudi česa prisrčnega,"
    je na to temo nekoč dejal Lear, ki je lik delno oblikoval po svojem očetu.'
  - Serija All in the Family je bila na sporedu od leta 1971 pa vse do 1979 in večino
    tega časa preživela na vrhu lestvic gledanosti. Njen glavni dosežek je bil, da
    je vzpostavila format TV-komedije, ki je v humor vpletla politične in družbene
    problematike ter druga resna vprašanja. Isto idejo sta nadgrajevali tudi seriji,
    zgrajeni okrog posameznih likov iz All in the Family, Maude in The Jeffersons.
  - Med Learove uspešnejše projekte lahko štejemo še serije Sanford and Son (1972–1977),
    One Day at a Time (1975–84) o materi samohranilki z dvema najstniškima hčerkama
    in Good Times o materi, ki je svojo družino vzgajala v revni soseski.
  - Bil je tudi izvršni producent filmskih klasik, kot sta The Princess Bride in Fried
    Green Tomatoes, za scenarij filma Divorce American Style pa je bil nominiran za
    oskarja.
  - Lear je bil dejaven še dolgo po devetdesetem rojstnem dnevu, med drugim s podkastom
    All of the Above with Norman Lear. Vse življenje je bil dejaven podpornik različnih
    liberalnih kampanj in pobud; ustanovil je tudi zagovorniško skupino People for
    the American Way.
  - Ob smrti so se mu poklonili številni zvezdniki, tudi Rob Reiner ("Ljubil sem ga
    z vsem srcem, bil mi je kot drugi oče") in George Clooney. "Težko se je sprijazniti
    s tem, da je Norman Lear pri 101 letu odšel prezgodaj. Svet zdravega razuma je
    izgubil svojega najglasnejšega zagovornika in naša družina je izgubila dobrega
    prijatelja," je Clooney zapisal v izjavi za javnost.
  title: Umrl je legendarni producent Norman Lear, ki je spremenil podobo humoristične
    nanizanke
