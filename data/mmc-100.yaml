  mention: []
  paragraphs:
  - Predlog državnega proračuna za leto 2026 je vlada skupaj s predlogom sprememb
    proračuna za leto 2025 poslala v obravnavo v DZ konec septembra. V njem je predvidela
    15,9 milijarde evrov prihodkov ter 17,1 milijarde evrov odhodkov. Proračunska
    poraba bo tako za 1,2 milijarde evrov višja od prihodkov, kar predstavlja 1,6
    odstotka bruto domačega proizvoda.
  - V preteklih tednih so se s temi načrti seznanila delovna telesa DZ-ja, nato pa
    se je gradivo vrnilo v obravnavo vladi, da bi se opredelila do vloženih dopolnil
    ter na podlagi teh opredelitev in zadnjih analiz gospodarskih gibanj in realizacije
    državnega proračuna za tekoče leto pripravila dopolnjen predlog državnega proračuna.
  - To je storila na današnji dopisni seji. Kot so po seji sporočili z ministrstva
    za finance, bo ministrstvo za vzgojo in izobraževanje v svojem finančnem načrtu
    zagotovilo dodatne pravice porabe za štipendije za pedagoške poklice, hkrati pa
    bo za 750.000 evrov znižalo sredstva za podporne dejavnosti na področju izobraževanja
    in športa.
  - S tem se bo omogočilo povečanje števila razpisanih štipendij s 100 na 300, mlade
    pa motiviralo za odločitev za učiteljski poklic.
  - Ob tem je vlada zavrnila vsa vložena dopolnila, so dodali na ministrstvu.
  - DZ naj bi proračun za leto 2026 kot tudi spremembe proračuna za leto 2025 sprejel
    na redni novembrski seji.
