  lead: V Avstriji je srečnežu uspel doslej najvišji dobitek v loterijski igri Euromillions
    – v žrebanju v petek zvečer je dobil kar 250 milijonov evrov. Obenem je ta dobitek
    največji loterijski "jackpot" v Avstriji doslej.
  mention: []
  paragraphs:
  - Kot so sinoči sporočili z avstrijske loterije, je srečnež v petek zvečer zadel
    250 milijonov evrov, kar je najvišji dobitek, ki je bil kdajkoli podeljen v igri
    EuroMillions. Od štirih odigranih stav srečneža je zadnja prinesla večstomilijonski
    dobitek. Dobitnik, ki je za loterijski listek plačal deset evrov, je podrl tudi
    avstrijski rekord iz leta 2023, ki ga je do pred kratkim imela loterijska igra
    Europot. Zanimivo, prejšnji avstrijski rekorder je za dobitno kombinacijo potreboval
    20 loterijskih kombinacij, ki so mu takrat prinesle 240 milijonov evrov.
  - Le nekaj mesecev prej, avgusta 2023, je kar 38 igralcev zadelo Europot, ki je
    takrat znašal 72 milijonov evrov, tako je v enem krogu žrebanj Avstrija postala
    bogatejša za kar 38 milijonarjev. Doslej so v igrah EuroMillions in Europot Avstrijci
    glavni dobitek zadeli 19-krat.
  title: 'Loterijska sreča: Avstrijec zadel kar 250 milijonov evrov'
