    je z 8:4, gostje pa so jih ulovili (10:9). Z delnim izidom 10:1 so zmaji povedli
    za deset točk (20:10). Prepelič je s podajo lepo zaposlil Karla Matkovića, ki
    je še drugič na tekmi atraktivno zabil (22:12).
  - V drugi četrtini je ljubljanska ekipa nadaljevala z dobro igro, kar je pripeljalo
    do naskoka 16 točk (45:29). Prednost so zmaji ohranjali (47:31) in jo tudi povišali
    na +18 (51:33).
  - Olimpija je v tretji četrtini vodila za 14 točk (53:39; 55:41; 57:43). Gostje
    so se z delnim izidom 2:11 približali zmajem (59:54). SC Derby je še naprej manjšal
    zaostanek (62:59). Klemen Prepelič je zadel trojko, Luka Ščuka pa za dve in Olimpija
    je znova povedla z višjo prednostjo (67:59). Ob vstopu v zadnjo četrtino je ta
    znašala +9 (72:63).
  - Gostje so v zadnji četrtini "oživeli" Ta je hitro skopnela, gostje so izenačili
    (76:76) in tudi prvič na tekmi povedli (76:78). Jaka Blažič je bil natančen pri
    izvajanju prostih metov za prevzem vodstva (80:78). Izid je bil znova izenačen
    (80:80). Olimpija je odgovorila z delnim izidom 5:0 (85:80). Prepelič je polagal
    za +7 (89:82). Za sedem so zmaji vodili tudi slabi dve minuti pred koncem (91:84).
    Gostje so znova zadeli za tri, a Ljubljančani so bili še naprej zanesljivi pri
    izvajanju prostih metov, tako da so prednost ohranili (93:87). Prepelič je zgrešil
    trojko, a pod košem je bil najvišji Shawn Jones, ki je poskrbel za Olimpijinih
    +8 (95:87). Gostje so 33 sekund pred koncem zaostajali za 5 (96:91). Blažič je
    s še dvema zadetima prostima metoma olajšal končnico tekme (98:91). Dva prosta
    meta ja zadel še Prepelič in stotica je bila dosežena (100:91) ter presežena (102:93).
