  url: https://www.rtvslo.si/slovenija/umetnost-moznega/igra-vlade-se-ni-izgubljena/693009
  topics: slovenija
  authors:
  - Aleš Kocjan
  - Tanja Starič
  date: '2023-12-28T09:26:31'
  figures:
  - caption: 'Foto: Radio Slovenija'
    img: https://img.rtvcdn.si/_up/upload/2023/12/28/66145530.jpg
    source: ''
  lead: '"Opozicija je navalila radikalno, a verjetno malce prezgodaj. Čeprav strokovnjaki
    za javno mnenje pravijo, da trendov po takem padcu ni več mogoče obrniti, jih
    Golob po mojem še lahko," razmišlja Janez Markeš, kolumnist Delove Sobotne priloge. '
  mention:
  - Janez Markeš
  - ' Robert Golob'
  paragraphs:
  - Janez Markeš meni, da je majhna verjetnost za javnomnenjski preobrat, a možnost
    vidi predvsem zaradi družbenih vidikov, ki so jih mnogi že odpisali, premier Robert
    Golob pa je po njegovih besedah dobil zadolžnico, da jih reši. "Gre za ohranitev
    javnega prostora. Temu se še ni odpovedal, čeprav je dajal tak vtis – z imenovanjem
    Danijela Bešiča Loredana še posebej. Ves čas vzbuja vtis, kot da hoče slišati
    civilno družbo, ki mu je pomagala do zmage na volitvah. Ta civilna družba pa je
    z radikalnim padcem javnomnenjske podpore pokazala, ne da ga je odpisala, ampak
    da je nad delom vlade povsem razočarana in da naj se zresni. Igra vlade še ni
    izgubljena," razmišlja Delov kolumnist. Kar je po njegovih besedah najpomembneje,
    je vnovična vzpostavitev javnega zdravstvenega sistema. "Sistem, ki ga skuša zdravniški
    lobi vzpostaviti, je kopija ameriškega sistema, ki je najslabši na svetu, kjer
    imajo paradoksalno najboljšo medicino in najslabši zdravstveni sistem."
  - 'Zato je ohranitev javnega zdravstva po njegovem mnenju najpomembnejša tema, "kajti
    Slovenija stoji kot država ali nacija na specifiki kulture in solidarnosti kot
    sociale. Vse ostalo je odhajanje v amorfno gmoto." Markeš spominja, da družbe
    vzpostavljajo odločitve "v polju morale, ki cilja v dogovor" : "Država ni nič
    drugega kot dogovor o tem, kaj je prav in kaj narobe. In to je zapisano v ustavi,
    v kateri eksplicitno piše, da smo demokratična, pravna in socialna država. To
    slednje sistematično vsi ignorirajo in se delajo, kot da to ni problem, čeprav
    postajamo vsi skupaj amorfna gmota in mnogi v tem spregledajo, da kar jim danes
    koristi, jim lahko jutri škoduje."'
  - Pri obrambi javnih prostorov po Markeševih besedah ne gre le za Slovenijo, gre
    tudi za Evropo, ki je na pragu novih volitev, pred katerimi sogovornik napoveduje,
    da bomo doma v glavnem opazovali, koliko glasov bo dobila posamezna stranka, ne
    pa tega, kateri idejni ali nazorski koncept bo prevladal. Pričakovati je tudi,
    da bodo razpravo v kampanji zaznamovale migracije – te bodo definirale Evropsko
    unijo, ki je prisiljena v rahlo desni obrat predvsem zaradi tega, kar se dogaja
    na Bližnjem vzhodu.
  - '"V težavah smo, ker so Združene države odpovedale, saj so s svojimi 500 projektili,
    ki jih je Izrael izstrelil na Gazo, pospeševalec genocida. Več kot 6000 otrok
    je mrtvih. O spoznanjih mednarodne skupnosti, da je treba tam vzpostaviti dve
    državi, ni ne duha ne sluha. Celoten svet skuša v OZN-u doseči neko racionalno
