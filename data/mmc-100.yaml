  paragraphs:
  - Nasini inženirji so odštevanje pripeljali vse do minus 40 minut in ga nato nenačrtovano
    ustavili. Glavni krivec so bile težave z motorjem RS-25 na srednji stopnji, ki
    se ni ohladil na delovno temperaturo. Motorje hladijo s pretokom ohlajenega vodika
    in kisika, a tok skozi motor številka 3 ni bil zadosten. Najprej so inženirji
    poskusili z zaprtjem ventilov ostalih motorjev, nato s povečanjem tlaka v rezervoarju
    vodika srednje stopnje. Ni delovalo, zato je vodja izstrelitve Charlie Blackwell-Thompson
    današnjo izstrelitev odpovedala.
  - Raketa je bila skoraj povsem napolnjena s tekočim kisikom in tekočim vodikom.
    Ne bodo je takoj izpraznili. Inženirji bodo namreč še nekaj časa opazovali dogajanje
    in poskušali zbrati čim več podatkov.
  - Naslednje izstrelitveno okno je v petek, 2. septembra. A ni nujno, da bo obveljalo.
    To bo odvisno od uspešnosti popravil motorja številka 3, je sporočila Nasa. Še
    eno dogledno izstrelitveno okno bo 5. septembra. Raketa bo nanje počakala na izstrelišču,
    razen, če ne bo potrebna vrnitev v delavnico (VAB). V tem primeru bo izstrelitev
    oktobra ali še kasneje.
  - Tovrstne težave so na prvi izstrelitvi tako kompleksne naprave, kot je raketa
    SLS, pričakovane. A prav ta zaplet z motorjem je posledica nekoliko kontroverzne
    odločitve Nase. Raketa SLS je namreč pred mesecem dni šla skozi t. i. mokro vajo
    (ang. wet dress rehearsal). Pripeljali so jo na izstrelišče, povezali s talno
    infrastrukturo, napolnili s pogonskimi sredstvi in poskušali pripeljati odštevanje
    do zadnjih sekund, natančneje, do prižiga motorjev. To jim ni uspelo zaradi puščanja
    vodika. Zato tudi niso v polnosti izvedli nekaterih postopkov, povezanih s hlajenjem
    motorjev na delovno temperaturo.
  - Malo po 12. uri po našem času je predstavnik Nasinega nadzornega središča sporočil,
    da je bila odkrita razpoka na prirobnici notranjega rezervoarja srednje stopnje.
    Na prirobnici se nabira ivje, iz nje puha ledena meglica. Zadeva pa se je hitro
    razrešila. Dobro uro kasneje so sporočili, da gre zgolj za razpoko v termoizolaciji,
    vsem dobro vidni oranžni peni, in ne na rezervoarju. Ivje je nastalo zato, ker
    v razpoko v peni vdira zunanji zrak, vlaga pa kondenzira in zamrzne.
  - 'Video : Posnetek poskusa izstrelitve'
  - 'Video 2 : Posnetek brez Nasinega komentarja'
  - Po 50 letih gre spet zares. Na izstrelišču št. 39B Cape Canaverala čaka raketa,
    kakršne ni bilo desetletja. Nanjo je poveznjena vesoljska ladja, ki bo obletela
    Luno, šla dlje kot katera koli druga vesoljska ladja za prevoz posadke v zgodovini,
    in se vrnila na Zemljo. Kdor je desetletja čakal, da se bo sen nadaljeval, da
    se človeštvo spet zazre proti Luni in Marsu, je učakal svoj čas.
  - Napeto je. Več kot 40 milijard dolarjev, 15 let razvoja, političnih bojev, spletk,
    sanj je uperjenih vanj. Pravzaprav bo na tnalu kar ameriška paradigma o raziskovanju
    vesolja. Ta polet mora uspeti, sicer se lahko mogočna raketa SLS vrne v zgodovino,
    še preden je vanjo zares vstopila, in to skupaj s snom o dogledni vrnitvi človeka
    na Luno.
  - 'je namreč prva v zaporedju vse zahtevnejših odprav človeka zunaj neba Zemlje.
    V okviru programa Artemis se bo človek vrnil na Luno, na njej postavil manjše
    oporišče, pri njem lunarno vesoljsko postajo. In ne le to: pri Luni bo sestavil
    večjo vesoljsko ladjo, ki bo po napovedih Nase v prihodnjem desetletju popeljala
    človeka do Marsa in nazaj. Za to bo morala raketa SLS danes delovati. Če odpove,
    se lahko zamaje celoten sistem politične in civilne podpore, podobno, kot se je
    zgodilo programu Apollo.'
  - In to se lahko zgodi. To bo prva izstrelitev edinstvene, visoko kompleksne naprave.
    Možnost odpovedi je oprijemljiva. Nikoli ne bi bilo dovolj preizkušanj, priprav,
    tuhtanja, da bi nevarnost popolnoma odpravil i. "Ta misija je zelo tvegana [...]
    Pomembno je, da se zavedamo, da gre za testni polet," je pred nekaj dnevi Nasin
    direktor za vesoljske polete zunaj Zemljine orbite Jim Free.
  - Sploh pa "raketna znanost" ni brez razloga sopomenka visoke zahtevnosti. "To so
    kompleksni sistemi, zgrajeni tako, da se tolerance približajo mejam zmogljivosti
    materiala. Popolna izstrelitev ali popolna raketa ne obstaja. Vedno imamo diskrepance,
    težave, zagate," je na svojem blogu veteranski vodja poletov Wayne Hale.
  - Za boljšo predstavo dogodka razložimo. To ni zgolj štetje časa do izstrelitve.
    Je natančno koreografiran postopek, v katerem vse sisteme dodobra preverijo in
    pripravijo na delovanje, rezervoarje napolnijo z gorivom, počasi ohladijo pogonske
    sisteme na delovno temperaturo, raketo in vesoljsko ladjo preklopijo na notranje
    napajanje ter nasploh budno pazijo, da gre vse po načrtu. Redko dejansko gre.
    Pričakujemo lahko vsaj prgišče prekinitev odštevanja, da se sproti odkrite težave
    odpravijo.
  - Zares napeto bo postalo 33 sekund pred izstrelitvijo. Takrat se bo začelo gosto,
    računalniško nadzorovano zaporedje dogodkov. Opazovalcem bo vse skupaj minilo,
    kot bi mignil, a vsako dejanje je zelo pomembno. 15 sekund pred izstrelitvijo
    se bo začelo zalivanje velikih količin vode pod vznožje rakete, da se infrastruktura
    zaščiti pred vročino, pa tudi zmanjša hrup.
  - Na minus 12 sekundah bomo lahko pod motorji uzrli oblak žarečih delcev. To je
    pirotehnika. Žareči delci kovine bodo sproti prižgali odvečen vodik, ki se nabira
    pod raketo, in tako preprečili neželeno eksplozijo, ki lahko poškoduje motorje.
    Prizor bo zelo podoben tistim iz časa Space Shuttlov. SLS je namreč osnovan ravno
    na tehnologiji Vesoljskih čolničkov, zato je postopek izstrelitve podoben.
  - Na minus 10 sekundah bo računalnik začel zapleten postopek prižiga štirih motorjev,
    pravzaprav recikliranih motorjev SSME, ki so že pognali omenjene Space Shuttle
    v vesolje. Najstarejši med njimi je prvič letel že leta 1998. Na minus 6,36 sekunde
    se bodo motorji en za drugim koreografirano prižgali, toda raketa še ne bo poletela.Motorji
    RS-25 se namreč ne zaženejo nemudoma in potrebujejo pet sekund, da se pravilno
    zaženejo in dosežejo 100-odstotno moč. To se bo zgodilo sekundo pred izstrelitvijo.
    Tudi takrat se SLS ne bo dvignil. Masa celotnega sestava rakete, vesoljske ladje
    in goriva bo namreč presegla ton, srednja stopnja s štirimi motorji RS-25 pa zmore
    slabih tisoč ton potiska. Brez pomoči bi vse skupaj nasedlo na Zemlji.
  - Prava predstava se bo začela ob času 0. Takrat se bosta prižgala mogočna stranska
    potisnika () na trdo gorivo in v drobcu sekunde dosegla polno moč. Žene ju trdo
    gorivo in sta dve veliki "petardi", ki ju po prižigu ni mogoče ugasniti. Zagotovila
    bosta kar 75 odstotkov od skoraj 4000 ton (39,1 meganewtona) potiska ob vzletu,
    njuna bogato rumena plamena bosta popolnoma presvetlila štiri vodikove. A v nasprotju
    z Ariane 5, ki smo jo gledali ob lanski Jamesa Webba, dvig ne bo tako hiter. Ariane
    5 je v nekaj sekundah prečila izstrelitveni stolp. Masivni SLS bo pospeševal počasneje,
    potreboval bo celih sedem sekund, da se bo dvignil nadenj s hitrostjo "samo" 127
    kilometrov na uro.
  - Prvi del poleta bo za raketo najnapornejši, še vedno bo nosila večino goriva in
    se prebijala skozi najgostejši del ozračja. Kljub temu bo hitro pospeševala –
    raketi rečejo tudi nadzorovana eksplozija – in pri tem kurila tone goriva vsako
    sekundo. Med 70 in 90 sekundami se bo s hitrostjo 1700 kilometrov na uro prerinila
    skozi območje največjega stresa zaradi aerodinamičnih sil. Stranska potisnika
    bosta samodejno, zaradi notranje postavitve goriva, začasno zmanjšala potisk,
    in ga pozneje spet povečala. Po 2 minutah in 12 sekundah oziroma na višini 48
    kilometrov bosta porabila večino goriva – skupaj ga imata več kot 1200 ton. Postala
    bosta odvečna masa, zato se ju bo treba znebiti.
  - Nekoliko olajšana srednja stopnja bo nadaljevala pot skozi vse pojenjajoče ozračje
    in naposled dosegla točko, ko bo lahko odvrgla tudi Orionove zaščitne panele,
    pa še motor za pobeg v sili. Ta je na konici Oriona in bi se prižgal, če bi šlo
    med izstrelitvijo kaj hudo, hudo narobe, ter urno potegnil vesoljsko ladjo stran
    od katastrofe.
  - 'Video 3 : Animacija izstrelitve'
  - 'Video 4 : Za boljšo vizualizacijo uvoda izstrelitve je na voljo posnetek prižiga
    rakete, pritrjene na betonsko stojalo (od 51.00 naprej)'
  - Ogromna srednja stopnja – po trditvah Nase je največja posamezna raketna stopnja
    v zgodovini – bo gorivo porabila po osmih minutah, ugasnila in padla proti morju.
    Orbita bo takrat oblike 1,806 krat 30 kilometrov, zato se bo srednja stopnja v
    ozračje vrnila samodejno. (Dodaten upočasnitveni prižig srednje stopnje ne bo
    potreben, saj je, površju najbližja točka orbite, globoko v ozračju.)
  - Orion bo nadaljeval pot skupaj z zgornjo stopnjo, pravzaprav nekoliko prilagojeno
    drugo stopnjo rakete. Po 18 minutah bo raztegnil štiri panele sončnih celic. Tudi
    to dejanje je kritično, brez tega ne bo proizvodnje električne energije. (Stare
    vesoljske ladje Apollo so imele vodikove.) Še vedno pa ne bo v primerni tirnici
    – če bi tako nadaljeval, bi se tudi sam vrnil v ozračje. Zato se bo ICPS prižgal
    za 22 sekund in odvrnil nevarnost.
  - 'Nato bo nadzorno središče pred pomembno nalogo: smo pripravljeni? Preverilo bo
    vse sisteme in sprejelo odločitev, kakršno so njega dni sprejemali nadzorniki
    odprav Apollo: čas je odhod proti Luni! Manever, poimenovan TLI (), v tem primeru
    pomeni prižig motorja druge stopnje za točno 17 minut in 59 sekund, začenši z
    1 uro, 38 minutami in 3 sekundami v misiji. S tem se bo hitrost povečala z 28.000
    kilometrov na uro na 36.400 kilometrov na uro. Če bo manever uspešen, se bo vesoljska
    ladja prvič po 50 letih odpravila proti Mesecu. Ker so razdalje ogromne, bo dan
    zaokrožen s prvim popravkom trajektorije 7 ur, 56 minut, 5 sekund v misijo. Orion
    bo prvič prižgal lastni motor, tudi recikliran s programa Space Shuttle: tam je
    bil za pogon v vakuumu.'
  - ICPS bo predtem 10 manjših satelitov (j).
  - Orion bo do Lune prispel šele čez šest dni. Najbolj se ji bo približal pri 97
    kilometrih. Utiril se bo v, katere od Lune najbolj oddaljena točka bo 64.000 kilometrov,
    od Zemlje pa 450.000 kilometrov. To je še dlje od, ki je dosegel "samo" 400 tisoč
    kilometrov, poudarja Nasa in dodaja, da je to najbolj oddaljena pot vesoljske
    ladje za prevoz posadke v zgodovini. (Vprašanje je sicer, kako obravnava odprave,
    ki je v heliocentrični orbiti.) Orion bo več kot dobra dva tedna krožil okoli
    Lune in preizkušal sisteme v pripravah na naslednjo misijo, ki bo s posadko. Za
    vrnitev proti Zemlji bo še enkrat blizu obletel Luno in izkoristil njeno energijo
    za pospešek.
  - V Zemljino ozračje bo vstopil s 40.000 kilometri na uro, se od njega enkrat odbil
    in nato planil proti tlom. Zaviral bo s trenjem, pri čemer se bo toplotni ščit
    ogrel na 2800 stopinj Celzija. Tako se bo upočasnil na 480 kilometrov na uro.
    Nato se bo odprl par stabilizacijskih padal in hitrost pripeljal do 160 kilometrov
    na uro. To je še vedno daleč preveč za varen pristanek, zato bodo delo prevzela
    tri glavna padala. Orion bo pri 32 kilometrih na uro padel v Tihi ocean poleg
    ameriškega mesta San Diego.
  - V Orionu ne bo posadke, zato tudi ne bo sistema za vzdrževanje življenju primernih
    razmer. Bodo pa tri lutke zaznavale sevanje, tresljaje in pospešek (,). V Orionu
    je skupaj več kot tisoč senzorjev.
  - 'Video 5 : Animacija celotne misije'
  - SLS ali Space Launch System (SLS) je dvostopenjska supertežka nosilna raketa.
    Visoka je 98 metrov. Ob izstrelitvi ustvari 39,1 mega oziroma štiri tisoč ton
    potiska, kar je več kot vse ameriške rakete doslej, 15 odstotkov več od starega
    in 20 odstotkov več kot sistem.
  - (core stage) je po navedbah Nase največja posamezna raketna stopnja v zgodovini.
    Visoka je 65 metrov in 8,4 metra široka in s tem precej podobna rezervoaru za
    gorivo Space Shuttlov. Večino prostornine zavzemata rezervoarja za tekoči vodik
    in tekoči kisik. Poganjajo jo štirje motorji RS-25, reciklirani in nadgrajeni
    primerki s prejšnjih izstrelitev Space Shuttlov (te so poganjali trije motorji).
    Posamezen RS-25 ustvari 2,281 meganewtona oziroma 233 ton potiska. Med spajanjem
    vodika in kisika ustvarja vodno paro, ki iz šobe leti s hitrostjo 16.000 kilometrov
    na uro. Srednja stopnja vsebuje tudi avioniko (računalniško opremo za samodejno
    izvedbo poleta).
  - Motorji RS-25 so narejeni za večkratno uporabo. Iz programa Space Shuttle jih
    je ostalo za štiri izstrelitve SLS-ov. Nasa in proizvajalec, Aerojet Rocketdyne,
    sta sklenila pogodbo za proizvodnjo novih, prilagojenih za en polet in posledično
    cenejših, pa tudi zmogljivejših.
  - SLS lahko v tej različici proti Luni pošlje 27 ton. V načrtu sta dve večji nadgradnji
    z zmogljivejšo zgornjo stopnjo in stranskimi potisniki, ki bosta zmogli najprej
    42, nato 46 ton.
  - Na straneh srednje stopnje sta 5-delna stranska potisnika (, Solid Rocket Booster).
    Visoka sta 64 metrov in široka 3,6 metra. Skupaj proizvedeta 32 meganewtonov oziroma
    3260 ton potiska, kar je več kot tri četrtine vsega potiska v prvih dveh minutah
    poleta. Za to na sekundo pokurita šest ton trdega goriva (polibutadien akrilonitril).
    Po navedbah Nase sta največja in najsilnejša potisnika na trdo gorivo v zgodovini.
    Proizvaja jih ameriška družba Orbital ATK, del Northrop Grummana.
  - Z notranjo postavitvijo goriva nadzorujejo potisk na določeni stopnji poleta in
    ga tako med največjim aerodinamičnih stresom zmanjšajo, nato spet povečajo.
  - Tudi segmenti stranskih potisnikov so dediščina Space Shuttlov. Takrat so bili
    opremljeni s padali in po poletu znova uporabljeni. Space Shuttli so imeli 4-segmentne
    SRB-e. Dodaten segment pri SLS-u ne pomeni daljšega gorenja, zagotavlja pa več
    potiska.
  - 5-segmentna različica je bila pripravljena in tudi preizkušena že davno pred SLS-om,
    saj je bila del programa (Konstelacija) pod predsednikom ZDA Georgeem W. Bushem.
    Bila je osnova rakete, ki je poletela samo enkrat.
  - Nasa ima dovolj segmentov za osem misij Artemis, nato bodo prešli na novejše tehnologije,
    pravzaprav stranske potisnike na osnovi nesojene rakete (Northrop Grumman).
  - SRB-i niso zgrajeni v enem kosu, ker jih po ZDA prevažajo po železnici.
  - Vesoljska ladja Orion spominja na stare Apolle, a je večja in modernejša. Prostora
    ima za šest članov posadke, ki lahko v njej letijo do 21 dni (zaradi omejitev
    sistemov za vzdrževanje življenju primernih razmer). Je trenutno edina vesoljska
    ladja, ki lahko pošlje ljudi na potovanja zunaj Zemljine orbite.
  - Sestavljena je iz treh glavnih elementov. Prvi je modul za posadko (crew module).
    Je pet metrov širok in tri metre visok in ima za skoraj polovico več prostornine
    od poveljniškega modula Apolla. Masa z gorivom vred znaša 10,4 tone. Pohvali se
    lahko tudi s straniščem, medtem ko so astronavti Apolla potrebo opravljali v (kar
    je pripeljalo do). Modul za posadko je večkrat uporaben. Prvi testni polet je
    bil leta.
  - Drugi sestavni del je (European Service Module). Glavni izvajalec je, podizvajalci
    so v desetih evropskih državah. Velik je štiri metre, masa znaša 13,5 tone. Zagotavlja
    proizvodnjo 11 kilovatov električne energije s štirimi paneli sončnih celic, vsebuje
    rezervoarje kisika in pogonskih sredstev, 32 manevrirnih potisnikov in glavni
    motor s 26.6 kilonewtona oziroma 2,7 tone potiska. Slednji je letel na 19 misijah
    Space Shuttlov. Motor je izbrala Nasa (oziroma posredno ameriška politika), nanj
    pa letijo kritike zaradi šibkosti. (Apollo je uporabljal več kot trikrat močnejši
    AJ10-137).
  - Evropski prispevek k programu Artemis je nadomestil del sredstev, ki bi jih morala
    Esa prispevati k programu Mednarodne vesoljske postaje (MVP).
  - Evropski podporni modul je nastal iz evropske vesoljske ladje, ki je oskrbovala
    MVP.
  - Tretji sestavni del je, bel stolp na vrhu. Vsebuje motor na trdo gorivo, ki se
    – če gre med izstrelitvijo nekaj zelo narobe – sproži v tisočinkah sekunde. S
    potiskom 1,8 tone povleče vesoljsko ladjo stran od katastrofe, denimo razpadajoče
    rakete.
  - 'Video 6 : Animacija delovanja sistema za pobeg'
  - Program Artemis je izid desetletij političnih preigravanj, boja za denar in iskrenih
    želja po obuditvi Apollovega sna.
  - Ljudje so doslej šestkrat hodili po Mesecu. Vse to se je dogajalo med letoma 1969
    in 1972. Decembra letos bo minilo točno 50 let, odkar je poslednjo človeško stopinjo
    na Luni pustil astronavt, in sicer na odpravi Apollo 17. Ameriška politika je
    program ukinila zaradi stroškov in drugih prioritet, denimo vojne v Vietnamu.
    Apollova generacija se je počutila izdano, po izjemnem naporu in premagovanju
    zahtevnih tehničnih ovir je dobila košarico. Astronavti so dotlej mislili, da
    je Luna le prvi korak, da bodo že v 80. letih osvajali Mars. Sanje so se razblinile.
    Poleg zgoraj omenjenih stroškov je bilo na delu tudi domoljubje, del politike
    in Nase ni bil navdušen nad tem, da so raketo Saturn V osnovali Nemci pod vodstvom.
    Želeli so proizvod domače pameti, obenem pa precej cenejše vesoljsko plovilo,
    ki bo večkrat uporabno in bo letelo po več desetkrat na leto.
  - Tako je nastal program Space Shuttle. Snovati so ga začeli že med Apollom in tako
    razvili številne tehnologije, ki so v uporabi še danes (prav na raketi SLS). Toda
    Space Shuttle ni izpolnil vseh pričakovanj. Ni bil poceni, letel je le nekajkrat
    na leto in bil v središču dveh odmevnih nesreč. Njegovi snovalci so sicer, da
    bi ga morala Nasa razvijati v nove, učinkovitejše različice, da je program finančno
    podhranjen in da sta bili nesreči v temelju posledici človeškega dejavnika. A
    ni zaleglo, po nesreči raketoplana Columbia leta 2003 je padla odločitev, da se
    program ukine. In tu se začenja zgodba SLS-a.
  - Program Space Shuttle je zagotavljal veliko dobro plačanih delovnih mest po ZDA,
    ki bi ob ukinitvi izpuhtela. Ne le to, v zgodovino bi šlo tudi pridobljeno tehnično
    znanje, t. i. know how, in proizvodne kapacitete, vzpostavljene skozi desetletja.
    Točno tako, kot so izpuhtele po ukinitvi Apolla in Saturna V. Nezadovoljni so
    bili tako nekateri ameriški senatorji, ki so doživljali bes lokalne volilne baze,
    kot številni ljubitelji raziskovanja vesolja, ki so se bali novega mrtvila.
  - 'In tako je bil pod predsednikom Georgeem W. Bushem napisan program Constellation.
    Bil je velikopotezen: predvideval je oskrbovanje Mednarodne vesoljske postaje,
    pristanek na asteroidu, vrnitev na Luno in človeka na Marsu. Vse to z enovito
    opremo. Stranski potisnik Space Shuttlov je dobil še en segment in postal raketa.
    Z njo bi izstreljevali nove vesoljske ladje Orion, tako za odprave na MVP kot
    za lunarne in marsovske. (Orion je tako v razvoju že več kot 15 let.) Glavni rezervoar
    Space Shuttlov bi predelali in povečali v prvo stopnjo ogromne rakete, uporabili
    pa bi ali pet motorjev RS-25 ali pa šest motorjev (oboje proizvaja Aerojet Rocketdyne).
    Ares V bi zmogel kar 188 ton v nizkozemeljsko orbito in z velikim naskokom postal
    najzmogljivejša raketa vseh časov. In vse to pretežno z delovnimi mesti programa
    Space Shuttle.'
  - 'Program Constellation je imel isto hibo kot Apollo, a še za razred velikosti
    večjo. Ceno. Leta 2010, po nastopu novega predsednika ZDA Barracka Obame, je bil
    zato ukinjen. Ljubitelji vesolja in senatorji so ponovno zagnali vik in krik,
    pričakujoč novo mrtvilo. In tako je nastala raketa SLS. Zelo poenostavljeno: iz
    sestava Space Shuttle odstrani raketoplan, njegove motorje vgradi v podnožje rezervoarja
    za gorivo, zgolj povečaj stranske potisnike. Črtaj raketo Ares I in vesoljsko
    ladjo Orion posadi neposredno na SLS. Volk sit in koza cela.'
  - Tudi ta načrt ni idealen. Zakaj? Ker so se razmere v vesoljski industriji po letu
    2011, ko je bil osnovan, precej spremenile. Številni so začeli razmišljati o tehnologijah
    novega tisočletja. Mislili so na večkrat uporabne rakete in rezervoarje goriva
    v orbiti, ne na dediščino Apolla in Space Shuttlov. V Nasi in v kongresu so se
    bili politični boji. Zmagala je preizkušena preteklost.
  - 'Prvi Nasin vodja poletov, legendarni Chris Kraft, je že tedaj zmajal z glavo
    in izgovoril preroške besede: SLS bo požrl Naso pri živem telesu. Stroški bodo
    visoki, frekvenca letenja enkrat na nekaj let, doseženega bo malo. To se je tudi
    zgodilo. SLS, ki bi se moral v nebo prvič pognati leta 2016, gre na prvi preizkus
    šele zdaj, naslednji polet pa bo šele leta 2024. Do lani je bilo za razvoj in
    izdelavo porabljenih 21 milijard dolarjev, in še dodatnih 21 milijard za Orion.'
  - 'Podporniki pa po drugi strani opominjajo, da je bilo za SLS porabljenega precej
    manj denarja kot za primerljivi Saturn V in da gre za enkraten projekt, ki mu
    v zadnjih desetletjih ni para (... oziroma mu ni bilo para do pred nekaj let).
    Takšni projekti pač ne morejo biti poceni. Ponujajo še en razmislek: potrebna
    je podpora politike. Če ne bi ohranili delovnih mest in zadovoljili ključnih senatorjev,
    programa Artemis sploh ne bi bilo. Tako pa imajo ZDA – in svet – po 50 letih spet
    opremo, denar in nabrano "gibalno količino", da človeka pošljejo iz orbite Zemlje.'
  - Krhko ravnotežje med kritiki in podporniki se utegne porušiti, če bo današnja
    misija neuspešna. Če raketa eksplodira. Če Orionov pogon zataji. Marsikaj lahko
    gre po zlu. Tudi zato bo 14. ura po našem času napeta.
  - Ravnotežje se utegne porušiti tudi zaradi tretjega dejavnika. Program Artemis
    vsebuje element, ki ga lahko preraste in izrine, kot kukavičji mladič v gnezdu.
    SpaceX-ovo vesoljsko ladjo Starship. Nasa je, v veliko presenečenje, prav Starship
    izbrala za svoj lunarni pristajalnik.
  - Starship je načrtovani izstrelitveni sistem, ki bo po napovedih podjetja še silnejši
    od SLS-a, pa tudi od stare sovjetske rakete N1. Elon Musk zatrjuje, da bo posamezna
    izstrelitev stala manj kot 10 milijonov dolarjev, v kombinaciji z orbitalnim dotakanjem
    goriva pa bi Starship lahko globoko v vesolje poslal ali več deset ljudi ali pa
    več kot 100 ton tovora. Tega niti Ares V ne bi zmogel. Napovedi so skoraj neverjetne,
    a Nasa stavi nanje. Vrnitev človeka na Luno na misiji Artemis III leta 2025 je
    zdaj odvisna prav od Starshipa. Ko (če) bo mogočni Starship iz drobnega Oriona
    v Lunini orbiti prejel astronavta in ju spustil do tal Lune, bo prizor bodel v
    oči. Zakaj plačati nekaj milijard dolarjev za SLS in Orion, če lahko čisto vse
    za nekaj redov velikosti ceneje opravi Starship? Nekdanji administrator Nase Charles
    Bolden, nekdanji podpornik SLS-a, dandanes meni, da se bo zgodilo prav to.
  - Scenarij pa temelji na predpostavki, da bo Starship izpolnil obljube – in da bo
    varen. Kaj pa, če ne bo?
  - Nasprotniki SLS-a ponujajo vprašanje, kaj vse bi lahko Nasa naredila, če ne bi
    vlagala denarja v SLS in Orion? Ekonomisti temu rečejo. A brez SLS-a in Oriona
    danes ne bi brali tega članka in nestrpno pričakovali plamenov mogočne rakete,
    prizorov, kakršne so nazadnje uzrli pred 50 leti. In prgišče še živih odprav Apollo,
    med drugim Buzz Aldrin, Dave Scott, Charlie Duke, Harrison Schmitt, pa tudi Gene
    Kranz, ne bi moglo predati štafete. Uzreti, kako se ogenj njihovih sanj znova
    razplamteva.
