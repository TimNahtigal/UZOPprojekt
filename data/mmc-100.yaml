    source: ''
  - caption: S podmornico so si premožni ljudje lahko ogledali razbitine Titanika
      3800 metrov pod morsko gladino.
    img: https://img.rtvcdn.si/_up/upload/2023/06/22/66093993.jpg
    source: Reuters
  lead: Podjetje OceanGate, ki je organiziralo potope s podmornico Titan do razbitin
    ladje Titanik, je sporočilo, da je vseh pet potnikov s podmornice, ki so jo iskali
    od nedelje, umrlo. Predtem so v morju našli tudi razbitine plovila.
  mention:
  - Hamish Harding
  - Paul-Henri Nargeolet
  - 'John Mauger, '
  - Dale Mole
  - ' David Mearns,'
  paragraphs:
  - 'Podjetje je v izjavi sporočilo: "Izvršni direktor našega podjetja Stockton Rush,
    Šahzada Davud in njegov sin Sulejman, Hamish Harding ter Paul-Henri Nargeolet
    so žal umrli. Ti ljudje so bili pravi raziskovalci, ki so imeli pravi pustolovski
    duh in veliko strast do raziskovanja in zaščite svetovnih oceanov. Žalujemo za
    izgubljenimi življenji." Ob tem so izrekli sožalje svojcem umrlih.'
  - Ameriška obalna straža je nato sporočila, da so ostanke plovila s podvodnim daljinsko
    vodenim plovilom našli okoli 500 metrov od razbitin ladje Titanik na morskem dnu.
    Kot je dejal kontraadmiral John Mauger, je bil vzrok nesreče katastrofalna izguba
    pritiska in posledično implozija plovila.
  - Podvodni roboti bodo ostali pod vodo, da končajo preiskavo, so dodali. "Na prizorišču
    so trenutno medicinsko osebje in drugi tehniki, v naslednjih 24 urah pa bomo začeli
    demobilizacijo osebja in plovil s prizorišča," je še dodal Mauger. Kdaj se je
    zgodila implozija podmornice, še ne morejo oceniti. Dodali so, da za zdaj ni videti,
    da bi bili podvodni zvoki, ki so jih zaznavali, kakor koli povezani z iskanjem
    Titana.
  - Strokovnjaki so že dlje časa opozarjali, da bi lahko ogromen pritisk pod vodo
    povzročil implozijo plovila. Kot je pojasnil Dale Mole, nekdanji zdravnik ameriške
    mornarice, je bila v tem primeru smrt za potnike na krovu Titana takojšnja. "Čeprav
    bi bil smrten izid tragičen, bi bilo za posadko huje, če bi obtičali v plovilu.
    Lahko si samo predstavljate, kako bi bilo v mrazu in s pomanjkanjem kisika. Če
    jih že ne moremo dobiti nazaj, je to najboljši možni scenarij," je dodal še pred
    uradno potrditvijo smrti petih potnikov podmornice Titan.
  - Predtem je podvodno daljinsko vodeno vozilo v bližini ostankov ladje Titanik v
    Atlantskem oceanu odkrilo razbitine. Prijatelj potnikov na Titanu je potrdil,
    da gre za ostanke od nedelje pogrešane podmornice.
  - Novico je sporočil strokovnjak za potapljanje David Mearns, ki je dejal, da sta
    med razbitinami "pristajalni okvir in zadnji pokrov s podmornice". Kot je povedal
    za BBC, mu je to informacijo dal predsednik Explorer Cluba, ki je na zvezi z reševalno
    ekipo.
  - V sredo zvečer so ameriškim reševalcem na pomoč prišli tudi kanadski, tehnično
    opremo za iskanje so z letalom poslali tudi iz Združenega kraljestva, z opremo
    je pomagala tudi francoska raziskovalna ladja.
  - Iskanje podmornice se je začelo v nedeljo zvečer, ko so izgubili stik s posadko.
    Titan je imel za 96 ur zalog kisika, torej do danes zjutraj. Za krmilom je bil
    Stockton Rush, izvršni direktor podjetja OceanGate, ki je organiziralo odpravo,
    drugi potniki pa so bili 58-letni britanski pilot in poslovnež Hamish Harding,
    48-letni pakistansko-britanski poslovnež Šahzada Davud in njegov 19-letni sin
    Suleman ter 77-letni francoski raziskovalec Paul-Henry Nargeolet, ki velja za
    vodilnega strokovnjaka za Titanik. Ogled razbitin Titanika, ki stane 250.000 dolarjev
    (okoli 228.000 evrov) na posameznika, bi moral trajati dve uri.
  title: Umrli vsi potniki s podmornice Titan. Vzrok nesreče "katastrofalna implozija".
