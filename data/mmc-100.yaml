  date: '2023-05-28T13:52:00'
  figures:
  - caption: Skuhajo jih na pari.
    img: https://img.rtvcdn.si/_up/upload/2023/05/28/66086106.jpg
    source: Reuters
  - caption: Ljudje so načeloma nad novostjo navdušeni.
    img: https://img.rtvcdn.si/_up/upload/2023/05/28/66086100.jpg
    source: Reuters
  lead: V restavraciji v Tajpeju je na jedilniku prav poseben ramen – rezancem in
    juhi se je pridružil tudi orjaški enakonožec. 14-nožne rake, ki zrastejo tudi
    do 70 centimetrov, so ujeli nenamerno, okus mesa naj bi spominjal na mešanico
    rakovice in jastoga.
  mention:
  - ' Digel Hvang'
  paragraphs:
  - Restavracija v Tajpeju, ki načeloma streže ramen, je kot nalašč za pustolovske
    kulinarične navdušence. The Ramen Boy je namreč pred kratkim za omejen čas predstavil
    posebno specialiteto – rezanci, katerih kralj je orjaški enakonožec. Več sto ljudi
    čaka na 14-nožnega raka, pa naj bo le za fotografijo ali pa si dejansko želijo
    grižljaj te nenavadne sestavine, ki so jo zaposleni sicer označili za sanjsko.
  - '" Privlačen je predvsem zaradi svojega videza – videti je zelo ljubko," je dejal
    37-letni lastnik restavracije. Sam je pojasnil, da pri pripravi enakonožnega raka,
    ki spominja na gromozansko mokrico, preprosto uporabljajo paro – dušijo ga 10
    minut, nato pa ga dodajo na vrh sklede ramena z gosto piščančjo in ribjo juho.'
  - Po besedah ene izmed strank okus mesa spominja na mešanico rakovice in jastoga,
    le da je bolj kompaktno in žvečljivo. Vsaka skleda stane 1480 tajvanskih dolarjev
    (približno 45 evrov).
  - Orjaški enakonožci so daljni sorodnik rakov in kozic ter so največji med tisočimi
    vrstami rakov. Povprečno zrastejo med 20 in 35 centimetri, dosežejo lahko tudi
    dolžino več kot 70 centimetrov. Običajno živijo od 170 do 2140 metrov pod vodno
    gladino oceana, kar 80 odstotkov jih lahko najdemo v globini od 365 do 730 metrov.
  - Od uvedbe ramena so sicer nekateri strokovnjaki postali zaskrbljeni glede morebitnega
    ekološkega vpliva ribolova z vlečenjem mreže po tleh, a se stranke restavracije
    s tem ne strinjajo. " Če gre le za poseben jedilnik in so bili orjaški izopodi
    ujeti nenamerno, kot pravi lastnik restavracije, bi ga moral vsak, ki ima priložnost,
    poskusiti," je dejala 34-letna Digel Hvang, ki dela kot genetska svetovalka in
    se počuti počaščeno, da lahko okusi tovrstno jed.
  - Znanstveniki se sicer sprašujejo tudi o mogočih zdravstvenih tveganjih – večinoma
    neznana vrsta lahko vsebuje toksine ali težke kovine, kot je živo srebro. Vrsta
    Bathynomus jamesi je bila namreč v Tajvanu uradno priznana šele lani, o njej pa
    tako ni veliko podatkov. Po mnenju Hvang Ming Č iha, profesorja biotehnologije,
    ki je specializiran za globokomorske nevretenčarje, bi bilo bolje, da bi jo najprej
    bolje raziskali, zgradili bazo podatkov in šele nato dovolili ljudem, da to meso
    tudi užijejo.
  title: V Tajvanu ramen popestrili z nenavadno sestavino – orjaškim enakonožcem
