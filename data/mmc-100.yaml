  - Donald Trump
  paragraphs:
  - Pravzaprav je Karlu Gržanu težko določiti vlogo. Malo je ljudi, ki govorijo tako
    preprosto in ponižno resnico, kot jo govori on. Druženje z njim, pa naj si bo
    v knjigi, pripovedi ali v živo, ima vedno posledice.
  - V 23. epizodi podkasta ga Miha Šalehar v uvodu izzove, da ima neposreden dostop
    do kanala resnice. Gržan meni, da ga ima pravzaprav vsak, ki vstopi v tihoto,
    v globino samega sebe.
  - '"Meni se je ta cona zaznavnosti odprla po možganski kapi, ko sem živel na samem.
    Po treh letih bivanja v tihoti. Še zdaj se spomnim, ko sem nekega večer prišel
    domov, sem prvič zaznal, kako stara so drevesa, jablane in vse, kar me obdaja,
    ter da imajo do mene odnos. Da je vse to v čutenju, da je vse to v odnosnosti.
    Takrat mi je ta tihota pomagala, da sem tudi sam vstopil v tisto odnosnost, ki
    so jo drevesa in vse, kar me obdaja, pričakovali. To je tisto najlepše, to te
    najbolje izpolni."'
  - Vključevanje v koncept sodelovanja
  - Strinja se, da si ljudje spoznavne tihote večinoma najverjetneje niti ne želijo,
    obenem pa nosilcem moči takšno stanje v času razpršene pozornosti ustreza. Na
    vprašanje, ali ima sistem, predvsem izobraževalni, ki izhaja iz prevladujočih
    vrednot, pravico komurkoli sporočati, da je slab, oziroma da ni zadosti dober,
    odgovarja, da ne.
  - '"Ima pa pravico posamezniku povedati, kje je dober, ga stimulirati, da bo tam
    še boljši, in ga vključevati v koncept sodelovanja in dopolnjevanja. To pravico
    ima sistem, drugih pa nima. Ostalo je zloraba človeka in procesa izobraževanja.
    In te zlorabe se ne gremo več."'
  - Vsak, ki se panično odziva ob negativnem vrednotenju otrok po vzpostavljenih normativih,
    bi se moral zavedati, da je normativ otrok sam z njemu lastnimi talenti. Različno
    nadarjenih otrok pa je 100 odstotkov.
  - '"Nekateri otroci se rodijo v ta svet samo za to, da ga srčijo. Gospa sina z Downovim
    sindromom mi je dejala, veš, kaj mi je rekel. Mama, kruh ima pa mehko dušo. To
    so ljudje z izjemno senzibilnostjo, ki srčijo prostor, mi pa jih spravljamo v
    neke posebne zavode, neke posebne šole."'
  - Šalehar dodaja, da drugačne odrivamo na obrobje. Oziroma povprečne otroke, ki
    bi lahko razvili katerikoli talent spektra, potiskamo v idejo sistemsko zapovedane
    odličnosti. Znotraj tega procesa pa se nam lahko zgodi, da izgubimo samega sebe.
  - Popotnik po cestah med ubogimi
  - Znanje o obrobju Gržan vsekakor ima. Eno leto je živel kot brezdomec, kar označuje
    za izjemno izkušnjo. Kot pojasnjuje, ga je od nekdaj pritegoval Frančišek Asiški,
    ki se je po zgledu Jezusa podal med tegob poln vsakdan ubogih. S tem namenom je
    tudi sam pristopil k redovnikom, kjer pretiranega posluha za njegove "ulične"
    načrte niso imeli, a je trmasto vztrajal.
  - '"Skušal sem biti priden, ampak je težko, če si duhovno povezan s svetim. Vztrajal
    sem, da želim iti, kar sem bolj kot ne izsilil. Znanci so mi ponudili pribežališče,
    kamor sem se lahko zatekel. Ni bilo tekoče vode, WC sem si naredil na štrbunk,
    bil sem popotnik po cestah. Takrat sem se tudi prvič srečal z odvisniki. Eno leto
    je trajala ta avantura. Ni bilo preprosto, bilo pa je polno, dobro. Sam pa sem
    imel premalo vere in zaupanja, zato nisem nadaljeval te avanture."'
  - Pajaci ali lutke, ne pa avtoritete
  - Morda se je razpletlo, kakor se je moralo, priznava. V današnji družbi avtoritet
    ne priznava. Ceni osebnosti, ki mu dajo misliti in ga nagovarjajo s pristnostjo.
    "Drugače pa ne maram avtoritet na nobenem področju, posebej ne izpostavljenih
    avtoritet."
  - Te se mu namreč zdijo predvsem "kot pajaci interesa, lutke". Dodaja, da nima rad
    igralcev, niso mu blizu ljudje, ki mislijo, da nekaj so. "Jaz sem tudi kmet, čeprav
    imam samo en hektar zemlje, ampak sem kmet, imam rad pristnost. Ti si ti, ko si
    v pristnosti resničen. Če pa si narejen v avtoriteto oziroma v pomembnost, si
    pa zame smešen, si samo maskota."
  - Avtoritete, ki v tem trenutku predstavljajo središče moči na svetu, so tudi Benjamin
    Netanjahu, Vladimir Putin, Donald Trump. "To so pajaci, se opravičujem," pravi
    Gržan. Šalehar ga ob tem povpraša, ali niso prav oni poosebljenje tiste odličnosti,
    ki jo kot družba ocenjujemo s peticami. Ni to najbolj izčiščena, najbolj radikalna
    in boleče transparentna bodica v oko te iste odličnosti, ki jo kot družba častimo
    v šoli, ki jo častimo s svojimi dejanji, z navijanjem za naše in s ploskanjem
    zmagovalcem?
  - '"Ampak pri vedno večjem številu ljudi so ti posamezniki dejansko prepoznani kot
    pajaci. Ne vem, zakaj, morda dozoreva čas. Prepoznani so kot pajaci interesa,
    neustrezni. In vedno bolj se budi zavest, da bomo morali domisliti urejanje tega
    sveta drugače. Kako drugače? Ne vem, to bomo morali domisliti."'
  - Prebudi se in začni ustvarjati
  - Šalehar ne želi biti pesimističen, a meni, da je v transparentnosti teh likov,
    ki predstavljajo nosilce družbene in gospodarske moči v današnjem svetu, lahko
    prepoznati svojevrstno komedijo. Iz dneva v dan so namreč bolj podobni lastnim
    karikaturam. Kmalu bodo spominjali na Chaplinov film. V zgodovini pa so se takšne
    figure že zgodile. Gržan meni, da bi morali voditelje izbirati med modrimi posamezniki.
  - '"Zdaj mi pa nalepijo tam neki obraz, neko figuro, naše zoper ne naše, potem pa
    se moram opredeliti. Ne! Sam se želim opredeljevati za vrednote. Moj zastopnik
    mora imeti tiste odlike, ki budijo žlahtno človečnost."'
  - Pravi, da bi moral pred prevzemom javnih funkcij posameznik v življenju najprej
    dozoreti. V trenutni situaciji pa moramo domisliti alternativo. Ampak kako jo
    domisliti? "Tako, da jaz mislim, pa ti misliš in to se mora združevati v mrežo."
  - Kako pa se opolnomočiti in začeti misliti? Gržan poudarja, da ima vsak polno vrednost,
    tudi ustvarjalnost nam je dana, nihče ni vreden manj ali več.
  - '"Prebudi se in dejansko začni kreirati. Kaj pa to pomeni? Ne šimfat. Ker šimfanje,
    to so nizke vibracije, zato nas strašijo, zato nam dajejo občutek brezizhodnosti
    in nemoči, češ, kaj jaz lahko naredim? Ti lahko narediš! Ti lahko kreiraš. Ampak,
    ko pridete skupaj na kavo, ne se potem ustaviti pri šimfanju. Veš, so nekateri,
    ki jim je grozno, če ni nič groznega. To so nizke čustvene vibracije … strah,
    jeza. Zato sam pravim: ozavesti manipulacije, potem jih pa ironiziraj. Ne zapadi
    v zagrenjenost."'
  title: 'Karel Gržan: Ne maram avtoritet, sem kmet'
