  id: '722626'
  keywords:
  - Šukar
  - Igor Misdaris
  - romska glasba
  lead: Nenadno je umrl Igor Misdaris, pevec skupine Šukar, ki je v našem prostoru
    zadnjih 35 let skrbela za popularizacijo romske glasbe.
  mention:
  - Ciganska duša
  - Amaro dive
  - Mentol bonbon
  - En concert
  - Baro ilo
  paragraphs:
  - 'Vest o smrti so na uradnem Facebookovem profilu skupine Šukar potrdili Misdarisovi
    glasbeni kolegi z zapisom: "V mir in tišino nedeljskega popoldneva je boleče zarezala
    vest, da si odšel. Ne samo do Kopra, kamor si se tako zelo rad z naših vaj in
    koncertov vračal domov in ne samo do hrvaškega morja, kjer so bile tvoje korenine
    in kjer si iskal svoj mir ... Odšel si za vedno. Tvoje roke ne bodo več izvabljale
    divjih ritmov iz tvoje bugarie. Za vedno je utihnil tvoj prodoren glas, ki je
    polnil dvorane. Ne moremo še povsem dojeti. Še manj razumeti. Kjer koli že zdaj
    si, ostajaš v naših srcih. Z nami. Tvoje veliko srce, baro ilo ... te je izdalo
    ..."'
  - Zbirali romsko izročilo Evrope Leta 1990 so skupino Šukar ustanovili člani tamburaških
    orkestrov folklornih skupin iz Ljubljane, ki so se posvetili igranju pretežno
    romske glasbe. "Nekje jeseni 1989 mi je Vlado Kreslin ponudil, da skupaj z njim
    odigram nekaj romskih skladb na enem od njegovih koncertov v stari Ljubljani,"
    je pred nekaj leti v intervjuju za Delo povedal Misdaris. "Nekako iz tega prvega
    nastopa in še nekaj, ki smo jih zaigrali z Emonskimi tamburaši, je prišlo do tega,
    da sem ustanovil skupino petih malo bolj dojemljivih fantov, ki so čutili podobno
    ljubezen do romske glasbe in jo kasneje poimenoval Šukar."
  - ': "Nismo razmišljali o nekem pogumu ali o odločitvi. Naš nastanek in delovanje
    je bilo vedno posledica nekih čudnih naključij, ki so se dogajala v karieri. Želeli
    smo igrati tisto, kar nam je bilo všeč, in tisto, kar nam je sedlo na dušo. In
    to je bila romska glasba, ki ponuja veliko širine in raznovrstnosti."'
  - Prvenec skupine je izšel leta 1993. Od prvotne zasedbe sta v njej do danes ostala
    dejavna le še Igor Misdaris in Nenad Ljubotina.
  - Skupina Šukar je v svoji dolgoletni karieri ves čas ohranjala romsko glasbeno
    kulturo in seznanjala Slovence z njeno bogato zakladnico.
  - Repertoar Šukarjev obsega glasbo Romov iz vse Evrope, kjer so zaradi raznolikosti
    načina življenja v različnih okoljih in zaradi vpliva različnih narodov ustvarili
    pestro glasbeno izročilo. Skupina je zbirala zapisane, posnete in tudi ustno prenesene
    pesmi ter jih predelovala na svoj način. Večinoma gre za poskočnice in balade,
    prirejene za tamburaški kvintet.
  - Pet različic romskega jezika Člani zasedbe niso bili Romi, so pa nastopali v petih
    različicah romskega jezika. "Ker so razlike med samimi dialekti tako močne, se
    je zelo težko vsega naučiti, tako da se omejujemo le na razumevanje tistega, kar
    pojemo," je v prej omenjenem intervjuju za Delo še povedal Misdaris. "Ampak v
    vseh teh letih smo se naučili nekaj pogovornih fraz in se prav dobro sporazumevali
    tudi s samimi Romi v romščini." Povedal je tudi, da je romska skupnost njihovo
    glasbo vedno dobro sprejela. "Romi nasploh cenijo glasbenike bolj kot ostali ljudje.
    Če pa igraš njihovo glasbo in to počneš dobro, te cenijo ne glede na poreklo ali
    barvo."
  - Šukar (ime v romskem jeziku pomeni dobro, lepo) so nase med drugim opozorili s
    ploščami Ciganska duša, Amaro dive, Mentol bonbon (z Zoranom Predinom) in Čhaie.
    Sodelovali so pri dveh ploščah Vlada Kreslina, eni Roberta Magnifica ter v filmu
    Outsider režiserja Andreja Košaka (1997). Na albumu En concert (2003) je 26 skladb,
    ki so jih leto pred tem posneli v živo na dveh koncertih v Gallusovi dvorani Cankarjevega
    doma; kot gostje so z njimi muzicirali Oto Pestner, Momčilo Bajagič - Bajaga,
    Jadranka Juras, Saša Olenjuk, Vesna Zornik in drugi.
  - Od poustvarjanja k avtorski glasbi Album Baro ilo (2020) – popolnoma avtorski
    album z desetletno genezo – je nastal na snemanjih, ki so potekala v studijih
    Radia Slovenija.
  title: Umrl je pevec skupine Šukar Igor Misdaris
