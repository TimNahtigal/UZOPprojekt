  paragraphs:
  - 13-minutni Mož, ki ni mogel molčati (v izvirniku Čovjek koji nije mogao šutjeti)
    je za cezarja nominiran v kategoriji za najboljši igrani kratkometražec. Film
    hrvaškega scenarista in režiserja Nebojše Slijepčevića je nastal v koprodukciji
    Hrvaške, Bolgarije, Francije in Slovenije. Glavni producent je hrvaška produkcijska
    hiša Antitalent, slovenski koproducent je Studio Virc (zanj Boštjan Virc). Avtorski
    del iz Slovenije predstavlja direktor fotografije Gregor Božič, med sofinancerji
    je tudi Slovenski filmski center (SFC).
  - Podelitev cezarjev bo vodila Catherine Deneuve Poleg filma Mož, ki ni mogel molčati,
    katerega naslov se v francoščini glasi L'Homme qui ne se tais pas, so v kategoriji
    igranih kratkih filmov za cezarja nominirani še Boucan (Salomé Da Souza), Ce qui
    appartient à César (Violette Gitton) in Queen Size (Avril Besson). 50. podelitev
    nagrad cezar, ki jo bo vodila francoska kultna igralka Catherine Deneuve, bo 28.
    februarja v dvorani Olympia v Parizu.
  - Sicer se z največ nominacijami za cezarja ponaša visokoproračunska francoska priredba
    romana Alexandra Dumasa Le Comte de Monte- Cristo (Grof Monte Cristo). Film, ki
    sta ga režirala Alexandre de La Patelliere in Matthieu Delaporte, je deležen 14
    nominacij, tudi za najboljši igrani celovečerec. V tej kategoriji so nominirani
    še muzikal Emilia Pérez (r. Jacques Audiard), drama L'Histoire de Souleymane (r.
    Boris Lojkine), En Fanfare (r. Emmanuel Courcol) in komični triler Miséricorde
    (r. Alain Guiraudie).
  - Pomemben prispevek slovenske strani Film Mož, ki ni mogel molčati je za cezarja
    nominiran, ker je nastal tudi v francoski koprodukciji. Glede vprašanja, koliko
    je to tudi slovenski film, je producent Boštjan Virc za MMC povedal, da je " slovenski
    tako v smislu solastništva nad filmom kot v smislu soavtorstva. Film je finančno
    podprl Slovenski filmski center, Gregor Božič je bil direktor fotografije, eno
    od vlog je odigral Nebojša Pop Tasić. Slovenska produkcijska hiša je Studio Virc,
    jaz sem producent, pri čemer bi poudaril še vlogo obeh mojih produkcijskih sodelavk
    Nataše Vugrinec in Mateje Jerman. "
  - Naslovno vlogo je odigral Goran Bogdan, ob njem in Popu Tasiću pa v filmu igrajo
    še Alexis Manenti, Dragan Mićanović in Silvio Mumelaš. Film temelji na resničnem
    dogodku med vojno v nekdanji Jugoslaviji leta 1993. Potniški vlak so na poti iz
    Beograda v Bar napadle srbske paravojaške sile. Vojaki so se spravili na nedolžne
    civiliste in le eden od 500 potnikov se jim je upal zoperstaviti, kar pa je plačal
    z življenjem.
  - V zvrhani malhi lovorik tudi zlata palma Kratkometražec v Slijepčevićevi režiji
    je do zdaj požel že množico lovorik. Med drugim je prejel prestižno zlato palmo
    za najboljši kratki film na festivalu v Cannesu in nagrado Evropske filmske akademije
    (EFA) za najboljši kratki film, tema se je pridružil še grand prix mesta Melbourne
    za najboljši kratki film na Mednarodnem filmskem festivalu v Melbournu (MIFF).
    V preteklem tednu pa je slavil tudi v kategoriji kratkih igranih filmov na filmskem
    festivalu v Trstu.
  - Prav tako je bil Gregor Božič za najboljšo fotografijo nagrajen na bukareškem
    festivalu kratkega filma, deležen pa je bil tudi posebne omembe žirije za najboljšo
    fotografijo na Festivalu slovenskega filma (FSF) v Portorožu.
  - 'Film, ki ga ni mogoče ustaviti ... Producent Boštjan Virc je ob razglasitvi oskarjevskih
    nominacij dejal še: " Že z zlato palmo v Cannesu spomladi je bil ustvarjen momentum,
    za katerega se zdi, da ga nič ne ustavi. "'
  title: Mož, ki ni mogel molčati nominaciji za oskarja dodal še nominacijo za prestižnega
    cezarja
