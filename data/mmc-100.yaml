  paragraphs:
  - Pot do peščenih plaž polotoka Hel v Gdanskem zalivu je ravno zaradi asociacije
    na uspešnici Iron Maiden (The Number of The Beast) in AC/DC (Highway to Hell)
    med turisti še posebej priljubljena. Tistim najvernejšim Poljakom pa povezava
    med gospodarjem pekla in njihovimi kraji ni niti malo smešna. Po mnenju številnih
    linija namreč pomaga pri širjenju satanizma.
  - V Svetem pismu je namreč število 666 interpretirano kot število zveri, končna
    postaja avtobusa na tej liniji pa je le za eno črko L oddaljena od pekla. Po vrsti
    pritožb je bilo podjetje PSK Gdynia prisiljeno v spremembo. Odločili so se, da
    zadnjo šestico obrnejo na glavo, do kraja Hel bo tako od 24. junija naprej vozila
    linija 669.
  - Oblikovalec podjetja PSK Gdynia, Marcin Szwaczyk, je za portal Trojmiasto povedal,
    da je sprememba avtobusne linije preprosta in še najmanj sporna rešitev. Sicer
    je poteza prevozniškega podjetja na družabnih omrežjih sprožila kar nekaj negodovanja,
    saj naj bi sprememba škodila turizmu.
  - 'Eden izmed kritikov, Krzystof Nadolski, je na Twitterju zapisal, da je bilo naključje
    odlično in brezplačno oglaševalsko sredstvo: "Številni turisti so se odločili,
    da namesto z veliko hitrejšim vlakom v Hel potujejo z avtobusom, ravno zaradi
    te povezave."'
