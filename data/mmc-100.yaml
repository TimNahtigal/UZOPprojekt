  paragraphs:
  - Ekipi sta se pomerili aprila v finalu Alpske lige, Jeseničani pa so bili boljši
    s 4:2 v zmagah. Šesto tekmo so dobili v olimpijski dvorani v Cortini d'Ampezzo
    šele v drugem podaljšku, potem ko je na prvih petih tekmah finala vedno slavila
    domača ekipa.
  - Pred 600 gledalci v Podmežakli so bolje začeli Italijani. V 4. minuti je bil z
    modre črte natančen Alberto Colli, potem ko je bil Žan Us pokrit. V predzadnji
    minuti prve tretjine je izenačil Lovro Kumanović.
  - V 25. minuti je Luca Barnabo poskrbel za novo vodstvo Cortine. Po pol ure igre
    je moral na kazensko klop Davide Faloppa zaradi udarca s palico. Čimžar je izenačil
    na 2:2 ob prednosti igralca več. Minuto in pol pred koncem druge tretjine so prvič
    na tekmi povedli Jeseničani. Znova so imeli "power play", tokrat pa je bil natančen
    Žan Jezovšek.
  - Riccardo Lacedelli je v 44. minuti še enkrat poskrbel za izenačenje, ko je na
    kazenski klopi sedel Rožle Bohinc. Odločilni zadetek je dosegel Čimžar tri minute
    in pol pred koncem. Za vrati se je nepričakovano odločil za strel. Zadel je vratarja
    Haydna Hawkeyja v hrbet in plošček se je odbil prek golove črte.
  - Celjani po zelo slabem startu klonili v Kitzbühelu Ekipa RST Pellet Celje je gostovala
    v Kitzbühelu. Gostitelji so bili boljši s 6:4. Ključna je bila prva tretjina,
    ko so gostitelji hitro povedli s 3:0. Prvi zadetek je že v 7. minuti dosegel Matic
    Podlipnik, ki je nato še podal do Chrisa Seta za 2:0.
  - V drugi tretjini je najprej Mario Ebner celo z igralcem manj povišal na 4:0, nato
    pa je Alexander Maxa dosegel že peti zadetek za Kitzbühel v 38. minuti. Latvijec
    Mikus Mintautiškis in Rus Denis Golinski sta v 40. minuti v razmiku 31 sekund
    znižala na 5:2.
  - Upanje na preobrat je povečal Gal Sodja Zalokar, ki je v 44. minuti zadel za 5:3.
    A Podlipnik se je v 59. minuti še enkrat vpisal med podajalce, ko je 98 sekund
    pred zadnjim piskom sirene zadel Waltteri Lehtonen za neulovljivih 6:3. Sodja
    Zalokar je v zadnji minuti poraz omilil.
  - Celjane, ki na lestvici ostajajo na predzadnjem 15. mestu, že v soboto čaka gostovanje
    v Salzburgu, Jeseničani bodo v derbiju kroga gostovali pri vodilnem Rittnu.
