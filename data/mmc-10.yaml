  paragraphs:
  - Victoria's Secret bo po več letih končno spet le priredila znameniti modni spektakel,
    na katerem se manekenke po pisti sprehodijo v dragem spodnjem perilu priljubljene
    znamke, legendaren modni dodatek pa so seveda velikanska krila. Modna revija je
    znana tudi po tem, da so manekenke, kot so Adriana Lima, Naomi Campbell in Bella
    Hadid, v živo pospremili tudi nastopi Rihanne, Taylor Swift, Shawna Mendesa in
    Justina Bieberja.
  - Modna revija naj bi se zgodila jeseni, točen datum še ni znan. Organizatorji pa
    so namignil na nekatere spremembe dogodka. " Modna revija Victoria's Secret 2024
    bo zagotovila natanko to, kar so naše stranke zahtevale – glamur, pisto, modo,
    zabavo, krila – vse skozi močen, sodoben objektiv, ki odraža to, kar smo danes,"
