  paragraphs:
  - Dan po odmevni zmagi pri prvaku Vegasu, kjer je Anže Kopitar dosegel, so Kralji
    igrali na domačem ledu, pri čemer je kapetan prestopil nov mejnik. Potem ko je
    z dvema točkama v Las Vegasu na drugem mestu večne klubske lestvice ujel Luca
    Robitailla, je zdaj že zapustil družbo zdajšnjega predsednika Los Angeles Kingsov.
  - 'Pred Kopitarjem je na klubski lestvici le fantastični strelec Marcel Dionne,
    ki je med letoma 1975 in 1987 na 921 tekmah zbral kar 1307 točk za 550 golov in
    757 podaj. Robitaille je zbral 1154 točk: 557 golov in 597 podaj na 1079 tekmah
    v dresu Kraljev med letoma 1986 in 2006 (z dvema prekinitvama).'
  - A kralji gostovanj (sedem zmag na sedmih tekmah zdoma) imajo na začetku sezone
    2023/24 težave na domačem ledu, kjer so na šesti tekmi doživeli že peti poraz,
    sicer vsaj tretjega s tolažilno točko. Tokrat je v Crypto.com Areni slavil Pittsburgh
    s 4:3 v podaljšku.
  - Razmerje strelov v okvir vrat je bilo sicer kar 37:20 za Los Angeles, a kaj ko
    je drugi vratar Pheonix Copley tako prvi kot zadnji usodni gol prejel izza gola
    zaradi preslabega gibanja z vratnice na vratnico.
  - 'Junak Pingvinov je postal Bryan Rust, ki je v 4. minuti podaljška zadel kar dvakrat:
    prvi zadetek je bil razveljavljen zaradi ofsajda, zato pa je pol minute pozneje
    pravilno matiral domačo obrambo. Minuto pred tem je imel resno priložnost za zmago
    tudi Kopitar, a je njegov močni strel za las zgrešil okvir vrat.'
  - '"Nocoj nismo igrali dovolj odločno, morda zaradi dveh tekem zapovrstjo ali pa
    smo bili enostavno prepočasni. Nismo si zaslužili dveh točk," je po dvoboju dejal
    trener Kraljev Todd McLellan, ki je še obrazložil: "So številka ena pri sodniških
    metih, mi pa smo si privoščili šest, sedem prepovedanih dolgih strelov. Ponavadi
    smo pri prenosu ploščka iz svoje tretjine bolj zbrani, po drugih 20 minutah pa
    smo imeli zaradi tega že deset igralcev z več kot minuto dolgimi izmenami."'
  - Kapetan Pingvinov Sidney Crosby je z mojstrovino okoli gola v 8. minuti poskrbel
    za vodstvo gostov. Odgovoril mu je domači kapetan, ki je v 15. minuti zrežiral
    izenačenje, ko je prestregel plošček in od ograde kot na pladnju podal do Carla
    Grundstroma. Švedski večer je v 30. minuti nadaljeval Adrian Kempe, ki je kot
    ostrostrelec premagal rojaka Magnusa Hellberga v vratih Pensov. Kralji so se razleteli,
    streljali, prišli do igralca več, a sledila je hladna prha. Ob igralcu manj je
    izenačil Danec Lars Eller.
  - 'Le 37 sekund zadnje tretjine je Pittsburgh potreboval za novo vodstvo: Crosby
    je z imenitno podajo našel Jacka Guentzla za 3:2. Iz le 15 strelov je bil drugi
    vratar LAK-a Copley premagan že tretjič ...'
  - Če so Kralji zapravili številčno premoč ob izključitvi Crosbyja, pa je razpoloženi
    Hellberg vendarle kapituliral v 47. minuti, ko je s tretjim strelom v treh sekundah
    pot v mrežo le našel Kevin Fiala. Švicar se je tako na najboljši način odkupil
    za podarjeni plošček Ellerju ob koncu 2. tretjine.
  - Los Angeles v soboto čaka sedma domača tekma, ko bodo ob 4.30 po slovenskem času
    v nedeljo gostili Philadelphio. Takrat bo v vratih zagotovo Cam Talbot, s katerim
    Kingsi tudi nizajo zmage v gosteh.
  - Na preostalih četrtkovih tekmah izstopa nova zmaga vodilnega Bostona, ki je brez
    težav premagal NY Islanders s 5:2. V derbiju dna lige je San Jose porazil Edmonton
    s 3:2, s čimer se pritisk na vodstvo Oilersov še stopnjuje, da prebudijo in nekaj
    spremenijo pri ekipi.
  - LOS ANGELES – PITTSBURGH 3:4 (1:1, 1:1, 1:1) - v podaljšku Grundstrom 15. (podaja
