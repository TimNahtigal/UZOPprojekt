  lead: Je duhovnik, mislec, pisec, filozof in kmet. Pravi, da ko si kmet, si prizemljen
    in moraš biti na ti z vsem, kar te obdaja. Zato se v pogovoru z Miho Šaleharjem
    tikata.
  mention:
  - Karlu Gržanu
  - Miha Šalehar
  - Benjamin Netanjahu
