    img: https://img.rtvcdn.si/_up/upload/2022/05/11/65986924.jpg
    source: Reuters
  lead: 'Zadnjega od petih božičnih obračunov Lige NBA bosta ob 4.30 odigrala Phoenix
    in Dallas. Med ekipama vlada veliko rivalstvo, maja lani so Mavericksi izločili
    Sunse v polfinalu Zahoda po sedmih tekmah. '
  mention:
  - 'Ob 4.30:'
  paragraphs:
  - Luka Dončić je na pragu mejnika doseženih 10.000 točk v Ligi NBA. Za ta dosežek
    jih potrebuje v Phoenixu le še enajst. Če ne bo res slabega strelskega večera
    ali poškodbe, se Luki 10.000. točka nasmiha na 358. srečanju.
  - S tem bi se po hitrosti izenačil z Bobom McAdoojem. Pred njima so Wilt Chamberlain
    (236 tekem), Michael Jordan (303), Elgin Baylor (315), Kareem Abdul-Jabbar (319),
    Oscar Robertson (334) in George Gervin (355).
  - 24-letni Dončić je dosegel 30 točk ali več na zadnjih 12 od 13 dvobojev. Enajst
    zaporednih je tudi klubski rekord. V decembru je njegovo povprečje 36 točk, 11,3
    podaje in 9,5 skoka na tekmo.
  - Dončić je prevzel še dodatno odgovornost ob številnih poškodbah, ki pestijo Dallas.
    Že deveto tekmo bo izpustil Kyrie Irving, v Phoenixu ne bo prvega centra Derecka
    Livelyja, prav tako ne Josha Greena in Maxija Kleberja.
  - Phoenix velja za eno od največjih razočaranj sezone. Ekipa s Kevinom Durantom,
    Kevinom Bookerjem, Bradleyjem Bealom in Jusufom Nurkićem je izgubila osem od zadnjih
    enajstih tekem. Tudi Sunsi se ubadajo s poškodbami, tako proti Dallasu ne bosta
    igrala Beal in Nurkić.
