    img: https://img.rtvcdn.si/_up/upload/2023/09/29/66120058.jpg
    source: EPA
  lead: Po valu nasilja v septembru, v katerem je umrlo najmanj 11 ljudi, je švedski
    premier Ulf Kristersson na pogovor poklical poveljnika vojske in načelnika policije.
    Premier napoveduje, da bodo premagali tolpe.
  mention:
  - Micael Byden
  paragraphs:
  - V Stockholmu sta bila v sredo v ločenih streljanjih ubita dva človeka, mlajša
    ženska pa je v četrtek zjutraj umrla, ko je v Uppsali v hiši eksplodirala bomba.
  - '"To je težko obdobje za Švedsko. 25-letna ženska je šla na popolnoma običajen
    večer spat, ni pa se več zbudila," je v televizijskem nagovoru dejal Kristersson.
    "Polovili bomo tolpe in jih premagali," je obljubil.'
  - Policija ocenjuje, da je na Švedskem v tolpe neposredno vpletenih ali z njimi
    povezanih okoli 30.000 ljudi.
  - Kriminalne tolpe, ki se med drugim ukvarjajo s trgovino z orožjem in mamili, so
    na Švedskem dejavne že leta, v zadnjem času pa so vse bolj nasilne. Večstanovanjske
    stavbe in hiše po vsej državi pogosto pretresajo eksplozije, streljanje na javnih
    mestih pa je v nekoč mirni državi postalo stalnica. Žrtve obračunov med tolpami
    so tudi naključni mimoidoči in ljudje, ki niso povezani s kriminalnimi združbami.
  - Premier je poudaril, da skrajno nasilje prizadeva vse več otrok in popolnoma nedolžnih
    ljudi. Priznal je, da Švedska še nikoli ni doživela česa podobnega, pa tudi nobena
    druga država v Evropi ne doživlja česa podobnega.
  - Premier za težave krivi prejšnje vlade. "Sem nas je pripeljala neodgovorna politika
    priseljevanja in neuspešna integracija," je ocenil vodja konservativcev. Dejal
    je še, da švedska zakonodaja ni bila zasnovana za obračune med tolpami. "Vendar
    to zdaj spreminjamo," je poudaril.
  - Vrhovni poveljnik švedske vojske Micael Byden je za švedski časnik Dagens Nyheter
    povedal, da je pripravljen pomagati policiji.
  - Po poročanju BBC-ja sicer ni jasno, kako bi se lahko vojska vključila v boj proti
    tolpam. Glede na dosedanje pogovore bi lahko vojaki prevzeli nekatere policijske
    naloge, da bi se policisti lahko posvetili boju proti kriminalu.
  - Nekateri kritiki so predlagane ukrepe označili za površinske in trdijo, da obravnavajo
    simptome, ne pa vzrokov nasilja.
  - Kristersson je po lanskih volitvah s podporo skrajno desne stranke Švedski demokrati
    oblikoval desnosredinsko manjšinsko vlado, s čimer se je končala osemletna vladavina
    socialnih demokratov.
  - Njegova koalicija je zmago dosegla tudi z obljubami o zatrtju nasilja ter večjih
    pooblastilih za policijo in ostrejših kaznih za zločine s strelnim orožjem.
  title: Po valu nasilja na Švedskem naj bi se v boj proti tolpam vključila tudi vojska
