  paragraphs:
  - Olimpija, ki je do zadnje minute "grozila" odlični Valencii, je imela tudi v Splitu
    precej dela.
  - V uvodu so bili zmaji boljši, dobili prvo četrtino za osem (15:23) in imeli v
    nadaljevanju tudi že +10, a so se domači vztrajno vračali. Ob polčasu so tako
    zaostajali le za točko (34:35).
  - Tudi ob koncu tretje četrtine je gostom šele trojka Devanteja Jonesa ob sireni
    zagotovila nekoliko večjo prednost (49:54).
  - Splitčani so bili v zadnjih minutah blizu, vendar ne dovolj, da bi še lahko poskrbeli
    za preobrat. Po protinapadu in košu J. R. Stewarta za 66:72 pa je bilo srečanje
    odločen.
  - Pri Ljubljančanih je Stewart končal pri 14 točkah, po 12 sta jih dodala Jones
    in Aleksej Nikolić.
  - Mitrović razočaran nad rezervisti “ Vsaka tekma je pomembna in vsaka zmaga je
    pomembna. To sem igralcem povedal že pred tekmo. V tej sezoni smo že videli, kaj
    se zgodi, ko nasprotnik v Split pride preveč sproščen. Tudi mi smo prišli do trenutka,
    ko igralci s klopi ob vstopu v igro niso izkoristili svoje priložnosti, kar je
    po mojem mnenju najslabši del tekme v Splitu. Klop ni zaigrala z željo in ji ni
    uspelo nadomestiti manjkajoče energije, zato gre posebna zahvala D. J. Stewartu
    in Jaki Blažiču, ki sta kljub slabemu počutju dobro odigrala tekmo, ” je povedal
    trener Zvezdan Mitrović.
  - V sredo pomembno gostovanje v Hamburgu Zdaj se bo vsa osredotočenost ljubljanske
    zasedbe preusmerila na obračun v sredo v Hamburgu. V boju za boljšo razvrstitev
    na lestvici skupine B pred začetkom končnice Evropskega pokala zmaga prinaša končno
    tretje mesto v rednem delu sezone in s tem prednost domačega igrišča v osmini
    finala. Na domači parket se bodo Zmaj vrnili prihodnjo soboto, ko v Tivoli prihaja
    Igokea.
  - Bundović v podaljšku odločil v Novem mestu Krka je zamudila lepo priložnost, da
    pred 800 gledalci v dvorani Leona Štuklja naredi ključen korak do obstanka v Ligi
    ABA. Na izjemno pomembni tekmi za obstanek je Cibona končala niz desetih porazov.
  - Novomeščani so zelo slabo začeli tekmo, prvo četrtino so izgubili s 14:28. Do
    odmora so znižali na 42:48.
  - Na začetku zadnje četrtine je imela Cibona 12 točk naskoka po trojki Petra Joka
    (57:69). Gostje nato pet minut niso dosegli niti točke. Krka je z delnim izidom
    13:0 prevzela vodstvo po košu Taylerja Persona (70:69).
  - V napeti končnici rednega dela sta imeli obe ekipi priložnost za zmago. Jan Špan
