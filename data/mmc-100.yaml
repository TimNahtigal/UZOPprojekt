  - caption: Iz kabineta predsednika vlade so po rednem sestanku med predsednico republike
      in premierjem, ki sta se sešla po ostri izmenjavi, poslali le kratko sporočilo,
      tako da podrobnosti pogovora niso znane.
    img: https://img.rtvcdn.si/_up/upload/2022/11/21/66035644.jpg
    source: BoBo/Borut Živulović
  - caption: Klemen Boštjančič je bil neposreden, saj je rekel, da gre za "politikantsko
      bitko" med predsednico in premierjem.
    img: https://img.rtvcdn.si/_up/upload/2024/10/21/66252314.jpg
    source: BoBo
  id: '739425'
  keywords:
  - Varuh človekovih pravic
  - Evropska centralna banka
  - Kadrovska vprašanja
  - Predsednica republike
  - Golob
  lead: Premier Robert Golob je ocenil, da je ravnanje predsednice Nataše Pirc Musar
    pri kadrovskih zadevah neodgovorno in nedržavotvorno. Predsednica republike mu
    odgovarja, da je takšno obračunavanje prek medijev politično nezrelo izsiljevanje.
  mention:
  - Robert Golob
  - Saško Jazbec
  - Klemen Boštjančič
  - Sašo Jazbec
  - Christine Lagarde
  - Donalda Trumpa
  - Klemen Grošelj
  paragraphs:
  - Predsednik vlade Robert Golob je v intervjuju za N1 poudaril, da je ravno v tem
    času, ko zaradi spremenjenih varnostnih razmer celotna Evropa hiti v dvigovanje
    izdatkov za obrambo, Slovenija brez predstavnika v Svetu Evropske centralne banke
    pri odločitvah s področja denarne politike.
  - '" Po domače. Zato ker predsednica ne zmore opravljati svoje naloge, je Slovenija
    brez predstavnika točno na točki, kjer se odloča o obrambnih izdatkih. Ali se
    vam to zdi državotvorno? Meni ne čisto," je bil do predsednice republike Nataše
    Pirc Musar kritičen Golob.'
  - '" V primeru guvernerja je koalicija od prvega dne popolnoma jasna. Imamo eno
    od kandidatk, ki je bila prijavljena, ki izpolnjuje vse strokovne kriterije in
    ki ima politično podporo. Ker te kandidatke iz neznanih razlogov ne znamo poslati
    v parlament, je Slovenija v tem trenutku v Evropski centralni banki brez glasovalnih
    pravic. To se mi zdi neodgovorno," je še dodal.'
  - Če bi kandidatko za guvernerko Banke Slovenije Saško Jazbec lahko izvolili samo
    s podporo koalicije, pa predsednica išče tudi kandidata za novega varuha človekovih
    pravic, ki pa za izvolitev potrebuje dvotretjinsko večino. Njena favoritinja je
    bila Katarina Bervar Sternad, a se je izkazalo, da nima zadostne podpore. Koalicija
    je sicer podporo predsedničini favoritinji obljubila, a to ne zadostuje.
  - '" Varuh človekovih pravic je pomembna institucija in koalicija je dala enotno
    podporo kandidatki predsednice republike. Več od tega koalicija ne more narediti.
    Odgovornost, da najde kandidata, ki bo dobil 60 glasov, ni na koaliciji, ampak
    na predsednici. Predsednica mora to odgovornost sprejeti nase in je ne more prenašati
    na kogar koli drugega, ko ji to ustreza. Mi smo svojo podporo njeni kandidatki
    zagotovili, od tu je pa to izključno tako odgovornost predsednice kot tudi njena
    naloga," je za N1 dejal predsednik vlade.'
  - '" Nad izjavami predsednika vlade sem zgrožena, saj kažejo na nespoštovanje in
    nerazumevanje načela delitve oblasti. Razočarana sem tudi po človeški plati, zato
    moram podati še nekaj dodatnih pojasnil. Prvič, Evropska centralna banka ne odloča
    o povišanju izdatkov za obrambo in varnost. Področje izdatkov za obrambo države
    sodi na področje fiskalne politike, ki se oblikuje na ravni posameznih držav članic
    Evropske unije in Evropske komisije, Evropska centralna banka pa izvaja pristojnosti
    s področja denarne politike in praviloma poskusi najti soglasje, da glasovanje
    o odločitvah iz pristojnosti banke ni potrebno," je predsednica republike odgovorila
    premierju v svoji izjavi za javnost.'
  - '" O področju obrambnih izdatkov držav odloča fiskalna politika, torej vlade posameznih
    držav. To je poudarila tudi predsednica Evropske centralne banke Christine Lagarde.
    To bi predsednik vlade seveda moral vedeti, zato me njegove izjave zelo skrbijo,
    saj v tem zahtevnem obdobju kažejo na nerazumevanje osnovnega delovanja politike,
    političnih procesov ter pomena delitve oblasti in delovanja neodvisnih institucij,"
    je dodala.'
  - Po njenem mnenju je nedržavotvorno tudi neargumentirano obračunavanje predsednika
    vlade o tako pomembnih postopkih prek medijev. " To je politično nezrelo izsiljevanje.
    Od nekdaj verjamem v nujnost argumentiranega dialoga v politiki, pogovor v politiki
    nikoli in nikdar ni in ne sme biti izguba časa. Moja vrata so bila vedno in ostajajo
    še naprej odprta za pogovor," je dejala in napovedala, da je sicer nameravala
    DZ-ju v imenovanje za guvernerja Banke Slovenije predlagati Saško Jazbec, " kljub
    pritiskom in upravičenim pomislekom ".
  - '"S podporo koalicije oziroma Gibanja Svoboda Saški Jazbec sem bila seznanjena
    prek medijev, čeprav so bili vsi povabljeni na razgovor. To je bilo nespoštljivo
    do institucije predsednika države, kar sem tudi odkrito povedala, predvsem pa
    me je zmotilo sleherno zavračanje pogovora o katerih koli mojih drugih predlogih.
    O tem sem želela govoriti tudi s predsednikom vlade, ki je tudi predsednik največje
    koalicijske stranke, a me je dvakrat zavrnil," je še pojasnila Pirc Musar, ki
    je zgrožena nad trditvijo Goloba, da usklajevanje v procesih imenovanj ni potrebno.'
  - '" V postopku imenovanja ima predsednik države vlogo predlagatelja, državni zbor
    pa vlogo glasovalca o predlogu. Vlada v to enačbo ni vključena," je poudarila
    in dodala, da je pri posvetovanjih glede guvernerja centralne banke naletela na
    koalicijski zid. "Iz spoštovanja do kandidatov pa v državni zbor ne bom kar tako
    pošiljala predlogov, če se o njih nihče ne želi niti pogovarjati, kaj šele usklajevati,"
    je napovedala Pirc Musar, ki je še ocenila, da Golobov pogovor za N1 kaže, da
    " državotvornost vidi zgolj konfrontacijsko, kadar ima kdo drugačno stališče ali
    ko izrazi pomisleke". "Veste, če to sodi v predvolilno leto, na to pristajam,
    ampak vseeno ostajam trdno zavezana pogovorom," je še dodala predsednica republike,
    ki si želi, da bi bili odnosi s premierjem Golobom boljši: " Vsi lahko opazite,
    da dobri niso."'
  - Zaradi izmenjave ostrih besed so se sprva pojavili pomisleki o tem, ali se bosta
    Golob in Pirc Musar sešla na rednem srečanju, ki je bilo predvideno popoldne.
    A oba sta še pred začetkom sestanka zatrdila, da ga ne nameravata preklicati.
    Po koncu pogovora Pirc Musar in Golob izjav nista dajala. Iz premierjevega kabineta
    so sporočili le, da sta predsednica republike in premier enotna, da v danih razmerah
    ne obstaja nikakršna možnost za napotitev slovenskih vojakov v Ukrajino.
  - Dodali so še, da sta se Golob in Pirc Musar v okviru rednih srečanj dotaknila
    tudi zapletenih mednarodnih razmer, oba pa podpirata mirovna prizadevanja in pozivata
    vse strani, da izkoristijo priložnost za mir. Niso pa navedli, ali sta govorila
    tudi o odprtih postopkih glede imenovanj kandidatov za vodenje nekaterih državnih
    institucij, zaradi katerih sta si pred srečanjem izmenjala ostre besede.
  - Finančni minister Klemen Boštjančič si želi čimprejšnje imenovanje novega guvernerja
    Banke Slovenije. "Delovanje monetarne politike, nad katero bdi Evropska centralna
    banka (ECB), in fiskalnimi politikami, ki jih vodijo vlade, je zelo povezano,"
    je povedal v izjavi za javnost. Spomnil je na ukrepe, ki sta jih obe politiki
    usklajeno izvajali v času visoke inflacije v Evropi.
  - '"Verjamem, da je skrajni čas, da se zadeva glede guvernerja razplete," je bil
    glede ostrih besed med premierjem in predsednico na to temo jasen Boštjančič.
    "Nobena skrivnost ni, da podpiram svojo kolegico, državno sekretarko Sašo Jazbec.
    Izmed kandidatov je najbolj kompetentna in najbolj strokovna. Tako mi je žal,
    da se je znašla v tej politični ali celo politikantski bitki, ker je predvsem
    strokovnjakinja," je sklenil minister.'
  - Danes se po njegovih besedah stvari v svetu dogajajo z veliko hitrostjo. "In ob
    pogovorih o obrambi se je pokazalo to, da moramo delovati enotno," je dejal. Kot
    je pojasnil, je namreč na ponedeljkovem sestanku s finančnimi ministri EU-ja predsednica
    ECB-ja Christine Lagarde izrazila zaskrbljenost nad delovanjem ZDA pod vodstvom
    predsednika Donalda Trumpa.
  - '"Dejstvo je, da je finančni sistem tesno povezan z delovanjem vseh preostalih
    podsistemov. Stvari, ki se dogajajo v svetu, ogrožajo evropski finančni sistem,
    lahko so celo napad na evropski finančni sistem, tako da je to zelo povezano tudi
    z obrambo in varnostjo," je povedal.'
  - Tako razume kontekst pogovora premierja Roberta Goloba za N1, v katerem je ta
    med drugim dejal, da je Slovenija ravno v času, ko zaradi spremenjenih varnostnih
    razmer Evropa hiti v dvigovanje izdatkov za obrambo, brez predstavnika v Svetu
    ECB-ja pri odločitvah s področja denarne politike. "Zelo jasno je, da so pristojnosti
    ECB-ja vodenje monetarne politike, in kaj so pristojnosti Evropske komisije oz.
    posameznih vlad, torej fiskalne politike," je dejal minister.
  - '"Sama sem v imenu poslanske skupine Svoboda večkrat povedala predsednici na pogovorih,
    da nas skrbi, da takšne institucije ostajajo brez predstojnikov, še danes menim
    enako in o tem je govoril tudi predsednik (Golob)," je v odzivu na dogajanje za
    Televizijo Slovenija dejala vodja poslanske skupine Svoboda Nataša Avšič Bogovič.'
  - '"Treba bo dati ego na stran. Morala se bosta usesti brez sija žarometov in se
    dogovoriti o tem, kako sodelovati naprej," pa je zaostritev odnosa med premierjem
    in predsednico komentiral vodja poslanske skupine NSi-ja Janez Cigler Kralj.'
  - “ Res ne razumem te nove oblike "državotvornosti", da prek javnih nastopov izsiljuješ
    s svojo kandidatko za guvernerko Banke Slovenije. Še manj pa vodo pijejo argumenti,
    da glasovalne pravice v ECB-ju kakor koli vplivajo na odločitve vlade (ali Slovenije)
    o višanju naših obrambnih izdatkov. Gre zgolj za izsiljevanje predsednice, da
    predlaga "pravo kandidatko" in nič drugega, Zato, dajte se že okoli teh kandidatur
    dogovoriti državotvorno za kamerami, potem pa skupaj stopite pred mikrofone! "
    je na družbenem omrežju Facebooku Golobove izjave komentirala nekdanja članica
    Gibanja Svobode, nepovezana poslanka Mojca Šetinc Pašek.
  - Nekdanji evropski poslanec Klemen Grošelj pa se je na omrežju X spraševal, kaj
    ima ECB z obrambnimi izdatki. " Njena naloga je zagotavljanje stabilnosti cen.
    Lagarde je poudarila pred dnevi, da naloga ECB-ja ni financiranje obrambnih izdatkov.
    Je pa res, da v EU-ju tudi EIB kreditira obrambne projekte," je zapisal.
  title: 'Golob in Pirc Musar izmenjala ostre besede. Boštjančič: Gre za politikantsko
    bitko.'
