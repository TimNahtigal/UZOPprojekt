  paragraphs:
  - To so bile prve stopničke na skakalnici Salpausselkä v Lahtiju za Prevca, ki bo
    čez tri tedne v Planici končal kariero. Dvakrat je bil drugi še na ekipnih tekmah
    na tem finskem prizorišču (2020 in 2022).
  - V zadnjih tednih je v sijajni formi. Na obeh posamičnih tekmah v Oberstdorfu pretekli
    konec tedna je bil drugi, z današnjimi stopničkami pa ima zdaj v karieri jubilejnih
    60 uvrstitev na oder za zmagovalce med posamezniki. Ostaja pri 23 zmagah.
  - Starejši od bratov Prevc je bil po prvi seriji tretji z malenkostnim zaostankom
    za vodilnim Hörlom. V drugem poskusu je 31-letnik iz Selške doline skočil 131
    m in zanesljivo prevzel vodstvo.
  - Na vrhu sta bila le še Aleksander Zniszczol in Hörl. Poljak je skočil 129,5 m
    in zaostal deset točk, a si je zagotovil stopničke, Hörl pa je skočil 134,5 m
    in za 1,9 točke premagal Prevca.
  - Kos osvojil le sedem točk, Domen Prevc diskvalificiran Lovro Kos tokrat ni bil
    pri vrhu. V petek je na prvi posamični tekmi zmagal, tokrat pa je v zahtevnih
    vetrovnih razmerah preizkušnjo končal na 24. mestu. Domen Prevc je bil po drugem
    skoku na koncu diskvalificiran zaradi neustreznega dresa. Zasedel je končno 30.
    mesto. Brez finala sta ostala Žak Mogel na 33. in Maksim Bartolj na 41. mestu.
  - 'Hrgota: Bolj srečni ne moremo zapustiti Lahtija " Odličen zaključek vikenda v
    Lahtiju, drugo mesto. Štiriindvajseta tekma mi je končno prinesla posamične stopničke.
    Vesel sem, da sem tudi v Lahtiju prišel do super izida s super skoki, " je povedal
    Peter Prevc.'
  - '" Res lep zaključek konca tedna, da je Petru uspelo na zmagovalni oder v Lahtiju
    prvič v karieri. Bolj srečni ne moremo zapustiti Lahtija. Škoda zmage, a mislim,
    da za to še pride čas," je dodal glavni trener slovenske reprezentance Robert
    Hrgota.'
  - Kraft ima 196 točk naskoka pred Kobajašijem V skupnem seštevku je vodstvo ohranil
    Stefan Kraft, ki je po današnjem osmem mestu zbral 1578 točk. Sledi mu Rjoju Kobajaši
    s 1382 točkami. Najboljši Slovenec je še naprej Kos, ki je šesti s 675 točkami.
    Peter Prevc je napredoval na osmo mesto (668 točk).
  - Naslednji teden začetek turneje Raw Air v Oslu Do konca sezone so po Lahtiju na
    sporedu še štiri prizorišča, tri od teh na Norveškem, kjer se bo v Oslu na slovitem
    Holmenkollnu prihodnji konec tedna začela turneja Raw Air.
